<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalPoint</title>
<style>
/* SalPoint — estilos. Desktop primeiro; responsivo básico (<900px). */
:root{
  --bg:#f0f2f5; --surface:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --border-strong:#d1d5db;
  --primary:#16a34a; --primary-dark:#15803d; --primary-soft:#dcfce7; --accent:#d97706; --accent-soft:#fef3c7;
  --success:#16a34a; --success-soft:#dcfce7; --danger:#dc2626; --danger-soft:#fee2e2; --info-soft:#dbeafe;
  --sidebar:#1e2330; --sidebar-text:#9ca3af; --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.25} h1{font-size:1.65rem;letter-spacing:-.01em} h2{font-size:1.1rem} h3{font-size:1rem}
p{margin:.25rem 0 .75rem}
.muted{color:var(--muted)} .small{font-size:.85rem} .strong{font-weight:600;color:var(--text)}
[hidden]{display:none!important}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex:none;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;text-decoration:none!important}
.brand-mark{font-size:1.7rem;line-height:1} .brand strong{display:block;font-size:1.05rem} .brand small{display:block;color:var(--sidebar-text);font-size:.78rem}
.side-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text);font-weight:500;text-decoration:none!important}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.glyph{width:1.3rem;text-align:center}
.side-foot{margin-top:auto;font-size:.78rem;color:#8e9bb8;padding:10px 8px;line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc97;margin-right:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border);min-height:56px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs .here{color:var(--text);font-weight:600} .crumbs .sep{color:var(--border-strong)}
.topbar-actions{display:flex;gap:8px}
.tbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 28px 0}
.tbar-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;text-decoration:none!important}
.tab:hover{color:var(--text)} .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab.soon{opacity:.55;font-style:italic}
.tab.soon::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border-strong);margin-left:6px;vertical-align:middle}
.content{padding:26px 28px 60px;max-width:1240px;width:100%}
.narrow{max-width:760px}
.page-head{margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px} .page-head p{flex-basis:100%;margin:0}
.section{margin-top:26px} .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row{display:flex;align-items:center} .between{justify-content:space-between} .gap{gap:8px} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px} .spacer{flex:1}

/* componentes */
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap} .issues{margin:6px 0 10px;padding-left:18px;font-size:.9rem;color:var(--danger)}
.page-head .head-actions{align-self:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.card.flush{padding:0;overflow:hidden} .card h2,.card h3{margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.t-card h3{font-size:1.1rem;margin:0} .t-card .meta{margin:14px 0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.meta div{min-width:0} .meta dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)} .meta dd{margin:2px 0 0;font-weight:500}
.meta.stacked{grid-template-columns:1fr}
.hero h1{margin-bottom:8px} .hero-meta{color:var(--muted);font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile-value{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1} .tile-label{color:var(--muted);font-size:.85rem} .tile-note{font-size:.78rem;color:var(--success);margin-top:2px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge.muted{background:#eceff5;color:var(--muted)} .badge.success{background:var(--success-soft);color:var(--success)}
.badge.info{background:var(--info-soft);color:var(--primary-dark)} .badge.accent{background:var(--accent-soft);color:#8a5600}
.empty{background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:44px 24px;text-align:center;color:var(--muted)}
.empty-title{font-size:1.1rem;font-weight:600;color:var(--text);margin-bottom:4px} .empty .btn{margin-top:10px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none!important;line-height:1.2}
.btn:hover{background:#f5f7fb} .btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,87,214,.35);outline-offset:1px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn.primary:hover{background:var(--primary-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger)} .btn.danger-ghost:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:.85rem} .btn.lg{padding:11px 20px;font-size:1rem} .btn[disabled]{opacity:.55;cursor:not-allowed}

/* tabelas */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.flush .table-wrap{border:0;box-shadow:none;border-radius:0}
.table{width:100%;border-collapse:collapse;font-size:.93rem}
.table th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 10px;background:#f8f9fc;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle} .table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:#fafbfe} .table tr.inactive td{color:var(--muted)} .table tr.inactive .strong{color:var(--muted)}
.table td.actions{text-align:right;white-space:nowrap} .table td.actions .btn+.btn{margin-left:4px}
.table td:first-child{min-width:170px} .table td:not(:first-child):not(.wrap-ok){white-space:nowrap}
.table td.actions .btn.sm{padding:4px 9px;font-size:.82rem}

/* formulários */
.form{display:flex;flex-direction:column;gap:14px} .form.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0} .field.wide,.form-actions.wide,.form-error{grid-column:1/-1}
.field label{font-weight:600;font-size:.88rem} .req{color:var(--danger)}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;font:inherit;color:var(--text);background:#fff;min-height:40px}
input:focus,select:focus{border-color:var(--primary)}
.hint{font-size:.8rem;color:var(--muted)} .error{font-size:.82rem;color:var(--danger);min-height:0} .error:empty{display:none}
.field.invalid input,.field.invalid select{border-color:var(--danger);background:#fffafb}
.form-error{background:var(--danger-soft);color:var(--danger);border:1px solid #f4b6c0;border-radius:8px;padding:10px 12px;font-size:.9rem}
.form-actions{display:flex;gap:8px;align-items:center;padding-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer} .check input{margin-top:4px;width:17px;height:17px;flex:none}
.catalog-select{display:flex;flex-direction:column;gap:8px} .custom-row{display:flex;gap:8px} .custom-row .size{width:110px;flex:none}
.inline-add{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end} .inline-add .athletes{grid-column:1/-1}
.inline-add .field[data-field=athletes]{grid-column:1/-1} .athletes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;align-items:start}
.soon-list{list-style:none;margin:0;padding:0} .soon-list li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border)}
.soon-list small{background:var(--border);color:var(--muted);padding:1px 8px;border-radius:99px;font-size:.72rem;align-self:center}
/* formato de jogos */
.match-format-fieldset{border:1px solid var(--border);border-radius:8px;padding:14px 16px 8px;margin:0}
.match-format-fieldset legend{font-weight:600;font-size:.95rem;padding:0 6px}
.match-format-fieldset .field{margin-bottom:8px}
.tiebreak-field{transition:all .2s}

/* regras de competição */
.rules-tiebreak,.rules-scoring{margin-bottom:18px}
.rules-tiebreak h3,.rules-scoring h3{font-size:.95rem;margin-bottom:10px;color:var(--text)}
.criteria-list{list-style:none;margin:8px 0;padding:0;counter-reset:none}
.criteria-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;background:var(--surface);font-size:.9rem}
.criteria-row.editable{background:var(--primary-soft)}
.criteria-pos{font-weight:700;color:var(--primary);min-width:22px}
.criteria-label{flex:1}
.criteria-row .btn.sm{padding:2px 8px;font-size:.78rem;min-width:auto}
.criteria-row .btn.sm.danger{color:var(--danger);border-color:var(--danger)}
.criteria-add{margin:6px 0}
.criteria-add select{font-size:.85rem}
.rules-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scoring-outcomes{margin-top:6px;font-size:.88rem}
.scoring-outcome{padding:4px 0;display:flex;gap:4px;align-items:center}
.wa-btn{background:#25D366!important;color:#fff!important;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-top:4px}
.wa-btn:hover{background:#1DA851!important}

.catalog-list{list-style:none;margin:0 0 14px;padding:0} .catalog-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)} .catalog-list li:first-child{border-top:0} .catalog-list li.inactive .strong{color:var(--muted);text-decoration:line-through}
.teams-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px}
.cat-link{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;color:var(--text);text-decoration:none!important} .cat-link:hover{background:#f3f5fa}
.cat-link.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600} .cat-link.inactive{color:var(--muted)} .cat-link small{color:var(--muted);white-space:nowrap}

/* modal e avisos */
.overlay{position:fixed;inset:0;background:rgba(14,26,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;padding:22px 24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.3)} .modal h2{margin-bottom:12px;font-size:1.2rem}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}   /* avisos nunca interceptam cliques no que está por baixo */
.toast{background:#13213f;color:#fff;padding:11px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;max-width:360px;border-left:4px solid #3ddc97}
.toast.error{border-left-color:#ff6b81}

/* ===== Wizard de criação de torneio ===== */
.wz-steps{display:flex;align-items:flex-start;justify-content:center;gap:0;margin-bottom:28px;padding:4px 0}
.wz-step{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;flex:1;max-width:120px}
.wz-step:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:rgba(255,255,255,.12);z-index:0}
.wz-step.done:not(:last-child)::after{background:var(--primary)}
.wz-dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--card);position:relative;z-index:1;transition:all .2s}
.wz-step.active .wz-dot{border-color:var(--primary);color:var(--primary);background:rgba(99,179,237,.12)}
.wz-step.done .wz-dot{border-color:#3ddc97;background:#3ddc97;color:#0d1117}
.wz-label{font-size:.68rem;font-weight:600;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;text-align:center}
.wz-step.active .wz-label{color:var(--primary)}
.wz-step.done .wz-label{color:#3ddc97}
.wz-body{display:flex;flex-direction:column;gap:16px}
.wz-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.wz-cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid rgba(255,255,255,.07)}
.wz-cat-item .wz-cat-name{flex:1;font-weight:600}
.wz-cat-delete{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:2px 6px;border-radius:4px;transition:color .15s}
.wz-cat-delete:hover{color:#ff6b81}
.wz-add-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.wz-add-row .field{margin:0;flex:1;min-width:140px}
.wz-team-section{margin-bottom:16px}
.wz-team-section h4{font-size:.85rem;font-weight:700;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wz-team-row{display:flex;gap:8px;align-items:center;padding:7px 10px;background:rgba(255,255,255,.03);border-radius:6px;margin-bottom:5px}
.wz-team-row span{flex:1;font-size:.9rem}
.wz-summary-cat{padding:10px 14px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:10px}
.wz-summary-cat h4{margin:0 0 6px;font-size:.88rem;font-weight:700}
.wz-summary-cat ul{margin:0;padding-left:18px;font-size:.85rem;color:var(--muted)}
.wz-empty-hint{color:var(--muted);font-size:.85rem;font-style:italic;padding:8px 0}

/* ===== Bottom Navigation — mobile ===== */
.bottom-nav{display:none}
.bn-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:200;display:none}
.bn-sheet{position:fixed;left:0;right:0;bottom:58px;background:var(--sidebar);border:1px solid rgba(255,255,255,.1);border-top-left-radius:16px;border-top-right-radius:16px;padding:16px 8px 8px;z-index:201;max-height:72vh;overflow-y:auto;display:none}
.bs-item{display:flex;align-items:center;gap:12px;padding:11px 16px;color:var(--sidebar-text);text-decoration:none!important;font-weight:500;border-radius:8px;font-size:.93rem}
.bs-item:hover{background:rgba(255,255,255,.07);color:#fff}
.bs-item.active{color:var(--primary)}
.bs-sep{height:1px;background:rgba(255,255,255,.07);margin:6px 16px}
.bs-glyph{width:22px;text-align:center;font-size:1rem}
/* ocultar bottom-nav em modos fullscreen */
#app.tv-fullscreen .bottom-nav,#app.view-fullscreen .bottom-nav{display:none!important}

/* responsivo básico */
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)} .two-col{grid-template-columns:1fr}}

@media (max-width:768px){
  .sidebar{display:none!important}
  .main{width:100%}
  .topbar,.tbar{padding-left:14px;padding-right:14px}
  .content{padding:14px 14px calc(68px + env(safe-area-inset-bottom,0))}
  .tiles{grid-template-columns:repeat(2,1fr)} .form.grid{grid-template-columns:1fr} .teams-layout{grid-template-columns:1fr}
  .cat-list{flex-direction:row;overflow-x:auto} .inline-add{grid-template-columns:1fr}
  .topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border)}
  /* bottom nav visível */
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--sidebar);border-top:1px solid rgba(255,255,255,.08);z-index:150;padding-bottom:env(safe-area-inset-bottom,0)}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sidebar-text);text-decoration:none!important;font-size:.6rem;font-weight:600;letter-spacing:.03em;padding:6px 2px;border:none;background:none;cursor:pointer;transition:color .15s;-webkit-tap-highlight-color:transparent}
  .bn-item:hover,.bn-item:focus{color:#fff;outline:none}
  .bn-item.active{color:var(--primary)}
  .bn-icon{font-size:1.3rem;line-height:1;display:block}
  .bn-label{display:block;line-height:1}
  .bn-overlay:not([hidden]){display:block}
  .bn-sheet:not([hidden]){display:block}
}
@media (max-width:900px) and (min-width:769px){
  .app{flex-direction:column} .sidebar{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto}
  .brand{padding:0 8px 0 0} .brand small,.side-foot{display:none} .side-nav{flex-direction:row;gap:2px} .nav-item{white-space:nowrap;padding:8px 10px}
  .topbar,.tbar{padding-left:16px;padding-right:16px} .content{padding:18px 16px 50px}
  .tiles{grid-template-columns:repeat(2,1fr)} .form.grid{grid-template-columns:1fr} .teams-layout{grid-template-columns:1fr}
  .cat-list{flex-direction:row;overflow-x:auto} .inline-add{grid-template-columns:1fr}
}

/* sorteio e grupos */
.badge.lg{font-size:.9rem;padding:4px 14px} .warn{color:#8a5600;font-weight:600} .ok{color:var(--success);font-weight:600}
.radios{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px} .check.radio{font-weight:600}
.panel{background:#f8f9fc;border:1px solid var(--border);border-radius:8px;padding:14px 16px} .panel input[type=text]{max-width:220px}
.issues-list{margin:6px 0 12px;padding-left:20px;color:#8a5600}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.group-head{display:flex;align-items:center;gap:10px;margin-bottom:8px} .group-head h3{margin:0} .group-head .btn{margin-left:auto}
.slots{list-style:none;margin:0;padding:0} .slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);min-height:48px;flex-wrap:wrap}
.slot:first-child{border-top:0} .slot .pos{font-size:.78rem;font-weight:600;color:var(--muted);width:76px;flex:none;text-transform:uppercase;letter-spacing:.03em}
.slot .team-name{font-weight:600;flex:1;min-width:120px} .slot-actions{display:flex;gap:6px;margin-left:auto} .slot.filled{background:#fbfcff}
.slot.empty .picker{flex:1;min-width:160px}
.picker{position:relative} .picker input{width:100%;padding:7px 10px;border:1px dashed var(--border-strong);border-radius:8px;font:inherit;min-height:36px;background:#fff}
.picker-list{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 10px 30px rgba(14,26,51,.18);max-height:260px;overflow:auto}
.picker-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer} .picker-item:hover{background:var(--primary-soft)}
.picker-item.used{color:var(--muted);background:#f6f7fa} .picker-item.used small{color:#8a5600;font-weight:600} .picker-empty{padding:10px;color:var(--muted)}
.check-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px 24px}
.check-list li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)} .check-list .mark{width:1.2rem} .check-list li.ok .mark{color:var(--success)} .check-list li.bad{color:#8a5600} .check-list .arrow{color:var(--muted)}
.history{list-style:none;margin:0;padding:0} .history li{padding:9px 0;border-top:1px solid var(--border)} .history li:first-child{border-top:0}
/* Bracket / Standings */
.bracket-view{max-width:960px}
.standings-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;margin-top:12px}
.standings-table{width:100%;border-collapse:collapse;font-size:.88rem} .standings-table th,.standings-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
.standings-table th.num,.standings-table td.num{text-align:center;min-width:32px}
.standings-table .rank{font-weight:700;color:var(--muted);width:32px}
.standings-table .wins{font-weight:700}
.standings-table .diff.positive{color:var(--success)} .standings-table .diff.negative{color:#b00020}
.qualified td{background:#e8f5e9} .qualified .rank{color:var(--success)}
.no-matches td{color:var(--muted)}
.standings-legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.82rem;color:var(--muted);margin:8px 0}
.group-heading{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.group-heading .group-name{font-size:1.05rem} .group-heading .group-progress{font-size:.78rem}
.qualified-hint{font-size:.82rem;color:var(--muted);margin:4px 0 0}
.matches-summary{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.88rem;flex-wrap:wrap}
.group-matches{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.group-matches-title{font-size:.95rem;font-weight:700;margin:0;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;background:rgba(255,255,255,.03);transition:background .15s}
.group-matches-title:hover{background:rgba(255,255,255,.06)}
.group-matches-title .gm-chevron{font-size:.75rem;transition:transform .2s;color:var(--muted)}
.group-matches.open .gm-chevron{transform:rotate(180deg)}
.group-matches-body{display:none;padding:10px 12px 12px}
.group-matches.open .group-matches-body{display:block}
/* seção única (sem acordeão): mantém visual simples */
.group-matches.solo{border:none;border-radius:0}
.group-matches.solo .group-matches-title{cursor:default;background:none;border-bottom:2px solid var(--border);padding:16px 0 4px;font-size:1rem}
.group-matches.solo .group-matches-title:hover{background:none}
.group-matches.solo .group-matches-body{display:block;padding:0}
/* Match cards */
.match-cards{display:flex;flex-direction:column;gap:8px}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:box-shadow .15s}
.match-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.match-card.live{border-color:#dc2626}
.match-card.done{border-color:var(--success,#16a34a)}
.match-card.cancelled{opacity:.65}
.match-card-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 12px}
.match-round-chip{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--bg,#f1f5f9);border-radius:20px;padding:3px 8px;white-space:nowrap;letter-spacing:.03em}
.match-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.match-team-row{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.match-team-a{text-align:right;font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-team-b{text-align:left;font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-team-a.winner,.match-team-b.winner{font-weight:700;color:var(--success,#16a34a)}
.match-score-block{text-align:center;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.match-score-sets-big{font-size:.95rem;font-weight:700;color:var(--text);white-space:nowrap;line-height:1}
.match-score-detail{font-size:.65rem;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.match-vs{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center}
.match-side-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.match-status-pill{font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill-green{background:#dcfce7;color:#15803d}
.pill-red{background:#fee2e2;color:#b91c1c;animation:pulse-live 1.4s ease-in-out infinite}
.pill-blue{background:#dbeafe;color:#1d4ed8}
.pill-gray{background:#f1f5f9;color:var(--muted)}
.pill-orange{background:#ffedd5;color:#c2410c}
.match-primary-btn{font-size:.75rem;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:500;white-space:nowrap}
.match-primary-btn.accent{background:var(--primary,#16a34a);color:#fff;border-color:var(--primary,#16a34a)}
.match-primary-btn.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.match-card-footer{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;border-top:1px solid var(--border);flex-wrap:wrap}
.match-card-footer.live-bar{background:#fff0f0;border-color:#fecaca}
.match-sched-chip{font-size:.72rem;color:var(--muted);background:var(--bg,#f1f5f9);border-radius:4px;padding:2px 7px;white-space:nowrap}
.match-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.match-card-actions .btn.sm{font-size:.72rem;padding:3px 8px}
.cat-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border)}
.cat-tabs .tab{padding:8px 16px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px}
.cat-tabs .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Knockout bracket */
.ko-bracket{margin-top:24px;border-top:2px solid var(--border);padding-top:16px}
.ko-rounds{display:flex;gap:24px;overflow-x:auto;padding:8px 0}
.ko-round{min-width:200px;flex-shrink:0}
.ko-round-title{font-size:.9rem;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
.ko-match{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.ko-match.live{border-color:#dc2626}
.ko-live-bar{display:flex;justify-content:center;padding:4px 8px;background:#fff0f0;border-bottom:1px solid #fecaca}
.badge.ao-vivo{background:#dc2626;color:#fff;animation:pulse-live 1.4s ease-in-out infinite}
.badge.ao-vivo::before{content:'● ';font-size:.7em}
@keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.55}}
.ko-match-edit .ko-team{cursor:pointer}
.ko-match-edit .ko-team:hover{background:var(--hover,rgba(0,0,0,.04))}
.ko-slot-edit{border-bottom:2px dashed var(--accent,#3b82f6);padding-bottom:1px}
.ko-slot-sel{background:var(--accent,#3b82f6);color:#fff;border-radius:4px;padding:1px 6px}
.ko-match.finished{border-color:var(--success)}
.ko-team{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)}
.ko-team:last-child{border-bottom:0}
.ko-team.winner{background:#e8f5e9;font-weight:600}
.ko-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ko-score{font-weight:700;color:var(--primary);min-width:30px;text-align:right}
.ko-third{margin-top:16px;border-top:1px dashed var(--border);padding-top:12px}
.ko-generate{margin-top:18px;padding:16px;background:#f0f4ff;border-radius:8px;text-align:center}
.ko-generate p{margin:0 0 10px;color:var(--muted)}
/* Classificados (who advanced) */
.qualified-section{margin-top:20px;border-top:2px solid var(--border);padding-top:14px}
.qualified-group{margin-bottom:12px}
.qualified-group h4{font-size:.9rem;font-weight:600;color:var(--muted);margin:0 0 6px}
.qualified-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.qualified-list li{background:#e8f5e9;color:#1b5e20;padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:500}
/* Classificação detail view */
.standings-view{max-width:960px}
.ko-detail-wrap{margin-top:12px}
.ko-detail-round{margin-bottom:20px}
.ko-detail-matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ko-detail-match{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ko-detail-match.finished{border-color:var(--success)}
.ko-detail-teams{padding:0}
.ko-detail-team{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.ko-detail-team:last-child{border-bottom:0}
.ko-detail-team.winner{background:#e8f5e9;font-weight:600}
.ko-detail-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ko-detail-score{font-weight:700;color:var(--primary);min-width:40px;text-align:right}
.ko-detail-meta{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--bg);border-top:1px solid var(--border);font-size:.82rem}
.ko-detail-schedule{color:var(--muted)}
/* Resultados / Pódio */
.results-view{max-width:960px}
.results-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.results-header h2{margin:0;font-size:1.15rem}
.results-section{margin-top:20px}
.podium-wrap{margin-top:8px}
.podium-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.podium-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.podium-icon{font-size:2rem;line-height:1;flex:none}
.podium-place{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.podium-team{font-size:1.05rem;font-weight:700;margin-top:2px}
.podium-detail{font-size:.82rem;color:var(--muted);margin-top:2px}
.podium-gold{border-color:#d4a017;background:linear-gradient(135deg,#fffbea 0%,#fff8e1 100%)}
.podium-gold .podium-place{color:#9e7b0a}
.podium-silver{border-color:#b0bec5;background:linear-gradient(135deg,#f5f5f5 0%,#eceff1 100%)}
.podium-silver .podium-place{color:#607d8b}
.podium-bronze{border-color:#c69c6d;background:linear-gradient(135deg,#fff3e0 0%,#ffe0b2 100%)}
.podium-bronze .podium-place{color:#8d6e3f}
.podium-fourth{border-color:var(--border)}
.podium-fourth .podium-place{color:var(--muted)}
.podium-fourth .podium-icon{font-size:1.3rem;width:2rem;text-align:center;color:var(--muted);font-weight:700}
.podium-pending{padding:24px 0}
.results-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.stat-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat-label{font-size:.82rem;color:var(--muted);margin-top:2px}
.results-final-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:10px}
.result-final-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.result-final-label{padding:8px 14px;font-weight:600;font-size:.9rem;background:var(--bg);border-bottom:1px solid var(--border)}
.result-final-teams{padding:0}
.result-final-team{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.result-final-team:last-child{border-bottom:0}
.result-final-team.winner{background:#e8f5e9;font-weight:600}
.result-final-vs{text-align:center;padding:2px 14px;color:var(--muted);font-size:.82rem}
.result-final-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-final-score{font-weight:700;color:var(--primary);min-width:40px;text-align:right}
.result-final-status{padding:6px 14px;background:var(--bg);border-top:1px solid var(--border);font-size:.82rem}


/* ===== Arena Clean overrides ===== */
/* Tipografia esportiva */
h1,h2{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
.tile-value{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;letter-spacing:.01em}
.stat-value{font-family:'Barlow Condensed',sans-serif;font-size:1.8rem}
.ko-score,.ko-detail-score,.result-final-score{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;letter-spacing:.02em}
.brand strong{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;letter-spacing:.04em}
.brand-mark{color:#16a34a!important}

/* Sidebar: item ativo com borda verde esquerda */
.nav-item{padding-left:14px;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;border-left-color:transparent}
.nav-item.active{background:rgba(22,163,74,.14);color:#fff;border-left:3px solid #16a34a}

/* Botões */
.btn{transition:background .15s,box-shadow .15s,opacity .15s}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(22,163,74,.35);outline-offset:1px}

/* Cards sombra média */
.card,.group-card,.tile,.stat-item,.podium-card{box-shadow:var(--shadow-md)}

/* Cabeçalho de tabela grafite */
.table th{background:var(--sidebar);color:#fff;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;font-size:.78rem;border-bottom:1px solid #2e3a50}

/* Standings table */
.standings-table th{background:var(--sidebar);color:#fff;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em;padding:7px 8px}
.standings-table .rank{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem}
/* 1º ouro */
.standings-table tr:nth-child(1) td{background:#fef9c3}
.standings-table tr:nth-child(1) .rank{color:var(--accent);font-size:1.1rem}
/* 2º prata */
.standings-table tr:nth-child(2) td{background:#f1f5f9}
/* 3º bronze */
.standings-table tr:nth-child(3) td{background:#fff7ed}
.standings-table tr:nth-child(3) .rank{color:#92400e}
/* qualificados */
.qualified td{background:var(--success-soft)!important}
.qualified .rank{color:var(--success)!important}

/* Partidas: borda colorida por status */
.ko-match.finished{border-left:3px solid var(--success)}
.ko-detail-match.finished{border-left:3px solid var(--success)}
.result-final-card.finished{border-left:3px solid var(--success)}
.ko-team.winner,.ko-detail-team.winner{background:var(--success-soft)}
.result-final-team.winner{background:var(--success-soft)}

/* Ko gerar chave */
.ko-generate{background:var(--primary-soft);border:1px solid #bbf7d0}
.ko-generate p{color:var(--text)}

/* Tabs e cat-links com verde */
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.cat-tabs .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.cat-link.active{background:var(--primary-soft);color:var(--primary-dark)}
.cat-link:hover{background:#f3f4f6}

/* Badges pílula */
.badge{border-radius:9999px;padding:2px 9px;font-size:.74rem;font-weight:600}
.badge.success{background:var(--success-soft);color:var(--success)}
.badge.info{background:var(--info-soft);color:#1d4ed8}

/* Critério ativo */
.criteria-row.editable{background:var(--primary-soft)}
.criteria-pos{color:var(--primary)}

/* Pódio refinado */
.podium-gold{border-color:#d4a017;background:linear-gradient(135deg,#fffbea 0%,#fef3c7 100%)}
.podium-silver{border-color:#b0bec5;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%)}
.podium-bronze{border-color:#c69c6d;background:linear-gradient(135deg,#fff7ed 0%,#fed7aa 100%)}

/* Toasts */
.toast{border-left-color:var(--primary)}
.toast.error{border-left-color:var(--danger)}

/* Dot status */
.dot{background:var(--primary)}

/* Lista qualificados */
.qualified-list li{background:var(--success-soft);color:var(--success)}

/* Input focus verde */
input:focus,select:focus{border-color:var(--primary);outline:none}

/* Picker hover */
.picker-item:hover{background:var(--primary-soft)}

/* Ko scores em destaque */
.ko-score,.ko-detail-score{color:var(--primary)}
.result-final-score{color:var(--primary)}
/* ===== Painel Acesso & Compartilhamento ===== */
.acesso-panel{max-width:640px}
.acesso-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:18px}
.acesso-section h3{margin:0 0 14px;font-size:1rem;font-weight:600;color:var(--text)}
.acesso-field{margin-bottom:12px}
.acesso-field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px;font-weight:500}
.acesso-field input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;background:var(--surface);color:var(--text)}
.acesso-field input:focus{outline:none;border-color:var(--primary)}
.acesso-field input[readonly]{background:var(--surface-alt,#f8f9fa);color:var(--muted);cursor:default}
.acesso-row{display:flex;gap:10px}
.acesso-row .acesso-field{flex:1}
.acesso-status{padding:10px 14px;border-radius:8px;font-size:.88rem;font-weight:500;margin-bottom:14px}
.acesso-status.ok{background:#dcfce7;color:#166534}
.acesso-status.encerrado{background:#fee2e2;color:#991b1b}
.acesso-status.antes{background:#fef9c3;color:#92400e}
.acesso-url-row{display:flex;gap:8px;align-items:center}
.acesso-url-row input{flex:1;font-size:.8rem}
.acesso-qr-wrap{text-align:center;margin-top:14px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:8px;display:inline-block}
.acesso-qr-wrap canvas,.acesso-qr-wrap svg{display:block;margin:0 auto}
.acesso-qr-label{font-size:.75rem;color:var(--muted);margin-top:6px}
.acesso-hint{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.btn-primary,.btn.btn-primary{background:var(--primary,#1f57d6);border-color:var(--primary,#1f57d6);color:#fff}
.btn-primary:hover,.btn.btn-primary:hover{background:#1749b8}
.btn-success,.btn.btn-success{background:#16a34a;border-color:#16a34a;color:#fff}
.btn-success:hover,.btn.btn-success:hover{background:#15803d}
.btn-sm,.btn.btn-sm{padding:5px 10px;font-size:.82rem}
/* ===== Página /view (atleta) ===== */
.view-page{max-width:500px;margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.view-header{text-align:center;padding:16px 0 10px;border-bottom:1px solid var(--border,#e5e7eb);margin-bottom:16px}
.view-header h1{margin:0;font-size:1.1rem;font-weight:700}
.view-header p{margin:4px 0 0;font-size:.8rem;color:var(--muted,#6b7280)}
.view-cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.view-cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border,#e5e7eb);background:none;cursor:pointer;font-size:.82rem;color:var(--muted,#6b7280)}
.view-cat-tab.active{background:var(--primary,#3b82f6);color:#fff;border-color:var(--primary,#3b82f6)}
.view-section-title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#6b7280);margin:0 0 8px;padding-left:2px}
.view-card{background:var(--surface,#fff);border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.view-card.live{border-color:#dc2626}
.view-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.view-teams{display:flex;flex-direction:column;gap:4px}
.view-team-row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}

<body>

<!-- ══════════════════════════════════════════════════════
     CONTROLE DE ACESSO — ajuste os valores abaixo antes
     de cada torneio e rode o push para publicar.
     ══════════════════════════════════════════════════════ -->
<script>
(function () {
  var ACCESS_DEFAULTS = {
    senha:        'RiquelmeLindo',
    senhaAdmin:   'SalgadoKing07',
    inicio:       '2026-11-01 16:20',
    duracaoHoras: 20,
    torneio:      'SalPoint',
    viewUrl:      '',
    githubOwner:  'lipebraw-code',
    githubRepo:   'salgadoking',
    githubToken:  ''
  };
  function loadAccess() {
    try {
      var s = localStorage.getItem('erp_access_cfg');
      if (s) {
        var saved = JSON.parse(s);
        var merged = Object.assign({}, ACCESS_DEFAULTS, saved);
        // campos com default não-vazio: só usa o salvo se não estiver vazio
        ['githubOwner','githubRepo'].forEach(function(k) { if (!merged[k]) merged[k] = ACCESS_DEFAULTS[k]; });
        // nome do produto sempre vem do código, nunca do localStorage
        merged.torneio = ACCESS_DEFAULTS.torneio;
        return merged;
      }
    } catch(e){}
    return Object.assign({}, ACCESS_DEFAULTS);
  }
  function saveAccess(cfg) {
    try { localStorage.setItem('erp_access_cfg', JSON.stringify(cfg)); } catch(e){}
  }
  // expõe para a página de acesso
  (typeof globalThis !== 'undefined' ? globalThis : window).__erpAccess = { load: loadAccess, save: saveAccess, defaults: ACCESS_DEFAULTS };
  var ACCESS = loadAccess();

  // ── Auto-publicação em background ──────────────────────────────
  var _pubTimer = null;
  function _showToast(msg, type) {
    var el = document.getElementById('erp-toast');
    if (!el) { el = document.createElement('div'); el.id = 'erp-toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.className = 'erp-toast erp-toast-' + type + ' show';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.className = 'erp-toast'; }, 3500);
  }
  function _doPublish(store) {
    var cfg = loadAccess();
    if (!cfg.githubToken || !cfg.githubOwner || !cfg.githubRepo) return;
    _showToast('Publicando…', 'info');
    store.list('tournaments').then(function (ts) {
      if (!ts || !ts.length) return;
      var selId = null; try { selId = localStorage.getItem('erp_selected_tournament_id'); } catch(e) {}
      var tournament = (selId && ts.find(function(t){ return t.id === selId; })) || ts[ts.length - 1];
      return store.list('categories', { tournamentId: tournament.id }).then(function (cats) {
        var ids = cats.map(function (c) { return c.id; });
        return Promise.all([
          Promise.all(ids.map(function (id) { return store.list('matches', { categoryId: id }); })).then(function (a) { return [].concat.apply([], a); }),
          Promise.all(ids.map(function (id) { return store.list('teams',   { categoryId: id }); })).then(function (a) { return [].concat.apply([], a); }),
          cats
        ]);
      }).then(function (r) {
        var data = { tournament: tournament, matches: r[0], teams: r[1], categories: r[2], publishedAt: new Date().toISOString() };
        var b64  = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        var url  = 'https://api.github.com/repos/' + cfg.githubOwner + '/' + cfg.githubRepo + '/contents/view-data.json';
        var hdr  = { 'Authorization': 'token ' + cfg.githubToken, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
        return fetch(url, { headers: hdr }).then(function (res) {
          return res.status === 200 ? res.json().then(function (f) { return f.sha; }) : null;
        }).then(function (sha) {
          var body = { message: 'Auto: publicar dados ' + new Date().toLocaleString('pt-BR'), content: b64 };
          if (sha) body.sha = sha;
          return fetch(url, { method: 'PUT', headers: hdr, body: JSON.stringify(body) });
        }).then(function (res) {
          _showToast(res.ok ? 'Publicado ✓' : 'Falha ao publicar', res.ok ? 'ok' : 'err');
        });
      });
    }).catch(function () { _showToast('Falha ao publicar', 'err'); });
  }
  (typeof globalThis !== 'undefined' ? globalThis : window).__erpAutoPublish = function (store) {
    clearTimeout(_pubTimer);
    _pubTimer = setTimeout(function () { _doPublish(store); }, 2500);
  };

  var KEY = 'erp_acesso_ok';

  /* Lê parâmetros de acesso via URL: ?s=2026-11-05T08:00&h=24&p=Senha&gt=GithubToken */
  var URL_ACCESS = (function () {
    try {
      var search = location.search.slice(1);
      var qp = {};
      search.split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) qp[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); });
      /* gt= salva o token do GitHub no localStorage para publicação persistente */
      if (qp.gt) {
        try {
          var cur = JSON.parse(localStorage.getItem('erp_access_cfg') || '{}');
          cur.githubToken = qp.gt;
          localStorage.setItem('erp_access_cfg', JSON.stringify(cur));
        } catch (e) {}
      }
      if (qp.s && qp.h && qp.p) {
        var ua = { inicio: qp.s.replace('T', ' '), duracaoHoras: Number(qp.h), senha: qp.p };
        try { sessionStorage.setItem('erp_url_access', JSON.stringify(ua)); } catch (e) {}
        return ua;
      }
      var saved = sessionStorage.getItem('erp_url_access');
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return null;
  })();

  function parseLocal(str) {
    var p = str.replace('T', ' ').split(/[\s:-]/);
    return new Date(+p[0], +p[1]-1, +p[2], +p[3]||0, +p[4]||0);
  }

  function checkWindow() {
    var cfg = URL_ACCESS || ACCESS;
    var now   = new Date();
    var start = parseLocal(cfg.inicio);
    var end   = new Date(start.getTime() + cfg.duracaoHoras * 3600000);
    if (now < start) return 'antes';
    if (now > end)   return 'expirado';
    return 'ok';
  }

  function liberarApp() {
    var lock = document.getElementById('erp-lock');
    if (lock) lock.remove();
  }

  function mostrarLock() {
    var status = checkWindow();

    var css = [
      '#erp-lock{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;',
      'background:linear-gradient(135deg,#1e2330 0%,#16a34a22 100%);font-family:Inter,system-ui,sans-serif}',
      '#erp-lock .box{background:#fff;border-radius:16px;padding:40px 36px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}',
      '#erp-lock .logo{font-size:2rem;margin-bottom:4px}',
      '#erp-lock h2{margin:0 0 4px;font-size:1.25rem;color:#111827}',
      '#erp-lock .sub{color:#6b7280;font-size:.88rem;margin:0 0 24px}',
      '#erp-lock .msg{padding:12px 16px;border-radius:8px;font-size:.9rem;margin-bottom:16px}',
      '#erp-lock .msg.info{background:#dbeafe;color:#1e40af}',
      '#erp-lock .msg.danger{background:#fee2e2;color:#991b1b}',
      '#erp-lock input{width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:1rem;',
      'outline:none;margin-bottom:12px;box-sizing:border-box}',
      '#erp-lock input:focus{border-color:#16a34a}',
      '#erp-lock button{width:100%;padding:11px;background:#16a34a;color:#fff;border:none;border-radius:8px;',
      'font-size:1rem;font-weight:600;cursor:pointer}',
      '#erp-lock button:hover{background:#15803d}',
      '#erp-lock .err{color:#dc2626;font-size:.82rem;margin-top:6px;min-height:18px}'
    ].join('');

    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    var inner = '';
    if (status === 'antes') {
      inner = '<div class="msg info">⏳ O acesso a este torneio ainda não foi liberado.<br>Aguarde o organizador.</div>';
    } else if (status === 'expirado') {
      inner = '<div class="msg danger">🔒 O acesso a este torneio foi encerrado.</div>';
    }
    // campo de senha sempre visível (admin pode entrar mesmo com acesso encerrado)
    inner += [
      '<input id="erp-pwd" type="password" placeholder="Digite a senha" autocomplete="off">',
      '<button id="erp-btn">Acessar →</button>',
      '<div class="err" id="erp-err"></div>'
    ].join('');

    var lock = document.createElement('div');
    lock.id = 'erp-lock';
    lock.innerHTML = [
      '<div class="box">',
      '<div class="logo">🏐</div>',
      '<h2>' + ACCESS.torneio + '</h2>',
      '<p class="sub">Gestão de torneios de vôlei</p>',
      inner,
      '</div>'
    ].join('');
    document.body.insertBefore(lock, document.body.firstChild);

    var btn = document.getElementById('erp-btn');
    var pwd = document.getElementById('erp-pwd');
    var err = document.getElementById('erp-err');

    function tentar() {
      var senhaUser = URL_ACCESS ? URL_ACCESS.senha : ACCESS.senha;
      if (pwd.value === ACCESS.senhaAdmin) {
        try { sessionStorage.setItem(KEY, 'admin'); } catch(e){}
        liberarApp();
        return;
      }
      if (checkWindow() !== 'ok') { err.textContent = checkWindow() === 'antes' ? 'Acesso ainda não liberado.' : 'Acesso expirado.'; return; }
      if (pwd.value === senhaUser) {
        try { sessionStorage.setItem(KEY, '1'); } catch(e){}
        liberarApp();
        iniciarTimer();
      } else {
        err.textContent = 'Senha incorreta.';
        pwd.value = '';
        pwd.focus();
      }
    }
    btn.addEventListener('click', tentar);
    pwd.addEventListener('keydown', function(e){ if(e.key==='Enter') tentar(); });
    setTimeout(function(){ pwd.focus(); }, 100);
  }

  // Timer: verifica a cada 30 segundos se o acesso ainda é válido
  function iniciarTimer() {
    setInterval(function () {
      if (checkWindow() !== 'ok' && !document.getElementById('erp-lock')) {
        try { sessionStorage.removeItem(KEY); } catch(e){}
        mostrarLock();
      }
    }, 30000);
  }

  // Rota /view é pública (atletas via QR Code) — sem lock, só janela de tempo
  // A janela pode vir nos params da URL: #/view?s=2026-11-02T18:00&h=20
  if (location.hash.indexOf('#/view') === 0) {
    var hashQuery = location.hash.split('?')[1] || '';
    var qp = {};
    hashQuery.split('&').forEach(function(p){ var kv=p.split('='); if(kv[0]) qp[kv[0]]=decodeURIComponent(kv[1]||''); });
    var wCheck;
    if (qp.s && qp.h) {
      // usa params da URL (QR Code) — independente do localStorage
      var now2 = new Date();
      var st2 = new Date(qp.s.replace(' ','T'));
      var en2 = new Date(st2.getTime() + Number(qp.h) * 3600000);
      wCheck = now2 < st2 ? 'before' : now2 > en2 ? 'after' : 'ok';
    } else {
      wCheck = checkWindow();
    }
    if (wCheck === 'ok') { return; }
    document.addEventListener('DOMContentLoaded', function() {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;flex-direction:column;gap:12px;background:#0f172a;color:#94a3b8"><span style="font-size:2rem">⏰</span><strong style="color:#f1f5f9">Acesso encerrado</strong><span>' + (wCheck === 'before' ? 'Torneio ainda não iniciou.' : 'Período do torneio encerrado.') + '</span></div>';
    });
    return;
  }

  // Já autenticou nesta sessão?
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved === 'admin') { return; }  // admin: sem verificação de horário
    if (saved === '1' && checkWindow() === 'ok') { iniciarTimer(); return; }
  } catch(e){}

  document.addEventListener('DOMContentLoaded', mostrarLock);
})();
</script>

<script>/* src/core/namespace.js */
/* VT — namespace global, utilitários puros e relógio injetável.
 * Funciona como script clássico (file://) e no Node (testes). */
(function (root) {
  'use strict';
  var VT = root.VT = root.VT || {};
  VT.VERSION = '0.1.0-etapa1';

  function isObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function clone(v) {
    return typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v));
  }

  // JSON com chaves ordenadas: mesma entrada => mesma string (base do checksum).
  function stableStringify(v) {
    if (v === null || typeof v !== 'object') return v === undefined ? 'null' : JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(v).sort().filter(function (k) { return v[k] !== undefined; })
      .map(function (k) { return JSON.stringify(k) + ':' + stableStringify(v[k]); }).join(',') + '}';
  }

<script>/* src/core/schema.js */
/* VT.schema — a "planta" dos dados: versões, coleções, enums, critérios, tipos de vaga e referências.
 * Nada aqui depende de DOM ou de persistência.
 *
 * SEGURANÇA DE LOOKUP: todo registro/dicionário é criado por dict() => objeto SEM protótipo.
 * Assim 'constructor', 'toString', '__proto__', 'hasOwnProperty'... nunca existem como chave
 * herdada, em nenhum lookup feito com texto vindo de fora (nome de coleção, critério, tipo de vaga). */
(function (root) {
  'use strict';
  var VT = root.VT, E = VT.errors;

  function dict(src) {
    var d = Object.create(null);
    if (src) Object.keys(src).forEach(function (k) { d[k] = src[k]; });
    return d;
  }

  // Coleções em ordem "pais antes de filhos". `indexes` = campos usados em findBy.
  var COLLECTIONS = dict({
    tournaments:   { idPrefix: 'trn',  indexes: [] },
    categories:    { idPrefix: 'cat',  indexes: ['tournamentId'] },
    scoringRules:  { idPrefix: 'sco',  indexes: ['tournamentId'] },
    tiebreakRules: { idPrefix: 'tbr',  indexes: ['tournamentId'] },
    teams:         { idPrefix: 'team', indexes: ['categoryId'] },
    phases:        { idPrefix: 'ph',   indexes: ['categoryId'] },
    groups:        { idPrefix: 'grp',  indexes: ['phaseId'] },
    matches:       { idPrefix: 'mch',  indexes: ['categoryId', 'phaseId', 'groupId'] },
    draws:         { idPrefix: 'drw',  indexes: ['categoryId', 'phaseId'] },
    licenses:      { idPrefix: 'lic',  indexes: ['tournamentId'] }

  var EXPORTABLE = COLLECTION_ORDER.filter(function (c) { return c !== 'licenses'; });

    MODALITY: ['quadra', 'areia'],
    TOURNAMENT_STATUS: ['preparacao', 'andamento', 'encerrado'],
    CATEGORY_STATUS: ['configuracao', 'andamento', 'encerrada'],
    STRUCTURE_MODE: ['auto', 'standard', 'custom'],
    PHASE_TYPE: ['groups', 'roundRobin', 'playin', 'knockout', 'thirdPlace', 'wildcard', 'bestLoserSemi', 'custom'],
    GROUP_FORMAT: ['roundRobin'],
    MATCH_STATUS: ['aguardando', 'agendado', 'andamento', 'finalizado', 'cancelado'],
    // Regras esportivas de cada tipo ficam para etapa futura; o modelo já comporta.
    RESULT_TYPE: ['normal', 'wo', 'desistencia', 'lesao'],
    SLOT_TYPE: [],   // preenchido por registerSlotType (fonte única: SLOT_TYPES)
    // histórico da distribuição: automatic (em ordem) | draw (sorteio com seed) | manual (confirmação) | move | swap | import
    DRAW_METHOD: ['automatic', 'draw', 'manual', 'move', 'swap', 'import'],
    MANUAL_SOURCE: ['presencial', 'externo', 'predefinido', 'outro'],   // apenas informativo (histórico)
    LICENSE_STATUS: ['trial', 'active', 'expired', 'revoked'],

    // revalidar quando puder. NUNCA bloqueia a operação do torneio.
    LICENSE_CHECK: ['none', 'pending'],
    CRITERION_SCOPE: ['all', 'tiedOnly'],
    MULTI_TEAM_METHOD: ['miniLeague']

    wins:       { label: 'Vitórias',                fixedScope: null },
    points:     { label: 'Pontos na classificação', fixedScope: null },
    pointsDiff: { label: 'Saldo de pontos',         fixedScope: null },
    setsDiff:   { label: 'Saldo de sets',           fixedScope: null },
    headToHead: { label: 'Confronto direto',        fixedScope: 'tiedOnly' },
    pointsFor:  { label: 'Pontos feitos',            fixedScope: null }

  // SLOT_TYPES — FONTE ÚNICA de tudo sobre vagas (SlotRef). Validação estrutural, referências,
  // consistência de categoria/fase e detecção de ciclos LEEM daqui; nenhum outro arquivo
  // conhece os tipos pelo nome. Um tipo novo precisa DECLARAR (senão o registro é recusado):
  //   to           coleção apontada (entidade de origem da vaga)
  //   idField      campo que guarda o id do alvo (existência é validada em REFS)
  //   fields       campos extras obrigatórios [{name, kind:'string'|'int', min?}]
  //   sameCategory true => o alvo (e sua fase de origem) DEVE ser da mesma categoria de quem tem a vaga
  //   dependency   true => a vaga cria dependência do dono sobre o alvo (entra no grafo de ciclos;
  //                ciclos NUNCA são permitidos)
  //   phaseOf      (opcional) alvo => id da fase de origem, validada como existente e da mesma categoria
  // ====================================================================================
  var SLOT_TYPES = dict();
  var SLOT_DEF_REQUIRED = ['to', 'idField', 'fields', 'sameCategory', 'dependency'];

  function registerSlotType(type, def) {
    function bad(msg) { return new E.VTError('INVALID_SLOT_TYPE', 'Tipo de vaga "' + type + '": ' + msg); }
    if (typeof type !== 'string' || !type) throw bad('o nome deve ser texto não vazio.');
    if (!def || typeof def !== 'object') throw bad('a definição deve ser um objeto.');

    if (typeof def.idField !== 'string' || !def.idField) throw bad('"idField" deve ser texto.');
    if (!Array.isArray(def.fields)) throw bad('"fields" deve ser uma lista.');
    if (typeof def.sameCategory !== 'boolean' || typeof def.dependency !== 'boolean') throw bad('"sameCategory" e "dependency" devem ser booleanos.');
    if (def.phaseOf !== undefined && typeof def.phaseOf !== 'function') throw bad('"phaseOf" deve ser função.');

  registerSlotType('team',     { to: 'teams',   idField: 'teamId',  fields: [], sameCategory: true, dependency: false });
  registerSlotType('groupPos', { to: 'phases',  idField: 'phaseId', sameCategory: true, dependency: true,
    fields: [{ name: 'groupName', kind: 'string' }, { name: 'pos', kind: 'int', min: 1 }],
    phaseOf: function (t) { return t.id; } });     // group existe? Só depois do sorteio: não validado aqui.
  registerSlotType('winnerOf', { to: 'matches', idField: 'matchId', fields: [], sameCategory: true, dependency: true,
    phaseOf: function (t) { return t.phaseId; } });
  registerSlotType('loserOf',  { to: 'matches', idField: 'matchId', fields: [], sameCategory: true, dependency: true,
    phaseOf: function (t) { return t.phaseId; } });

  // Quem CARREGA vagas: collection => entity => [{ path, slot }]. Registrar aqui basta para o novo
  // portador ganhar validação estrutural, referências, categoria e ciclos.
  var SLOT_HOLDERS = dict({
    phases:  function (e) { return Array.isArray(e.entrants) ? e.entrants.map(function (s, i) { return { path: 'entrants[' + i + ']', slot: s }; }) : []; },
    matches: function (e) { return [{ path: 'slotA', slot: e.slotA }, { path: 'slotB', slot: e.slotB }]; }

  function registerSlotHolder(collection, fn) {
    if (!COLLECTIONS[collection]) throw new E.VTError('INVALID_SLOT_HOLDER', 'Coleção desconhecida: ' + collection);
    SLOT_HOLDERS[collection] = fn;
  }

  // Dependência por CONTENÇÃO: o resultado de uma fase depende dos jogos que ela contém.
  // (Por isso um jogo da fase P não pode depender de groupPos da própria P.)
  var CONTAINMENT = dict({ phases: { child: 'matches', field: 'phaseId' } });

  // ---- Referências entre entidades ----
  // owner:true => filho pertence ao pai (cascata na exclusão; imutável no update).
  // weak:true  => existência validada ao gravar, mas NÃO bloqueia a exclusão do alvo: o campo é
  //               zerado (field = null) nos referenciadores quando o alvo sai.
  // demais     => referência simples: bloqueia a exclusão do alvo enquanto existir.

    return (typeof id === 'string' && id) ? [Object.assign({ to: to, id: id, owner: !!owner }, extra || {})] : [];
  }

  }
  var REFS = dict({
    tournaments:   function () { return []; },
    categories:    function (e) { return [].concat(r('tournaments', e.tournamentId, true), r('scoringRules', e.scoringRuleId), r('tiebreakRules', e.tiebreakRuleId)); },
    scoringRules:  function (e) { return r('tournaments', e.tournamentId, true); },
    tiebreakRules: function (e) { return r('tournaments', e.tournamentId, true); },
    teams:         function (e) { return r('categories', e.categoryId, true); },
    phases:        function (e) { return [].concat(r('categories', e.categoryId, true), r('scoringRules', e.scoringRuleId), r('tiebreakRules', e.tiebreakRuleId), holderRefs('phases', e)); },
    groups:        function (e) { return [].concat(r('phases', e.phaseId, true), (Array.isArray(e.teamIds) ? e.teamIds : []).reduce(function (a, id) { return a.concat(r('teams', id)); }, [])); },
    matches:       function (e) { return [].concat(r('categories', e.categoryId, true), r('phases', e.phaseId, true), r('groups', e.groupId), holderRefs('matches', e)); },
    // sorteio guarda snapshot histórico (input/output por nome): não referencia equipes.
    draws:         function (e) { return [].concat(r('categories', e.categoryId, true), r('phases', e.phaseId, true)); },
    // vínculo licença -> torneio é do dispositivo; ao excluir o torneio o vínculo é desfeito (weak).
    licenses:      function (e) { return r('tournaments', e.tournamentId, false, { weak: true, field: 'tournamentId' }); }
  });

  // Quantidade de posições de CADA grupo de uma fase. `sizes` existe quando a divisão é desigual/equilibrada
  // (ex.: [4,4,4,3]); sem ele, todos os grupos têm `teamsPerGroup`. Engines, análise e integridade leem daqui.
  function groupSizes(cfg) {
    if (!cfg) return [];
    if (Array.isArray(cfg.sizes)) return cfg.sizes.slice();
    var out = []; for (var i = 0; i < cfg.groups; i++) out.push(cfg.teamsPerGroup);
    return out;
  }

  VT.schema = {
    groupSizes: groupSizes,
    SCHEMA_VERSION: 1,   // versão dos DADOS (migrações)
    DB_VERSION: 1,       // versão ESTRUTURAL do IndexedDB (stores/índices)
    dict: dict,
    COLLECTIONS: COLLECTIONS, COLLECTION_ORDER: COLLECTION_ORDER, EXPORTABLE: EXPORTABLE,
    ENUMS: ENUMS, CRITERIA: CRITERIA, registerCriterion: registerCriterion,
    SLOT_TYPES: SLOT_TYPES, registerSlotType: registerSlotType, unregisterSlotType: unregisterSlotType, slotDef: slotDef,
    SLOT_HOLDERS: SLOT_HOLDERS, registerSlotHolder: registerSlotHolder, CONTAINMENT: CONTAINMENT,
    REFS: REFS

<script>/* src/core/ids.js */
/* VT.ids — IDs opacos e prefixados: "team_3f2a9c0e-...". O prefixo ajuda a depurar;
 * o UUID evita colisão entre dispositivos (necessário para futura sincronização). */
(function (root) {
  'use strict';
  var VT = root.VT;

  function hex(n) { var s = n.toString(16); return s.length < 2 ? '0' + s : s; }

  function uuidV4() {
    var c = root.crypto, b, i;
    if (c && typeof c.randomUUID === 'function') { try { return c.randomUUID(); } catch (e) { /* contexto inseguro */ } }
    b = new Uint8Array(16);
    if (c && typeof c.getRandomValues === 'function') c.getRandomValues(b);
    else for (i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, hex).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  var gen = defaultGen;

    newId: function (prefix) { return gen(prefix); },
    newIdFor: function (collection) {
      var c = VT.schema.COLLECTIONS[collection];
      if (!c) throw new VT.errors.VTError('UNKNOWN_COLLECTION', 'Coleção desconhecida: ' + collection);
      return gen(c.idPrefix);
    },
    // Formato canônico (usado por ferramentas; a validação de entidades só exige string não vazia,
    // para aceitar IDs vindos de outras origens no futuro).
    isId: function (v, prefix) {
      var m = typeof v === 'string' && ID_RE.exec(v);
      return !!m && (prefix === undefined || m[1] === prefix);

<script>/* src/core/integrity.js */
/* VT.integrity — regras de integridade entre entidades. FONTE ÚNICA: o Store (create/update) e o
 * importador chamam exatamente as mesmas funções. "Se o Store não aceitaria, o import também não."
 *
 *  - Funções puras sobre snapshot { coleção: [entidades] }: refsOf, collectOwned, findBlockers...
 *  - consistencyIssues(coleção, entidade, ctx): regras que dependem de OUTRAS entidades.
 *      ctx = { get(coleção, id) -> Promise<entidade|null>, findBy(coleção, campo, valor) -> Promise<[]> }
 *    (o Store passa o repository; o importador passa o conteúdo do arquivo). */
(function (root) {
  'use strict';
  var VT = root.VT, S = VT.schema;

  function key(c, id) { return c + ':' + id; }
  function refsOf(c, e) { var f = S.REFS[c]; return f ? f(e) : []; }

  // Conjunto (Map) de tudo que pertence à raiz via referências `owner`, incluindo a própria raiz.
  function collectOwned(all, collection, id) {
    var set = new Map(), queue = [{ collection: collection, id: id }];
    set.set(key(collection, id), { collection: collection, id: id });
    while (queue.length) {
      var cur = queue.shift();
      S.COLLECTION_ORDER.forEach(function (c) {
        (all[c] || []).forEach(function (e) {
          var k = key(c, e.id);
          if (set.has(k)) return;
          var owned = refsOf(c, e).some(function (r) { return r.owner && r.to === cur.collection && r.id === cur.id; });
          if (owned) { set.set(k, { collection: c, id: e.id }); queue.push({ collection: c, id: e.id }); }
        });
      });
    }
    return set;
  }

  // Entidades FORA do conjunto que ainda referenciam (referência forte) algo DENTRO dele.
  function findBlockers(all, set) {
    var out = [];
    S.COLLECTION_ORDER.forEach(function (c) {
      (all[c] || []).forEach(function (e) {
        if (set.has(key(c, e.id))) return;
        refsOf(c, e).forEach(function (r) {
          if (!r.weak && set.has(key(r.to, r.id))) out.push({ collection: c, id: e.id, target: { collection: r.to, id: r.id } });
        });
      });
    });
    return out;
  }
  // Referenciadores FRACOS fora do conjunto: não bloqueiam; o campo é zerado ao excluir o alvo.
  function findWeakReferrers(all, set) {
    var out = [];
    S.COLLECTION_ORDER.forEach(function (c) {
      (all[c] || []).forEach(function (e) {
        if (set.has(key(c, e.id))) return;
        refsOf(c, e).forEach(function (r) {
          if (r.weak && set.has(key(r.to, r.id))) out.push({ collection: c, id: e.id, field: r.field });

  function ownerKeys(c, e) {

  // ---------------------------------------------------------------------------------
  // Consistência entre entidades
  // ---------------------------------------------------------------------------------
  async function slotIssues(collection, e, get, add) {
    var holders = S.SLOT_HOLDERS[collection];
    if (!holders) return;
    for (var h of holders(e)) {
      var def = S.slotDef(h.slot);
      if (!def) continue;
      var id = h.slot[def.idField];
      if (typeof id !== 'string' || !id) continue;
      var target = await get(def.to, id);
      if (!target) continue;                               // inexistente: REFS já reporta MISSING_REFERENCE
      var where = h.path + '.' + def.idField, reported = false;
      if (def.sameCategory) {
        var cat = def.to === 'categories' ? target.id : target.categoryId;
        if (cat !== e.categoryId) { add(where, 'CROSS_CATEGORY', 'A vaga aponta para um registro (' + def.to + ') de outra categoria.'); reported = true; }
      }
      if (!reported && typeof def.phaseOf === 'function') {
        var pid = def.phaseOf(target);
        if (pid) {
          var ph = await get('phases', pid);
          if (!ph) add(where, 'MISSING_REFERENCE', 'A fase de origem da vaga não existe.');
          else if (def.sameCategory && ph.categoryId !== e.categoryId) add(where, 'CROSS_CATEGORY', 'A fase de origem da vaga pertence a outra categoria.');
        }

  // Arestas de dependência de um nó: vagas (tipos com dependency:true) + contenção (fase -> jogos).
  async function edgesOf(c, ent, ctx, startC, startE) {
    var out = [], holders = S.SLOT_HOLDERS[c], cont = S.CONTAINMENT[c];
    if (holders) holders(ent).forEach(function (h) {
      var def = S.slotDef(h.slot);
      if (def && def.dependency) { var id = h.slot[def.idField]; if (typeof id === 'string' && id) out.push({ to: def.to, id: id }); }
    });
    if (cont) {
      var kids = await ctx.findBy(cont.child, cont.field, ent.id);
      kids.forEach(function (k) { if (!(cont.child === startC && k.id === startE.id)) out.push({ to: cont.child, id: k.id }); });
      // a entidade em validação ainda não está (ou está em versão antiga) no armazenamento: usa a nova
      if (cont.child === startC && startE[cont.field] === ent.id) out.push({ to: startC, id: startE.id });
    }
    return out;
  }

  // DFS sobre o grafo de dependências a partir da entidade em validação. Detecta QUALQUER ciclo
  // (A→A, A→B→A, A→B→C→A, A→B→C→D→A...) que volte a ela. Ciclos nunca são permitidos.
  async function cycleIssues(collection, e, ctx, add) {
    if (!S.SLOT_HOLDERS[collection] && !S.CONTAINMENT[collection]) return;
    var start = key(collection, e.id), seen = new Set(), stack = [];
    (await edgesOf(collection, e, ctx, collection, e)).forEach(function (ed) { stack.push({ node: ed, path: [start] }); });
    while (stack.length) {

        else add('', 'SLOT_CYCLE', 'Dependência circular entre vagas: ' + cur.path.concat(k).map(function (x) { return x.split(':')[1]; }).join(' → ') + '.');
        return;
      }
      if (seen.has(k)) continue;

<script>/* src/core/catalogs.js */
/* VT.catalogs — FONTE CENTRAL dos catálogos (gêneros, níveis, tipos de equipe).
 * Lógica pura sobre o objeto `tournament.catalogs`; não conhece Store nem DOM.
 *  - KINDS descreve cada catálogo (campo da categoria, rótulos, se tem tamanho): a UI lista a partir daqui.
 *  - Os valores iniciais vêm de VT.presets.catalogs() e são dados editáveis (nada preso ao código).
 *  - Categorias guardam uma CÓPIA do valor escolhido {key,label[,size]}: remover do catálogo não quebra categorias. */

    genders:   { field: 'gender',   label: 'Gênero',         plural: 'Gêneros',         hasSize: false },
    levels:    { field: 'level',    label: 'Nível',          plural: 'Níveis',          hasSize: false },
    teamTypes: { field: 'teamType', label: 'Tipo de equipe', plural: 'Tipos de equipe', hasSize: true }

  var KIND_ORDER = Object.keys(KINDS);

  function kindDef(kind) {

<script>/* src/engines/standings.js */
/* VT.engines.standings — classificação dos grupos a partir dos resultados.
 * Engine PURA: não conhece DOM, Store, Repository nem armazenamento.
 *
 * Critérios (nesta ordem, conforme definido pelo organizador):
 *   1. Vitórias (maior = melhor)
 *   2. Saldo de pontos: pontos feitos - pontos sofridos (maior = melhor)
 *   3. Confronto direto: quem venceu o outro no grupo
 *   4. Pontos feitos (maior = melhor) — desempate final em caso de empate circular
 *
 * Aceita matches de qualquer status: só os finalizados contam. */

  'use strict';
  var VT = root.VT;
  VT.engines = VT.engines || {};

  var DEFAULT_CRITERIA = [
    { key: 'points', scope: 'all' },
    { key: 'wins', scope: 'all' },
    { key: 'setsDiff', scope: 'all' },
    { key: 'pointsDiff', scope: 'all' },
    { key: 'headToHead', scope: 'tiedOnly' },
    { key: 'pointsFor', scope: 'all' }

  function buildStats(teamIds, matches, options) {
    var bestOf = (options && parseInt(options.bestOf)) || 1;
    var stats = {};
    teamIds.forEach(function (id) {
      stats[id] = { teamId: id, played: 0, wins: 0, losses: 0, pointsFor: 0, pointsAgainst: 0, diff: 0, setsWon: 0, setsLost: 0, setsDiff: 0, points: 0 };
    });

    var finished = matches.filter(function (m) { return m.status === 'finalizado'; });
    finished.forEach(function (m) {
      var idA = m.slotA && m.slotA.teamId;
      var idB = m.slotB && m.slotB.teamId;

      if (!m.sets || !m.sets.length) return;

      var ptsA = 0, ptsB = 0, setsA = 0, setsB = 0;
      m.sets.forEach(function (s) { ptsA += s.a; ptsB += s.b; if (s.a > s.b) setsA++; else if (s.b > s.a) setsB++; });

      var effSetsA = setsA, effSetsB = setsB;
      if (bestOf === 3 && m.sets.length < 3) {
        var unplayed = 3 - m.sets.length;
        if (setsA > setsB) effSetsA += unplayed;
        else if (setsB > setsA) effSetsB += unplayed;
      }

      stats[idA].played++;
      stats[idB].played++;
      stats[idA].pointsFor += ptsA;
      stats[idA].pointsAgainst += ptsB;
      stats[idB].pointsFor += ptsB;
      stats[idB].pointsAgainst += ptsA;
      stats[idA].setsWon += effSetsA;
      stats[idA].setsLost += effSetsB;
      stats[idB].setsWon += effSetsB;
      stats[idB].setsLost += effSetsA;

      if (setsA > setsB) {
        stats[idA].wins++;
        stats[idB].losses++;
        // 3/2/1/0: vitória limpa (perdedor não ganhou nenhum set) = 3pts; vitória apertada = 2pts/1pt
        var ptsWin = (setsB === 0) ? 3 : 2;
        var ptsLoss = (setsB === 0) ? 0 : 1;
        stats[idA].points += ptsWin;
        stats[idB].points += ptsLoss;
      } else if (setsB > setsA) {
        stats[idB].wins++;
        stats[idA].losses++;
        var ptsWin2 = (setsA === 0) ? 3 : 2;
        var ptsLoss2 = (setsA === 0) ? 0 : 1;
        stats[idB].points += ptsWin2;
        stats[idA].points += ptsLoss2;
      }
    });

    Object.keys(stats).forEach(function (id) {
      stats[id].diff = stats[id].pointsFor - stats[id].pointsAgainst;
      stats[id].setsDiff = stats[id].setsWon - stats[id].setsLost;
    });

    return stats;
  }

  function headToHead(idA, idB, matches) {
    var finished = matches.filter(function (m) {
      if (m.status !== 'finalizado' || m.resultType !== 'normal') return false;
      var a = m.slotA && m.slotA.teamId, b = m.slotB && m.slotB.teamId;
      return (a === idA && b === idB) || (a === idB && b === idA);
    });
    var winsA = 0, winsB = 0;
    finished.forEach(function (m) {
      var a = m.slotA.teamId;
      var totalA = 0, totalB = 0;
      m.sets.forEach(function (s) { if (s.a > s.b) totalA++; else if (s.b > s.a) totalB++; });
      if (a === idA) { if (totalA > totalB) winsA++; else if (totalB > totalA) winsB++; }
      else { if (totalB > totalA) winsA++; else if (totalA > totalB) winsB++; }
    });
    if (winsA > winsB) return -1;
    if (winsB > winsA) return 1;
    return 0;
  }

  function compareByCriterion(key, a, b, matches) {
    switch (key) {
      case 'wins': return b.wins - a.wins;
      case 'points': return b.points - a.points;
      case 'pointsDiff': return b.diff - a.diff;
      case 'setsDiff': return b.setsDiff - a.setsDiff;
      case 'headToHead': return headToHead(a.teamId, b.teamId, matches);
      case 'pointsFor': return b.pointsFor - a.pointsFor;
      default: return 0;
    }

  function rankGroup(teamIds, matches, criteria, options) {
    var crit = Array.isArray(criteria) && criteria.length ? criteria : DEFAULT_CRITERIA;
    var stats = buildStats(teamIds, matches, options);
    var rows = teamIds.map(function (id) { return stats[id]; });

    rows.sort(function (a, b) {

      }
      return b.pointsFor - a.pointsFor;
    });

    rows.forEach(function (r, i) { r.rank = i + 1; });
    return rows;
  }

  function groupStandings(groups, matches, teamsById, criteria, options) {
    return groups.map(function (g) {
      var groupMatches = matches.filter(function (m) { return m.groupId === g.id; });
      var teamIds = (g.teamIds || []).filter(function (id) { return id != null; });
      var rows = rankGroup(teamIds, groupMatches, criteria, options);
      rows.forEach(function (r) {
        r.teamName = teamsById[r.teamId] ? teamsById[r.teamId].name : '(equipe removida)';
      });
      return { group: g, rows: rows };
    });
  }

  VT.engines.standings = {
    DEFAULT_CRITERIA: DEFAULT_CRITERIA,
    buildStats: buildStats,
    headToHead: headToHead,
    rankGroup: rankGroup,
    groupStandings: groupStandings

/* VT.migrations — migração de DADOS entre versões de schema.
 * Um passo é { from, to, up(data) => data } e opera sobre o snapshot { coleção: [entidades] }.
 * O mesmo encadeamento migra (a) o banco local ao abrir e (b) um arquivo importado.
 * Hoje só existe a v1: STEPS está vazio, mas todo o caminho já é exercitado nos testes. */

  'use strict';
  var VT = root.VT, E = VT.errors, U = VT.util;

  function createMigrator(steps, target) {

      var out = [], v = from, step;
      while (v < target) {
        step = steps.filter(function (s) { return s.from === v; })[0];
        if (!step) throw new E.SchemaError('MIGRATION_MISSING', 'Não há migração da versão ' + v + ' para ' + (v + 1) + '.');
        out.push(step); v = step.to;
      }
      return out;
    }
    function tooNew(v) {
      return new E.SchemaError('SCHEMA_TOO_NEW', 'Os dados são da versão ' + v + ', mais nova que a suportada por este aplicativo (' + target + '). Atualize o aplicativo.', { found: v, supported: target });
    }
    var m = {
      target: target,
      migrateData: function (data, from) {
        if (from > target) throw tooNew(from);
        return chain(from).reduce(function (d, s) { return s.up(d); }, data);
      },
      migrateDocument: function (doc) {
        var v = doc.schemaVersion;
        if (!Number.isInteger(v) || v < 1) throw new E.SchemaError('INVALID_SCHEMA_VERSION', 'schemaVersion ausente ou inválido no arquivo.');
        var data = m.migrateData(U.clone(doc.data), v);
        return Object.assign({}, doc, { schemaVersion: target, data: data });
      },
      // Ao abrir o banco: cria a marca de versão (banco novo) ou migra em uma única transação.
      migrateRepository: async function (repo) {
        var v = await repo.getMeta('schemaVersion');
        if (v === null || v === undefined) { await repo.setMeta('schemaVersion', target); return { from: null, to: target, migrated: false }; }
        if (v === target) return { from: v, to: target, migrated: false };
        if (v > target) throw tooNew(v);
        var before = await repo.exportAll();

        await repo.replaceAll(m.migrateData(U.clone(before), v), meta);
        return { from: v, to: target, migrated: true };
      }
    };

/* VT.Repository — CONTRATO da camada de persistência. É a única coisa que o Store conhece.
 * Trocar IndexedDB por API/Supabase = escrever outra subclasse com estes métodos assíncronos.
 *
 *   init()                          abre/prepara o armazenamento
 *   get(coll, id)                   -> entidade | null
 *   getAll(coll)                    -> entidade[] (ordenadas por id)
 *   findBy(coll, campo, valor)      -> entidade[] (igualdade)
 *   batch(ops)                      aplica [{op:'put',collection,entity}|{op:'delete',collection,id}]
 *                                   de forma ATÔMICA (tudo ou nada)
 *   put / delete / putMany          atalhos sobre batch
 *   getMeta(k) / setMeta(k, v)      metadados (ex.: schemaVersion)
 *   exportAll()                     -> { coleção: entidade[] } (todas as coleções)
 *   replaceAll(data, meta)          substitui TUDO (+ metadados) em uma transação
 *   clear()                         apaga todas as coleções (metadados permanecem)
 *   close()
 * Toda entidade devolvida é uma CÓPIA: alterá-la não altera o armazenamento. */
