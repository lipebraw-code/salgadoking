    if (secBtns.length) footerItems.push(h('div', { class: 'match-card-actions' }, secBtns));

    var footer = footerItems.length ? h('div', { class: 'match-card-footer' + (m.status === 'andamento' ? ' live-bar' : '') }, footerItems) : null;

    return h('div', { class: cardClass, dataset: { status: m.status, testid: 'match-' + m.id } },
      h('div', { class: 'match-card-top' },
        h('span', { class: 'match-round-chip' }, '#' + m.order + ' · R' + m.round),
        h('div', { class: 'match-body' },
          h('div', { class: 'match-team-row' },
            h('div', { class: 'match-team-a' + (winnerSide === 'A' ? ' winner' : '') }, slotAName),
            setsScoreBlock || h('div', { class: 'match-score-block' }, h('span', { class: 'match-vs' }, '×')),
            h('div', { class: 'match-team-b' + (winnerSide === 'B' ? ' winner' : '') }, slotBName)
          )
        ),
        h('div', { class: 'match-side-col' },
          h('span', { class: pillClass }, pillLabel),
          primaryBtn
        )
      ),
      footer
    );
  }

  function matchRow(m, teams, ctx, matchesById, tournament, category) {
    return matchCard(m, teams, ctx, matchesById, tournament, category);
  }

  function matchActions(m, teams, ctx, matchesById, tournament, category) {
    var btns = [];
    if (m.status === 'aguardando' || m.status === 'agendado') {
      btns.push(h('button', { class: 'btn sm', dataset: { action: 'schedule', matchId: m.id }, onClick: function () { scheduleDialog(m, ctx); } }, 'Agendar'));
      btns.push(h('button', { class: 'btn sm primary', dataset: { action: 'start', matchId: m.id }, onClick: function () { act(ctx, function () { return ctx.store.startMatch(m.id); }, 'Jogo iniciado'); } }, 'Iniciar'));
    }
    if (m.status === 'aguardando' || m.status === 'agendado' || m.status === 'andamento') {
      btns.push(h('button', { class: 'btn sm primary', dataset: { action: 'result', matchId: m.id }, onClick: function () { resultDialog(m, teams, ctx, matchesById); } }, 'Resultado'));
      btns.push(h('button', { class: 'btn sm', dataset: { action: 'cancel', matchId: m.id }, onClick: function () {
        ui.confirmDialog({ title: 'Cancelar jogo?', message: 'O jogo #' + m.order + ' será marcado como cancelado (WO).', danger: true, confirmLabel: 'Cancelar jogo' })
          .then(function (ok) { if (ok) act(ctx, function () { return ctx.store.cancelMatch(m.id); }, 'Jogo cancelado'); });
      } }, 'Cancelar'));
    }
    if (m.status === 'finalizado' || m.status === 'cancelado') {
      btns.push(h('button', { class: 'btn sm', dataset: { action: 'reopen', matchId: m.id }, onClick: function () { act(ctx, function () { return ctx.store.reopenMatch(m.id); }, 'Jogo reaberto'); } }, 'Reabrir'));
    }
    if (tournament && category) {
      var nameA = teamName(teams, m.slotA, matchesById), nameB = teamName(teams, m.slotB, matchesById);
      if (m.schedule && m.schedule.date) btns.push(WA.shareScheduleBtn(tournament, category, '#' + m.order, nameA, nameB, m.schedule));
      if (m.status === 'finalizado' && m.sets && m.sets.length) btns.push(WA.shareResultBtn(tournament, category, '#' + m.order, nameA, nameB, m.sets));
    }
    return btns;
  }

  function scheduleDialog(m, ctx) {
    var sched = m.schedule || {};
    ui.formDialog({
      title: 'Agendar jogo #' + m.order,
      fields: [
        { name: 'date', label: 'Data', value: sched.date || '', type: 'date' },
        { name: 'time', label: 'Horário', value: sched.time || '', type: 'time' },
        { name: 'court', label: 'Quadra', value: sched.court || '' }
      ],
      onSubmit: function (v) { return ctx.run(function () { return ctx.store.scheduleMatch(m.id, v); }); }
    }).then(function (ok) { if (ok) { ui.toast('Agendamento salvo'); ctx.refresh(); } });
  }

  async function resultDialog(m, teams, ctx, matchesById) {
    var phase = await ctx.store.get('phases', m.phaseId);
    var cat = await ctx.store.get('categories', m.categoryId);
    var fmt = (phase && phase.matchFormat) || (cat && cat.defaultMatchFormat) || { bestOf: 1, pointsToWin: 21 };
    var setsContainer, addBtn, errorBox;
    var setInputs = [];

    function addSetRow(a, b) {
      var idx = setInputs.length + 1;
      var inA = h('input', { type: 'number', min: 0, value: a != null ? a : '', placeholder: '0', class: 'score-input', 'aria-label': 'Set ' + idx + ' equipe A' });
      var inB = h('input', { type: 'number', min: 0, value: b != null ? b : '', placeholder: '0', class: 'score-input', 'aria-label': 'Set ' + idx + ' equipe B' });
      var row = h('div', { class: 'set-row', dataset: { testid: 'set-' + idx } },
        h('span', { class: 'set-label' }, 'Set ' + idx + ':'),
        inA, h('span', { class: 'vs' }, '×'), inB
      );
      setInputs.push({ a: inA, b: inB, row: row });
      setsContainer.appendChild(row);
    }

    setsContainer = h('div', { class: 'sets-container' });
    addBtn = h('button', { type: 'button', class: 'btn sm', onClick: function () { addSetRow(); } }, '+ Set');
    errorBox = h('div', { class: 'form-error', role: 'alert', hidden: true });

    if (m.sets && m.sets.length) {
      m.sets.forEach(function (s) { addSetRow(s.a, s.b); });
    } else {
      addSetRow();
    }

    var nameA = teamName(teams, m.slotA, matchesById);
    var nameB = teamName(teams, m.slotB, matchesById);

    var woCheck = h('label', { class: 'check' }, h('input', { type: 'checkbox', name: 'wo' }), h('span', null, 'W.O. (vitória sem disputa)'));

    var woLoserSelect = h('div', { class: 'wo-detail', hidden: true },
      h('p', { class: 'hint', style: 'margin:4px 0 6px' }, 'Equipe que recebe o W.O. (que não compareceu):'),
      h('label', { class: 'check radio' },
        h('input', { type: 'radio', name: 'woLoser', value: 'B', checked: true }),
        h('span', null, nameB + ' perde o W.O.')
      ),
      h('label', { class: 'check radio' },
        h('input', { type: 'radio', name: 'woLoser', value: 'A' }),
        h('span', null, nameA + ' perde o W.O.')
      ),
      h('p', { class: 'hint wo-score-preview', style: 'margin:6px 0 0;font-weight:600' }, '')
    );

    function updateWoPreview() {
      var loserVal = woLoserSelect.querySelector('input[name="woLoser"]:checked');
      var loser = loserVal ? loserVal.value : 'B';
      var pts = fmt.pointsToWin || 21;
      var preview = loser === 'B'
        ? nameA + ' ' + pts + ' × 0 ' + nameB
        : nameB + ' ' + pts + ' × 0 ' + nameA;
      woLoserSelect.querySelector('.wo-score-preview').textContent = 'Placar automático: ' + preview;
    }

    woCheck.querySelector('input').addEventListener('change', function () {
      woLoserSelect.hidden = !this.checked;
      setsContainer.hidden = this.checked;
      addBtn.hidden = this.checked;
      if (this.checked) updateWoPreview();
    });
    woLoserSelect.querySelectorAll('input[name="woLoser"]').forEach(function (r) {
      r.addEventListener('change', updateWoPreview);
    });

    var submitBtn = h('button', { type: 'submit', class: 'btn primary' }, 'Salvar resultado');
    var cancelBtn = h('button', { type: 'button', class: 'btn' }, 'Cancelar');

    var modal;
    var form = h('form', { class: 'form', novalidate: true, dataset: { testid: 'result-form' }, onSubmit: async function (e) {
      e.preventDefault();
      errorBox.hidden = true;
      errorBox.textContent = '';
      submitBtn.disabled = true;

      try {
        var isWO = woCheck.querySelector('input').checked;
        if (isWO) {
          var loserInput = woLoserSelect.querySelector('input[name="woLoser"]:checked');
          var woLoser = loserInput ? loserInput.value : 'B';
          await ctx.run(function () { return ctx.store.recordResult(m.id, { resultType: 'wo', woLoser: woLoser, sets: [] }); });
          modal.close(true);
          ui.toast('Resultado registrado (W.O.)');
          ctx.refresh();
          return;
        }

        var sets = setInputs.map(function (si) {
          return { a: parseInt(si.a.value, 10) || 0, b: parseInt(si.b.value, 10) || 0 };
        }).filter(function (s) { return s.a > 0 || s.b > 0; });

        if (!sets.length) {
          errorBox.textContent = 'Informe o placar de pelo menos um set.';
          errorBox.hidden = false;
          submitBtn.disabled = false;
          return;
        }

        var correction = m.status === 'finalizado';
        await ctx.run(function () { return ctx.store.recordResult(m.id, { sets: sets, correction: correction }); });
        modal.close(true);
        ui.toast('Resultado registrado');
        ctx.refresh();
      } catch (err) {
        errorBox.textContent = msg(err);
        errorBox.hidden = false;
      } finally { submitBtn.disabled = false; }
    } }, errorBox,
      h('p', { class: 'hint', style: 'margin:0 0 8px' }, 'Diferença mínima de ' + SC.resolveFormat(fmt).minDiff + ' pontos'),
      setsContainer, addBtn, woCheck, woLoserSelect, h('div', { class: 'form-actions' }, submitBtn, cancelBtn));

    modal = ui.openModal({ title: 'Resultado — jogo #' + m.order + ' (' + nameA + ' × ' + nameB + ')', body: form });
    cancelBtn.addEventListener('click', function () { modal.close(null); });
  }

  async function matchesView(ctx) {
    var t = await ui.loadTournament(ctx), store = ctx.store;
    var cats = await store.list('categories', { tournamentId: t.id });
    var base = { title: 'Jogos', tournament: t, tab: 'matches', section: 'matches',
      crumbs: [{ label: 'Dashboard', href: '/dashboard' }, { label: t.name, href: ui.tpath(t) }, { label: 'Jogos' }] };

    if (!cats.length) return Object.assign(base, { content: ui.emptyState('Sem categorias', 'Crie uma categoria para gerar jogos.') });

    var cat = ctx.params.cid ? cats.filter(function (c) { return c.id === ctx.params.cid; })[0] : (cats.filter(function (c) { return c.active; })[0] || cats[0]);
    if (!cat) throw new VT.errors.NotFoundError('Categoria', ctx.params.cid);

    var state = await store.matchesState(cat.id);
    var teamsArr = await store.list('teams', { categoryId: cat.id });
    var teamsById = {};
    teamsArr.forEach(function (t) { teamsById[t.id] = t; });

    var matches = state.matches.slice().sort(function (a, b) { return a.order - b.order; });
    var matchesById = {};
    matches.forEach(function (m) { matchesById[m.id] = m; });
    var groupsById = {};
    (state.groups || []).forEach(function (g) { groupsById[g.id] = g; });

    // Category tabs
    var catTabs = cats.length > 1 ? h('div', { class: 'cat-tabs' }, cats.map(function (c) {
      return h('a', { class: 'tab' + (c.id === cat.id ? ' active' : ''), href: '#' + ui.tpath(t, '/matches?cid=' + c.id) }, c.name);
    })) : null;

    // Summary
    var summary = h('div', { class: 'matches-summary', dataset: { testid: 'matches-summary' } },
      h('span', null, ui.plural(state.total, 'jogo', 'jogos')),
      state.byStatus.finalizado ? h('span', { class: 'badge success' }, state.byStatus.finalizado + ' finalizado(s)') : null,
      state.byStatus.andamento ? h('span', { class: 'badge ao-vivo' }, state.byStatus.andamento + ' AO VIVO') : null,
      state.byStatus.agendado ? h('span', { class: 'badge info' }, state.byStatus.agendado + ' agendado(s)') : null,
      state.byStatus.aguardando ? h('span', { class: 'badge muted' }, state.byStatus.aguardando + ' aguardando') : null,
      state.byStatus.cancelado ? h('span', { class: 'badge muted' }, state.byStatus.cancelado + ' cancelado(s)') : null
    );

    // Generate / delete actions
    var genActions;
    if (!matches.length) {
      var preview = '';
      try {
        var phases = state.phases.filter(function (p) { return p.type === 'groups'; });
        var phase = phases[0];
        if (phase && phase.confirmedAt) {
          var groups = state.groups.filter(function (g) {
            var found = false; state.phases.forEach(function (p) { if (p.id === g.phaseId && p.type === 'groups') found = true; }); return found;
          });
          var count = MG.totalMatchCount(groups, (phase.groupsConfig && phase.groupsConfig.legs) || 1);
          preview = count + ' jogo(s) serão gerados.';
        }
      } catch (e) { /* ignore */ }

      genActions = h('div', { class: 'gen-actions', dataset: { testid: 'gen-actions' } },
        h('button', { class: 'btn primary', dataset: { action: 'generate' }, onClick: function () {
          act(ctx, function () { return store.generateGroupMatches(cat.id); }, 'Jogos gerados!');
        } }, 'Gerar jogos da fase de grupos'),
        preview ? h('p', { class: 'hint' }, preview) : null
      );
    } else {
      var canDelete = !matches.some(function (m) { return m.status === 'andamento' || m.status === 'finalizado'; });
      var scheduled = matches.filter(function (m) { return m.schedule && m.schedule.date; });
      genActions = h('div', { class: 'gen-actions' },
        canDelete ? h('button', { class: 'btn danger', dataset: { action: 'delete-matches' }, onClick: function () {
          ui.confirmDialog({ title: 'Excluir todos os jogos?', message: 'Todos os ' + matches.length + ' jogos desta fase serão excluídos.', danger: true, confirmLabel: 'Excluir jogos' })
            .then(function (ok) { if (ok) act(ctx, function () { return store.deleteGroupMatches(cat.id); }, 'Jogos excluídos'); });
        } }, 'Excluir jogos') : null,
        h('button', { class: 'btn', dataset: { action: 'auto-schedule' }, onClick: function () { autoScheduleDialog(state, ctx); } }, 'Agendar automaticamente'),
        scheduled.length ? h('button', { class: 'btn danger', dataset: { action: 'clear-schedule' }, onClick: function () {
          var ph = state.phases.filter(function (p) { return p.type === 'groups'; })[0];
          if (!ph) { ui.toast('Fase de grupos não encontrada.', 'error'); return; }
          ui.confirmDialog({ title: 'Limpar agendamento?', message: scheduled.length + ' jogo(s) agendado(s) voltarão para "Aguardando". Esta ação não afeta jogos já finalizados.', danger: true, confirmLabel: 'Limpar agendamento' })
            .then(function (ok) { if (ok) act(ctx, function () { return store.clearSchedule(ph.id); }, 'Agendamento removido.'); });
        } }, 'Limpar agendamento') : null,
        scheduled.length ? WA.shareAllSchedulesBtn(t, cat, scheduled, teamsById) : null
      );
    }

    // Matches table — grouped by chave (grupo), sorted alphabetically; knockout separate
    var phasesById = {};
    (state.phases || []).forEach(function (p) { phasesById[p.id] = p; });
    var table;
    if (matches.length) {
      var byGroup = {};
      var groupIds = [];
      var koMatches = [];
      matches.forEach(function (m) {
        if (!m.groupId) { koMatches.push(m); return; }
        if (!byGroup[m.groupId]) { byGroup[m.groupId] = []; groupIds.push(m.groupId); }
        byGroup[m.groupId].push(m);
      });
      groupIds.sort(function (a, b) {
        var na = groupsById[a] ? groupsById[a].name : a;
        var nb = groupsById[b] ? groupsById[b].name : b;
        return na < nb ? -1 : na > nb ? 1 : 0;
      });
      var makeTable = function (rows) {
        return h('div', { class: 'match-cards' },
          rows.map(function (m) { return matchCard(m, teamsById, ctx, matchesById, t, cat); }));
      };

      function makeAccordion(label, rows, startOpen) {
        var chevron = h('span', { class: 'gm-chevron' }, '▼');
        var badge = h('span', { class: 'badge muted', style: 'font-size:.7rem' }, rows.length + (rows.length === 1 ? ' jogo' : ' jogos'));
        var title = h('h3', { class: 'group-matches-title' },
          h('span', { style: 'display:flex;align-items:center;gap:10px' }, label, badge), chevron);
        var body = h('div', { class: 'group-matches-body' }, makeTable(rows));
        var wrap = h('div', { class: 'group-matches' + (startOpen ? ' open' : '') });
        title.addEventListener('click', function () {
          wrap.classList.toggle('open');
        });
        wrap.appendChild(title);
        wrap.appendChild(body);
        return wrap;
      }

      var sections = [];
      var useAccordion = false;
      if (groupIds.length) {
        useAccordion = groupIds.length > 1;
        groupIds.forEach(function (gid, idx) {
          var g = groupsById[gid];
          var label = 'Chave ' + (g ? g.name : gid);
          if (useAccordion) {
            var hasLive = byGroup[gid].some(function (m) { return m.status === 'andamento'; });
            sections.push(makeAccordion(label, byGroup[gid], idx === 0 || hasLive));
          } else {
            sections.push(h('div', { class: 'group-matches solo', dataset: { groupId: gid } },
              h('h3', { class: 'group-matches-title' }, label),
              h('div', { class: 'group-matches-body' }, makeTable(byGroup[gid]))));
          }
        });
      }
      if (koMatches.length) {
        var koRegular = [], thirdPlaceMatches = [];
        koMatches.forEach(function (m) {
          var phase = phasesById[m.phaseId];
          if (phase && phase.type === 'thirdPlace') thirdPlaceMatches.push(m);
          else koRegular.push(m);
        });
        var KO_NAMES = { 2: 'Final', 4: 'Semifinal', 8: 'Quartas de final', 16: 'Oitavas de final' };
        var byRound = {};
        koRegular.forEach(function (m) {
          if (!byRound[m.round]) byRound[m.round] = [];
          byRound[m.round].push(m);
        });
        Object.keys(byRound).map(Number).sort(function (a, b) { return a - b; }).forEach(function (rn) {
          var rm = byRound[rn];
          var roundName = KO_NAMES[rm.length * 2] || ('Rodada ' + rn);
          sections.push(makeAccordion(roundName, rm, true));
        });
        if (thirdPlaceMatches.length) {
          sections.push(makeAccordion('Disputa de 3º lugar', thirdPlaceMatches, true));
        }
      }
      if (sections.length > 1 || (sections.length === 1 && groupIds.length)) {
        table = h('div', { class: 'matches-table-wrap', dataset: { testid: 'matches-table' } }, sections);
      } else {
        table = h('div', { class: 'matches-table-wrap', dataset: { testid: 'matches-table' } }, makeTable(matches));
      }
    } else {
      table = ui.emptyState('Nenhum jogo gerado', 'Confirme a distribuição das equipes nos grupos e gere os jogos da fase de grupos.');
    }

    return Object.assign(base, { content: h('div', { class: 'matches-view' }, catTabs, summary, genActions, table) });
  }

  function autoScheduleDialog(state, ctx) {
    var phases = state.phases.filter(function (p) { return p.type === 'groups'; });
    var phase = phases[0];
    if (!phase) { ui.toast('Nenhuma fase de grupos encontrada.', 'error'); return; }

    ui.formDialog({
      title: 'Agendar jogos automaticamente',
      fields: [
        { name: 'startDate', label: 'Data de início', type: 'date', required: true },
        { name: 'startTime', label: 'Horário inicial', value: '08:00', type: 'time' },
        { name: 'intervalMinutes', label: 'Intervalo (minutos)', value: '30', type: 'number', min: 5 },
        { name: 'courts', label: 'Quadras (separadas por vírgula)', value: '1', hint: 'Ex: 1, 2, 3' }
      ],
      onSubmit: function (v) {
        var courts = v.courts.split(',').map(function (c) { return c.trim(); }).filter(Boolean);
        return ctx.run(function () {
          return ctx.store.autoSchedule(phase.id, {
            startDate: v.startDate,
            startTime: v.startTime || '08:00',
            intervalMinutes: parseInt(v.intervalMinutes, 10) || 30,
            courts: courts.length ? courts : ['1']
          });
        });
      }
    }).then(function (ok) { if (ok) { ui.toast('Jogos agendados'); ctx.refresh(); } });
  }

  ui.route('/t/:tid/matches', matchesView);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/ui/views-bracket.js */
/* Tela "Chaves": classificação dos grupos e fase eliminatória.
 * Só apresentação: toda regra mora no Store/engines. */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;

  function standingsTable(standing, qualifiedCount) {
    var rows = standing.rows;
    return h('div', { class: 'group-section', dataset: { testid: 'standing-' + standing.group.name } },
      h('h3', { class: 'group-heading' },
        h('span', { class: 'group-name' }, 'Grupo ' + standing.group.name),
        h('span', { class: 'group-progress badge ' + (rows.every(function (r) { return r.played > 0; }) ? 'success' : 'muted') },
          rows.reduce(function (s, r) { return s + r.played; }, 0) / 2 + ' jogo(s)')
      ),
      h('table', { class: 'standings-table', dataset: { testid: 'standings-table-' + standing.group.name } },
        h('thead', null, h('tr', null,
          h('th', null, '#'),
          h('th', null, 'Equipe'),
          h('th', { class: 'num', title: 'Pontos (2-0: 3pts / 2-1: 2pts e 1pt)' }, 'Pts'),
          h('th', { class: 'num' }, 'J'),
          h('th', { class: 'num' }, 'V'),
          h('th', { class: 'num' }, 'D'),
          h('th', { class: 'num' }, 'PF'),
          h('th', { class: 'num' }, 'PC'),
          h('th', { class: 'num' }, 'SP')
        )),
        h('tbody', null, rows.map(function (r) {
          var qualified = qualifiedCount && r.rank <= qualifiedCount;
          return h('tr', { class: (qualified ? 'qualified' : '') + (r.played === 0 ? ' no-matches' : ''), dataset: { teamId: r.teamId } },
            h('td', { class: 'rank' }, String(r.rank) + 'º'),
            h('td', { class: 'team-name' }, r.teamName),
            h('td', { class: 'num wins', style: 'color:var(--primary,#16a34a)' }, String(r.points || 0)),
            h('td', { class: 'num' }, String(r.played)),
            h('td', { class: 'num wins' }, String(r.wins)),
            h('td', { class: 'num' }, String(r.losses)),
            h('td', { class: 'num' }, String(r.pointsFor)),
            h('td', { class: 'num' }, String(r.pointsAgainst)),
            h('td', { class: 'num diff ' + (r.diff > 0 ? 'positive' : r.diff < 0 ? 'negative' : '') },
              (r.diff > 0 ? '+' : '') + String(r.diff))
          );
        }))
      ),
      qualifiedCount ? h('p', { class: 'hint qualified-hint' },
        'Os ' + qualifiedCount + ' primeiros avançam para a fase eliminatória.') : null
    );
  }

  function legendBlock() {
    return h('div', { class: 'standings-legend' },
      h('span', null, h('strong', null, 'Pts'), ' Pontos (2-0=3 / 2-1=2/1)'),
      h('span', null, h('strong', null, 'J'), ' Jogos'),
      h('span', null, h('strong', null, 'V'), ' Vitórias'),
      h('span', null, h('strong', null, 'D'), ' Derrotas'),
      h('span', null, h('strong', null, 'PF'), ' Pontos Feitos'),
      h('span', null, h('strong', null, 'PC'), ' Pontos Contra'),
      h('span', null, h('strong', null, 'SP'), ' Saldo de Pontos')
    );
  }

  function resolveSlotName(slot, teamsById, matchesById) {
    if (!slot) return null;
    if (slot.type !== 'winnerOf' && slot.type !== 'loserOf') return null;
    var refM = matchesById && matchesById[slot.matchId];
    if (!refM || refM.status !== 'finalizado' || !refM.slotA || refM.slotA.type !== 'team' || !refM.slotB || refM.slotB.type !== 'team') return null;
    var sA = 0, sB = 0;
    if (refM.resultType === 'wo' || refM.resultType === 'desistencia') { sA = 1; }
    else if (refM.sets && refM.sets.length) { refM.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; }); }
    var isW = slot.type === 'winnerOf';
    var tid = isW ? (sA > sB ? refM.slotA.teamId : refM.slotB.teamId) : (sA > sB ? refM.slotB.teamId : refM.slotA.teamId);
    var t = teamsById[tid];
    return t ? t.name : null;
  }

  function slotLabel(slot, teamsById, matchLabels, matchesById) {
    if (!slot) return '?';
    if (slot.type === 'team') return teamsById[slot.teamId] ? teamsById[slot.teamId].name : '?';

  var STATUS_LABEL = { aguardando: 'Aguardando', agendado: 'Agendado', andamento: 'Em andamento', finalizado: 'Finalizado', cancelado: 'Cancelado' };
  var STATUS_TONE = { aguardando: 'muted', agendado: 'info', andamento: 'accent', finalizado: 'success', cancelado: 'muted' };

  function resolveSlotTeam(slot, teamsById, matchesById) {
    if (!slot || (slot.type !== 'winnerOf' && slot.type !== 'loserOf')) return null;
    var refM = matchesById && matchesById[slot.matchId];
    if (!refM || refM.status !== 'finalizado' || !refM.slotA || refM.slotA.type !== 'team' || !refM.slotB || refM.slotB.type !== 'team') return null;
    var sA = 0, sB = 0;
    if (refM.resultType === 'wo' || refM.resultType === 'desistencia') { sA = 1; }
    else if (refM.sets && refM.sets.length) { refM.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; }); }
    var isW = slot.type === 'winnerOf';
    var tid = isW ? (sA > sB ? refM.slotA.teamId : refM.slotB.teamId) : (sA > sB ? refM.slotB.teamId : refM.slotA.teamId);
    var t = teamsById[tid];
    return t ? t.name : null;
  }

  function slotRoundLabel(refM, matchesById) {
    if (!refM || !matchesById) return null;
    var count = 0;
    var keys = Object.keys(matchesById);
    for (var i = 0; i < keys.length; i++) {
      var rm = matchesById[keys[i]];
      if (rm.round === refM.round && rm.phaseId === refM.phaseId) count++;
    }
    var names = { 2: 'Final', 4: 'Semi', 8: 'Quartas', 16: 'Oitavas' };
    var rName = names[count * 2] || ('R' + refM.round);
    return rName + (count > 1 ? ' ' + refM.order : '');
  }

  function slotLabel(slot, teamsById, matchesById) {
    if (!slot) return '?';
    if (slot.type === 'team') return teamsById[slot.teamId] ? teamsById[slot.teamId].name : '?';
    if (slot.type === 'winnerOf' || slot.type === 'loserOf') {
      var resolved = resolveSlotTeam(slot, teamsById, matchesById);
      if (resolved) return resolved;
      var refM = matchesById && matchesById[slot.matchId];
      var prefix = slot.type === 'winnerOf' ? 'Venc. ' : 'Perd. ';
      var label = slotRoundLabel(refM, matchesById);
      return label ? prefix + label : prefix + 'jogo ' + slot.matchId.slice(-4);
    }
    return '?';

<script>/* src/ui/views-results.js */
/* Tela "Resultados": pódio final por categoria e estatísticas do torneio.
 * Extrai campeão, vice, 3º e 4º lugar da final e disputa de 3º. */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h, WA = ui.wa;

  function matchWinner(m) {
    if (!m || m.status !== 'finalizado') return null;
    if (m.resultType === 'wo' || m.resultType === 'desistencia') return m.slotA.teamId;
    var sA = 0, sB = 0;
    if (m.sets && m.sets.length) m.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; });
    return sA > sB ? m.slotA.teamId : m.slotB.teamId;
  }

  function matchLoser(m) {
    if (!m || m.status !== 'finalizado') return null;
    var wId = matchWinner(m);
    if (!wId) return null;
    return m.slotA.teamId === wId ? m.slotB.teamId : m.slotA.teamId;
  }

  function matchScore(m) {
    if (!m || m.status !== 'finalizado' || !m.sets || !m.sets.length) return '';
    return m.sets.map(function (s) { return s.a + '×' + s.b; }).join(', ');
  }

  var PLACE_LABELS = ['Campeão', 'Vice-campeão', '3º lugar', '4º lugar'];
  var PLACE_CLASSES = ['gold', 'silver', 'bronze', 'fourth'];
  var PLACE_ICONS = ['🥇', '🥈', '🥉', '4º'];

  function podiumCard(place, teamName, detail) {
    return h('div', { class: 'podium-card podium-' + PLACE_CLASSES[place], dataset: { testid: 'podium-' + (place + 1) } },
      h('div', { class: 'podium-icon' }, PLACE_ICONS[place]),
      h('div', { class: 'podium-info' },
        h('div', { class: 'podium-place' }, PLACE_LABELS[place]),
        h('div', { class: 'podium-team' }, teamName || 'A definir'),
        detail ? h('div', { class: 'podium-detail' }, detail) : null
      )
    );
  }

  function statsBlock(allMatches) {
    var total = allMatches.length;
    var finished = allMatches.filter(function (m) { return m.status === 'finalizado'; }).length;
    var totalSets = 0, totalPoints = 0, wos = 0;
    allMatches.forEach(function (m) {
      if (m.status !== 'finalizado') return;
      if (m.resultType === 'wo' || m.resultType === 'desistencia') { wos++; return; }
      if (m.sets && m.sets.length) {
        totalSets += m.sets.length;
        m.sets.forEach(function (s) { totalPoints += (s.a || 0) + (s.b || 0); });
      }
    });
    var items = [
      { label: 'Jogos', value: finished + '/' + total },
      { label: 'Sets disputados', value: String(totalSets) },
      { label: 'Pontos marcados', value: String(totalPoints) }
    ];
    if (wos > 0) items.push({ label: 'WOs/Desistências', value: String(wos) });
    return h('div', { class: 'results-stats', dataset: { testid: 'results-stats' } },
      items.map(function (it) {
        return h('div', { class: 'stat-item' },
          h('div', { class: 'stat-value' }, it.value),
          h('div', { class: 'stat-label' }, it.label)
        );
      })
    );
  }

  async function resultsView(ctx) {
    var t = await ui.loadTournament(ctx), store = ctx.store;
    var cats = await store.list('categories', { tournamentId: t.id });
    var base = { title: 'Resultados', tournament: t, tab: 'results', section: 'results',
      crumbs: [{ label: 'Dashboard', href: '/dashboard' }, { label: t.name, href: ui.tpath(t) }, { label: 'Resultados' }] };

    if (!cats.length) return Object.assign(base, { content: ui.emptyState('Sem categorias', 'Crie uma categoria para ver os resultados.') });

    var cat = ctx.params.cid ? cats.filter(function (c) { return c.id === ctx.params.cid; })[0] : (cats.filter(function (c) { return c.active; })[0] || cats[0]);
    if (!cat) throw new VT.errors.NotFoundError('Categoria', ctx.params.cid);

    var catTabs = cats.length > 1 ? h('div', { class: 'cat-tabs' }, cats.map(function (c) {
      return h('a', { class: 'tab' + (c.id === cat.id ? ' active' : ''), href: '#' + ui.tpath(t, '/results?cid=' + c.id) }, c.name);
    })) : null;

    var allPhases = await store.list('phases', { categoryId: cat.id });
    var koPhases = allPhases.filter(function (p) { return p.type === 'knockout' || p.type === 'thirdPlace'; });

    if (!koPhases.length) {
      return Object.assign(base, { content: h('div', { class: 'results-view', dataset: { testid: 'results-view' } }, catTabs,
        ui.emptyState('Fase eliminatória não gerada', 'Gere a fase eliminatória e registre os resultados para ver o pódio.',
          h('a', { class: 'btn primary', href: '#' + ui.tpath(t, '/bracket?cid=' + cat.id) }, 'Ir para Chaves'))) });
    }

    var teamsArr = await store.list('teams', { categoryId: cat.id });
    var teamsById = {};
    teamsArr.forEach(function (tm) { teamsById[tm.id] = tm; });

    var koMatches = [], thirdMatch = null, finalMatch = null;
    for (var pi = 0; pi < koPhases.length; pi++) {
      var pm = await store.list('matches', { phaseId: koPhases[pi].id });
      if (koPhases[pi].type === 'thirdPlace') { thirdMatch = pm[0] || null; }
      else { koMatches = koMatches.concat(pm); }
    }

    if (koMatches.length) {
      var maxRound = 0;
      koMatches.forEach(function (m) { if (m.round > maxRound) maxRound = m.round; });
      var finals = koMatches.filter(function (m) { return m.round === maxRound; });
      if (finals.length === 1) finalMatch = finals[0];
    }

    var allCatMatches = await store.list('matches', { categoryId: cat.id });

    var allFinished = allCatMatches.every(function (m) { return m.status === 'finalizado'; });
    var koFinished = koMatches.every(function (m) { return m.status === 'finalizado'; }) &&
      (!thirdMatch || thirdMatch.status === 'finalizado');

    var teamName = function (id) { return id && teamsById[id] ? teamsById[id].name : null; };

    var places = [null, null, null, null];
    if (finalMatch && finalMatch.status === 'finalizado') {
      places[0] = teamName(matchWinner(finalMatch));
      places[1] = teamName(matchLoser(finalMatch));
    }
    if (thirdMatch && thirdMatch.status === 'finalizado') {
      places[2] = teamName(matchWinner(thirdMatch));
      places[3] = teamName(matchLoser(thirdMatch));
    }

    var hasPodium = places[0] !== null;

    var statusBadge = koFinished
      ? ui.badge('Completo', 'success')
      : ui.badge('Em andamento', 'info');

    var podiumEntries = places.map(function (name, i) { return name ? { name: name } : null; }).filter(Boolean);
    var podium = h('div', { class: 'podium-wrap', dataset: { testid: 'podium' } },
      h('h3', { class: 'section-title' }, 'Pódio'),
      hasPodium
        ? h('div', null,
            h('div', { class: 'podium-grid' },
              podiumCard(0, places[0], finalMatch ? matchScore(finalMatch) : null),
              podiumCard(1, places[1], null),
              podiumCard(2, places[2], thirdMatch ? matchScore(thirdMatch) : null),
              podiumCard(3, places[3], null)
            ),
            WA.sharePodiumBtn(t, cat, podiumEntries)
          )
        : h('div', { class: 'podium-pending' },
            h('p', { class: 'muted' }, 'O pódio será exibido quando a final e a disputa de 3º lugar forem concluídas.'),
            h('a', { class: 'btn primary', href: '#' + ui.tpath(t, '/standings?cid=' + cat.id) }, 'Ver Classificação')
          )
    );

    var stats = h('div', { class: 'results-section' },
      h('h3', { class: 'section-title' }, 'Estatísticas da categoria'),
      statsBlock(allCatMatches)
    );

    var summaryMatches = [];
    if (finalMatch) summaryMatches.push({ label: 'Final', match: finalMatch });
    if (thirdMatch) summaryMatches.push({ label: 'Disputa de 3º lugar', match: thirdMatch });

    var finalCards = summaryMatches.length ? h('div', { class: 'results-section', dataset: { testid: 'results-finals' } },
      h('h3', { class: 'section-title' }, 'Jogos decisivos'),
      h('div', { class: 'results-final-cards' },
        summaryMatches.map(function (item) {
          var m = item.match;
          var nameA = m.slotA && m.slotA.type === 'team' && teamsById[m.slotA.teamId] ? teamsById[m.slotA.teamId].name : 'A definir';
          var nameB = m.slotB && m.slotB.type === 'team' && teamsById[m.slotB.teamId] ? teamsById[m.slotB.teamId].name : 'A definir';
          var scoreA = '', scoreB = '';
          if (m.status === 'finalizado' && m.sets && m.sets.length) {
            scoreA = m.sets.map(function (s) { return s.a; }).join(' / ');
            scoreB = m.sets.map(function (s) { return s.b; }).join(' / ');
          }
          var wA = false, wB = false;
          if (m.status === 'finalizado') {
            var wId = matchWinner(m);
            wA = m.slotA.teamId === wId;
            wB = m.slotB.teamId === wId;
          }
          return h('div', { class: 'result-final-card', dataset: { testid: 'result-final-' + item.label.toLowerCase().replace(/\s+/g, '-') } },
            h('div', { class: 'result-final-label' }, item.label),
            h('div', { class: 'result-final-teams' },
              h('div', { class: 'result-final-team' + (wA ? ' winner' : '') },
                h('span', { class: 'result-final-name' }, nameA),
                h('span', { class: 'result-final-score' }, scoreA)
              ),
              h('div', { class: 'result-final-vs' }, m.status === 'finalizado' ? '' : 'vs'),
              h('div', { class: 'result-final-team' + (wB ? ' winner' : '') },
                h('span', { class: 'result-final-name' }, nameB),
                h('span', { class: 'result-final-score' }, scoreB)
              )
            ),
            h('div', { class: 'result-final-status' },
              ui.badge(m.status === 'finalizado' ? 'Finalizado' : m.status === 'agendado' ? 'Agendado' : 'Aguardando',
                m.status === 'finalizado' ? 'success' : 'muted')
            )
          );
        })
      )
    ) : null;

    var content = h('div', { class: 'results-view', dataset: { testid: 'results-view' } },
      catTabs,
      h('div', { class: 'results-header' },
        h('h2', null, cat.name),
        statusBadge
      ),
      podium,
      finalCards,
      stats
    );

    return Object.assign(base, { content: content });
  }

  ui.route('/t/:tid/results', resultsView);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Simulação personalizada: Feminino Iniciante (9 duplas, 3 chaves×3) + Masculino Iniciante (13 duplas, chave C maior) */
(function (root) {
  'use strict';
  var VT = root.VT;
  function mf(pts) { return { bestOf: 1, pointsToWin: pts, tiebreakPoints: null, minDiff: null, maxPoints: null }; }
  function randomScore(target) {
    var lo = Math.floor(target * 0.3) + Math.floor(Math.random() * Math.floor(target * 0.4));
    if (lo >= target - 1) lo = target - 2;
    if (lo < 0) lo = 0;
    return Math.random() < 0.45 ? { a: lo, b: target } : { a: target, b: lo };
  }

  async function simCat(store, tid, def) {
    var cat = await store.create('categories', {
      tournamentId: tid, name: def.name, gender: def.gender, level: def.level,
      modality: 'areia', teamType: { key: 'dupla', label: 'Dupla', size: 2 },
      useAthletes: false, teamsCount: def.names.length
    });
    var gcfg = { groups: def.sizes.length, teamsPerGroup: Math.max.apply(null, def.sizes),
      qualifiedPerGroup: def.qpg, format: 'roundRobin', legs: 1 };
    var minSz = Math.min.apply(null, def.sizes);
    if (minSz !== gcfg.teamsPerGroup) { gcfg.sizes = def.sizes; gcfg.balanced = true; }
    var gphase = await store.create('phases', {
      categoryId: cat.id, order: 1, name: 'Grupos', type: 'groups',
      matchFormat: mf(15), groupsConfig: gcfg
    });
    var teams = [];
    for (var ti = 0; ti < def.names.length; ti++)
      teams.push(await store.create('teams', { categoryId: cat.id, name: def.names[ti] }));
    var idx = 0;
    for (var gi = 0; gi < def.sizes.length; gi++) {
      var sz = def.sizes[gi];
      await store.create('groups', {
        phaseId: gphase.id, name: String.fromCharCode(65 + gi), order: gi + 1,
        teamIds: teams.slice(idx, idx + sz).map(function (t) { return t.id; })
      });
      idx += sz;
    }
    await store.update('phases', gphase.id, { confirmedAt: new Date().toISOString() });
    await store.generateGroupMatches(cat.id);
    var gms = await store.list('matches', { phaseId: gphase.id });
    for (var mi = 0; mi < gms.length; mi++)
      if (gms[mi].slotA.type === 'team' && gms[mi].slotB.type === 'team' && gms[mi].status !== 'finalizado')
        await store.recordResult(gms[mi].id, { sets: [randomScore(15)] });
    var ko = await store.generateKnockout(cat.id);
    var koms = await store.list('matches', { phaseId: ko.knockoutPhase.id });
    koms.sort(function (a, b) { return a.round - b.round || a.order - b.order; });
    var maxR = koms.reduce(function (mx, m) { return Math.max(mx, m.round); }, 0);
    for (var ki = 0; ki < koms.length; ki++) {
      var km = koms[ki];
      var pts = km.round === maxR ? 21 : km.round === maxR - 1 ? 18 : 15;
      await store.recordResult(km.id, { sets: [randomScore(pts)] });
    }
    if (ko.thirdPlacePhase && ko.thirdPlaceMatch) {
      var tp = await store.get('matches', ko.thirdPlaceMatch.id);
      if (tp && tp.slotA && tp.slotA.type === 'team' && tp.slotB && tp.slotB.type === 'team')
        await store.recordResult(tp.id, { sets: [randomScore(21)] });
    }
    return { category: cat, teams: teams };
  }

  VT.Store.prototype.simulateTournament = async function () {
    var store = this;
    var res = await store.createTournament({
      name: 'Torneio Beach — Simulação',
      startDate: '2026-11-15', endDate: '2026-11-16',
      venue: 'Arena Beach', modality: 'areia'
    });
    var tid = res.tournament.id;

    var femR = await simCat(store, tid, {
      name: 'Feminino Iniciante', gender: 'Feminino', level: 'Iniciante',
      sizes: [3, 3, 3], qpg: 2,
      names: ['Ana & Bia','Carol & Dani','Eli & Fabi',
              'Gabi & Helo','Ísis & Jade','Kris & Lara',
              'Mari & Nina','Olga & Pia','Rita & Sara']
    });

    var masR = await simCat(store, tid, {
      name: 'Masculino Iniciante', gender: 'Masculino', level: 'Iniciante',
      sizes: [3, 3, 4, 3], qpg: 2,   // Chave C (índice 2) tem 4 duplas
      names: ['Alex & Bruno','Caio & Diego','Edu & Fábio',
              'Guto & Hélio','Ivan & João','Kadu & Léo',
              'Mário & Neto','Omar & Paulo','Rui & Sérgio','Tiago & Ugo',
              'Vitor & Wil','Xande & Yago','Zé & André']
    });

    return { tournament: res.tournament, categories: [femR, masR] };
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* src/ui/views-tv.js */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;

  var DEFAULT_INTERVAL = 5000;

  function chunk(arr, size) {
    var out = [];
    for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  /* Renderiza um card de partida */
  function tvMatchCard(m, teamsById, isLiveSlide) {
    var nameA = m.slotA && m.slotA.teamId && teamsById[m.slotA.teamId] ? teamsById[m.slotA.teamId].name : '—';
    var nameB = m.slotB && m.slotB.teamId && teamsById[m.slotB.teamId] ? teamsById[m.slotB.teamId].name : '—';
    var sA = 0, sB = 0;
    var isLive = m.status === 'andamento';
    var isDone = m.status === 'finalizado';
    if ((isLive || isDone) && m.sets && m.sets.length) {
      m.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; });
    }
    var winA = isDone && sA > sB, winB = isDone && sB > sA;
    var setsDetail = (isLive || isDone) && m.sets && m.sets.length
      ? m.sets.map(function (s) { return s.a + ':' + s.b; }).join('  ')
      : '';

    var scoreBlock;
    if (isLive) {
      scoreBlock = h('div', { class: 'tv-score-col' },
        h('div', { class: 'tv-sets-score' }, sA + ' × ' + sB),
        setsDetail ? h('div', { class: 'tv-sets-detail' }, setsDetail) : null,
        h('div', { class: 'tv-live-badge' },
          h('span', { class: 'tv-live-dot' }),
          'AO VIVO'));
    } else if (isDone) {
      scoreBlock = h('div', { class: 'tv-score-col' },
        h('div', { class: 'tv-sets-score' }, sA + ' × ' + sB),
        setsDetail ? h('div', { class: 'tv-sets-detail' }, setsDetail) : null);
    } else {
      scoreBlock = h('div', { class: 'tv-score-col' },
        h('div', { class: 'tv-vs' }, 'vs'),
        m.order ? h('div', { class: 'tv-sched-info' }, 'Jogo ' + m.order) : null);
    }

    var cls = 'tv-match';
    if (isLive) cls += ' live';
    else if (!isDone) cls += ' next-match';

    return h('div', { class: cls },
      h('div', { class: 'tv-team-a' + (winA ? ' winner' : '') }, nameA),
      scoreBlock,
      h('div', { class: 'tv-team-b' + (winB ? ' winner' : '') }, nameB));
  }

  /* Renderiza o conteúdo de um slide */
  function renderSlide(slide, teamsById) {
    if (slide.type === 'live' || slide.type === 'next') {
      return h('div', null, slide.items.map(function (m) {
        return tvMatchCard(m, teamsById, slide.type === 'live');
      }));
    }
    if (slide.type === 'standings') {
      var qpg = slide.qualifiedPerGroup || 0;
      return h('div', { class: 'tv-std-wrap' }, slide.groups.map(function (gs) {
        var rows = gs.rows || [];
        var qualCutoff = qpg;
        var children = [
          h('div', { class: 'tv-std-head' }, gs.group.name || 'Grupo'),
          h('div', { class: 'tv-std-label' },
            h('span', null, '#'), h('span', null, 'Equipe'),
            h('span', null, 'J'), h('span', null, 'V'), h('span', null, 'D'),
            h('span', null, 'SD'), h('span', null, 'Pts'))
        ];
        rows.forEach(function (r, ri) {
          if (qualCutoff && ri > 0 && r.rank === qualCutoff + 1) {
            children.push(h('div', { class: 'tv-std-divider' }));
          }
          var qual = qualCutoff && r.rank <= qualCutoff;
          children.push(h('div', { class: 'tv-std-row' + (qual ? ' tv-qualified' : '') },
            h('span', { class: 'tv-rank' }, r.rank),
            h('span', { class: 'tv-tname' }, r.teamName || '?'),
            h('span', { class: 'tv-num' }, r.played),
            h('span', { class: 'tv-num' }, r.wins),
            h('span', { class: 'tv-num' }, r.losses),
            h('span', { class: 'tv-num' }, (r.diff >= 0 ? '+' : '') + r.diff),
            h('span', { class: 'tv-pts' }, r.points)));
        });
        return h('div', { class: 'tv-std-group' }, children);
      }));
    }
    return h('div', { class: 'tv-empty-slide' }, 'Sem dados disponíveis');
  }

  /* Monta lista de slides por categoria */
  function buildCategorySlides(activeCats, catData) {
    var slides = [];
    activeCats.forEach(function (cat) {
      var d = catData[cat.id];
      if (!d) return;

      /* AO VIVO */
      if (d.live.length) {
        chunk(d.live, 3).forEach(function (page, i, all) {
          slides.push({ type: 'live', catName: cat.name, items: page, pageNum: i + 1, totalPages: all.length });
        });
      }

      /* PRÓXIMOS */
      if (d.next.length) {
        chunk(d.next, 4).forEach(function (page, i, all) {
          slides.push({ type: 'next', catName: cat.name, items: page, pageNum: i + 1, totalPages: all.length });
        });
      }

      /* CLASSIFICAÇÃO */
      if (d.standings && d.standings.length) {
        chunk(d.standings, 2).forEach(function (page, i, all) {
          slides.push({ type: 'standings', catName: cat.name, groups: page, qualifiedPerGroup: d.qualifiedPerGroup, pageNum: i + 1, totalPages: all.length });
        });
      }
    });
    return slides;
  }

  var TYPE_LABELS = { live: '● AO VIVO', next: 'PRÓXIMOS JOGOS', standings: 'CLASSIFICAÇÃO' };

  ui.route('/t/:tid/tv', async function (ctx) {
    var t = await ui.loadTournament(ctx);
    var store = ctx.store;
    var interval = parseInt(ctx.params.interval) || DEFAULT_INTERVAL;

    var cats = await store.list('categories', { tournamentId: t.id });
    var activeCats = cats.filter(function (c) { return c.active; });
    if (!activeCats.length) activeCats = cats;

    var allTeamsById = {};
    var catData = {};

    for (var ci = 0; ci < activeCats.length; ci++) {
      var cat = activeCats[ci];
      var teams = await store.list('teams', { categoryId: cat.id });
      teams.forEach(function (tm) { allTeamsById[tm.id] = tm; });
      var catMatches = await store.list('matches', { categoryId: cat.id });
      var live = [], next = [];
      catMatches.forEach(function (m) {
        if (m.status === 'andamento') live.push(m);
        else if (m.status === 'aguardando' || m.status === 'agendado') next.push(m);
      });
      next.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var sd = await store.groupStandings(cat.id);
      var qpg = sd.phase && sd.phase.groupsConfig && sd.phase.groupsConfig.qualifiedPerGroup || 0;
      catData[cat.id] = { live: live, next: next, standings: sd.standings || [], qualifiedPerGroup: qpg };
    }

    var slides = buildCategorySlides(activeCats, catData);
    if (!slides.length) slides = [{ type: 'empty', catName: t.name, totalPages: 1, pageNum: 1 }];

    /* DOM */
    var wrap = h('div', { class: 'tv-wrap' });
    var headerTitleEl = h('div', { class: 'tv-slide-title' });
    var headerSubEl = h('div', { class: 'tv-slide-sub' });
    var bodyEl = h('div', { class: 'tv-body' });
    var dotsEl = h('div', { class: 'tv-dots' });
    var timeEl = h('div', { class: 'tv-time-display' });

<script>/* ===== Painel Acesso & Compartilhamento ===== */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;
  var erpAccess = root.__erpAccess;

  function statusInfo() {
    var cfg = erpAccess.load();
    var now = new Date();
    var start = new Date(cfg.inicio.replace(' ', 'T'));
    var end = new Date(start.getTime() + cfg.duracaoHoras * 3600000);
    if (now < start) return { code: 'antes', label: '⏳ Torneio ainda não iniciou — começa em ' + cfg.inicio };
    if (now > end) return { code: 'encerrado', label: '🔒 Período encerrado desde ' + end.toLocaleString('pt-BR') };
    var left = Math.ceil((end - now) / 60000);
    var h = Math.floor(left / 60), m = left % 60;
    return { code: 'ok', label: '✅ Acesso ativo — faltam ' + (h > 0 ? h + 'h ' : '') + m + 'min' };
  }

  function renderQR(url, wrap) {
    wrap.innerHTML = '';
    if (!url) { wrap.innerHTML = '<p style="color:var(--muted,#6b7280);font-size:.8rem;text-align:center">Informe a URL para gerar o QR Code</p>'; return; }
    var el = root.makeQREl(url, 200);
    wrap.appendChild(el);
  }

  ui.route('/acesso', function (ctx) {
    try { if (sessionStorage.getItem('erp_acesso_ok') !== 'admin') return { redirect: '/dashboard' }; } catch(e){}
    var cfg = erpAccess.load();
    var st = statusInfo();

    var fields = [
      { key: 'torneio', label: 'Nome do torneio', type: 'text' },
      { key: 'inicio',  label: 'Início (AAAA-MM-DD HH:MM)', type: 'text', placeholder: '2026-11-01 09:00' },
      { key: 'duracaoHoras', label: 'Duração (horas)', type: 'number', min: 1 },
      { key: 'senha', label: 'Senha do ADM do torneio', type: 'text' }
    ];

    var inputs = {};
    var qrWrap = h('div', { class: 'acesso-qr-wrap' });

    function save() {
      var updated = Object.assign({}, cfg);
      fields.forEach(function (f) { updated[f.key] = f.key === 'duracaoHoras' ? Number(inputs[f.key].value) : inputs[f.key].value.trim(); });
      updated.viewUrl      = inputs.viewUrl.value.trim();
      updated.githubOwner  = inputs.githubOwner.value.trim();
      updated.githubRepo   = inputs.githubRepo.value.trim();
      updated.githubToken  = inputs.githubToken.value.trim();
      erpAccess.save(updated);
      // refresh status
      var newSt = statusInfo();
      statusDiv.className = 'acesso-status ' + newSt.code;
      statusDiv.textContent = newSt.label;
      renderQR(buildViewUrl(updated), qrWrap);
      alert('Configurações salvas!');
    }

    var tourSelect;
    function publishView() {
      var owner = inputs.githubOwner.value.trim();
      var repo  = inputs.githubRepo.value.trim();
      var token = inputs.githubToken.value.trim();
      if (!owner || !repo || !token) {
        alert('Preencha Owner, Repo e Token do GitHub antes de publicar.');
        return;
      }
      // auto-salva as credenciais para não precisar redigitar
      var cfgAtual = erpAccess.load();
      erpAccess.save(Object.assign({}, cfgAtual, { githubOwner: owner, githubRepo: repo, githubToken: token }));
      publishBtn.textContent = 'Publicando…';
      publishBtn.disabled = true;

      var store = ctx.store;
      store.list('tournaments').then(function (tournaments) {
        if (!tournaments || !tournaments.length) {
          publishBtn.textContent = 'Publicar View'; publishBtn.disabled = false;
          alert('Nenhum torneio encontrado no banco local.');
          return;
        }
        var selId = tourSelect ? tourSelect.value : '';
        var tournament = (selId && tournaments.find(function(t){ return t.id === selId; })) || tournaments[tournaments.length - 1];
        var tid = tournament.id;
        // categorias primeiro (têm tournamentId); depois matches e teams por categoryId
        return store.list('categories', { tournamentId: tid }).then(function (cats) {
          var catIds = cats.map(function (c) { return c.id; });
          return Promise.all([
            // matches: busca por categoryId (não têm tournamentId)
            Promise.all(catIds.map(function (cid) { return store.list('matches', { categoryId: cid }); }))
              .then(function (arrays) { return [].concat.apply([], arrays); }),
            // teams: busca por categoryId
            Promise.all(catIds.map(function (cid) { return store.list('teams', { categoryId: cid }); }))
              .then(function (arrays) { return [].concat.apply([], arrays); }),
            cats
          ]);
        }).then(function (results) {
          var data = { tournament: tournament, matches: results[0], teams: results[1], categories: results[2], publishedAt: new Date().toISOString() };
          var json = JSON.stringify(data, null, 2);
          var b64  = btoa(unescape(encodeURIComponent(json)));
          var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/view-data.json';
          var hdrs = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
          // pega SHA atual (necessário para atualizar)
          return fetch(apiUrl, { headers: hdrs }).then(function (r) {
            if (r.status === 200) return r.json().then(function (f) { return f.sha; });
            return null;
          }).then(function (sha) {
            var body = { message: 'Publicar dados do torneio ' + new Date().toLocaleString('pt-BR'), content: b64 };
            if (sha) body.sha = sha;
            return fetch(apiUrl, { method: 'PUT', headers: hdrs, body: JSON.stringify(body) });
          }).then(function (r) {
            publishBtn.textContent = 'Publicar View'; publishBtn.disabled = false;
            if (r.ok) {
              alert('✅ Publicado!\nAguarde ~1 minuto para o GitHub Pages atualizar.\nAtletas que recarregarem a página verão os dados novos.');
            } else {
              r.json().then(function (e) { alert('Erro ao publicar: ' + (e.message || r.status)); });
            }
          });
        });
      }).catch(function (err) {
        publishBtn.textContent = 'Publicar View'; publishBtn.disabled = false;
        alert('Erro: ' + (err && err.message ? err.message : String(err)));
      });
    }

    var publishBtn = h('button', { class: 'btn btn-success', onclick: publishView }, ['Publicar View']);

    tourSelect = h('select', { class: '' });
    tourSelect.appendChild(h('option', { value: '' }, ['Carregando torneios…']));
    tourSelect.addEventListener('change', function () {
      try { localStorage.setItem('erp_selected_tournament_id', tourSelect.value); } catch(e) {}
    });
    var tourSelectField = h('div', { class: 'acesso-field' }, [
      h('label', {}, ['Torneio a publicar']),
      tourSelect
    ]);
    setTimeout(function () {
      ctx.store.list('tournaments').then(function (ts) {
        while (tourSelect.firstChild) tourSelect.removeChild(tourSelect.firstChild);
        if (!ts || !ts.length) {
          tourSelect.appendChild(h('option', { value: '' }, ['Nenhum torneio encontrado']));
          return;
        }
        var savedId = null; try { savedId = localStorage.getItem('erp_selected_tournament_id'); } catch(e) {}
        ts.forEach(function (t) {
          var opt = h('option', { value: t.id }, [t.name || t.id]);
          if (t.id === savedId) opt.selected = true;
          tourSelect.appendChild(opt);
        });
        if (!savedId || !ts.find(function (t) { return t.id === savedId; })) {
          tourSelect.value = ts[ts.length - 1].id;
        }
      });
    }, 0);

    var statusDiv = h('div', { class: 'acesso-status ' + st.code }, [st.label]);

    var fieldNodes = fields.map(function (f) {
      var attrs = { class: 'acesso-field' };
      var inputAttrs = { id: 'acesso-' + f.key, type: f.type || 'text', value: String(cfg[f.key] || ''), class: '' };
      if (f.placeholder) inputAttrs.placeholder = f.placeholder;
      if (f.min) inputAttrs.min = String(f.min);
      var input = h('input', inputAttrs);
      inputs[f.key] = input;
      return h('div', attrs, [h('label', { for: 'acesso-' + f.key }, [f.label]), input]);
    });

    var adminField = h('div', { class: 'acesso-field' }, [
      h('label', {}, ['Senha do proprietário (somente leitura)']),
      h('input', { type: 'text', value: cfg.senhaAdmin, readonly: '', class: '' })
    ]);

    var viewUrlInput = h('input', { type: 'url', id: 'acesso-viewUrl', value: cfg.viewUrl || '', placeholder: 'https://usuario.github.io/torneio/#/view', class: '' });
    inputs.viewUrl = viewUrlInput;

    var copyBtn = h('button', { class: 'btn btn-sm', onclick: function () {
      navigator.clipboard && navigator.clipboard.writeText(viewUrlInput.value).then(function () { copyBtn.textContent = 'Copiado!'; setTimeout(function () { copyBtn.textContent = 'Copiar'; }, 2000); });
    }}, ['Copiar']);

    // campos GitHub
    var ghOwnerInput = h('input', { type: 'text', value: cfg.githubOwner || '', placeholder: 'ex: lipebraw-code', class: '' });
    var ghRepoInput  = h('input', { type: 'text', value: cfg.githubRepo  || '', placeholder: 'ex: salgadoking',  class: '' });
    var ghTokenInput = h('input', { type: 'password', value: cfg.githubToken || '', placeholder: 'ghp_…', class: '', autocomplete: 'off' });
    inputs.githubOwner = ghOwnerInput;
    inputs.githubRepo  = ghRepoInput;
    inputs.githubToken = ghTokenInput;

    function buildViewUrl(c) {
      if (!c.viewUrl) return '';
      var base = c.viewUrl.split('?')[0];
      return base + '?s=' + encodeURIComponent(c.inicio) + '&h=' + c.duracaoHoras;
    }
    setTimeout(function () { renderQR(buildViewUrl(cfg), qrWrap); }, 0);

    var content = h('div', { class: 'acesso-panel' }, [
      h('div', { class: 'acesso-section' }, [
        h('h3', {}, ['Status atual']),
        statusDiv
      ]),
      h('div', { class: 'acesso-section' }, [
        h('h3', {}, ['Configurações do torneio'])
      ].concat(fieldNodes).concat([adminField])),
      h('div', { class: 'acesso-section' }, [
        h('h3', {}, ['URL & QR Code para atletas']),
        h('div', { class: 'acesso-field' }, [
          h('label', { for: 'acesso-viewUrl' }, ['URL pública da página do atleta']),
          h('div', { class: 'acesso-url-row' }, [viewUrlInput, copyBtn])
        ]),
        qrWrap,
        h('p', { class: 'acesso-qr-label' }, ['Escaneie para acessar a visão do atleta'])
      ]),
      h('div', { class: 'acesso-section' }, [
        h('h3', {}, ['Publicar dados para atletas (GitHub)']),
        h('p', { class: 'acesso-hint' }, ['Preencha os campos abaixo e clique em "Publicar View" para enviar os dados do torneio ao GitHub. A página do atleta lerá esses dados automaticamente.']),
        h('div', { class: 'acesso-field' }, [h('label', {}, ['GitHub Owner (usuário ou org)']), ghOwnerInput]),
        h('div', { class: 'acesso-field' }, [h('label', {}, ['GitHub Repo (nome do repositório)']), ghRepoInput]),
        h('div', { class: 'acesso-field' }, [h('label', {}, ['GitHub Token (classic, com permissão repo)']), ghTokenInput]),
        tourSelectField,
        publishBtn
      ]),
      h('button', { class: 'btn btn-primary', onclick: save }, ['Salvar configurações'])
    ]);

    return { title: 'Acesso & Compartilhamento', section: 'acesso', content: content };
  });
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>
<script>/* ===== Página /view — visão do atleta (mobile-first, sem lock) ===== */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;

  function getMatches(store, tid) {
    return store.list('matches').then(function (all) {
      return all.filter(function (m) { return m.tournamentId === tid; });
    });
  }
  function getTeams(store, tid) {
    return store.list('teams').then(function (all) {
      return all.filter(function (t) { return t.tournamentId === tid; });
    });
  }
  function getCategories(store, tid) {
    return store.list('categories').then(function (all) {
      return all.filter(function (c) { return c.tournamentId === tid; });
    });
  }

  function teamName(teams, id) {
    var t = teams.find(function (x) { return x.id === id; });
    return t ? t.name : '—';
  }

  function slotLabel(slot, teams) {
    if (!slot) return '—';
    if (slot.type === 'team') return teamName(teams, slot.teamId);
    return 'A definir';
  }

  function isLive(m) { return m.status === 'andamento' || m.status === 'live'; }
  function isScheduled(m) { return m.status === 'agendado' || m.status === 'aguardando' || !m.status; }
  function isFinished(m) { return m.status === 'finalizado' || m.status === 'finished'; }

  function renderMatchCard(m, teams, showLive) {
    var live = showLive && isLive(m);
    var a = slotLabel(m.slotA, teams);
    var b = slotLabel(m.slotB, teams);

    // placar: conta sets ganhos
    var sets = m.sets || [];
    var setsA = sets.filter(function (s) { return s.a > s.b; }).length;
    var setsB = sets.filter(function (s) { return s.b > s.a; }).length;
    var hasScore = sets.length > 0;
    var winA = hasScore && setsA > setsB;
    var winB = hasScore && setsB > setsA;

    // detalhe dos sets ex: "12-15 / 15-9"
    var setsDetail = sets.map(function (s) { return s.a + '-' + s.b; }).join(' / ');

    var sch = m.schedule || {};
    var court = sch.court ? 'Q' + sch.court : '';
    var time  = sch.time  || '';

    var header = h('div', { class: 'view-card-header' }, [
      h('span', { class: 'view-meta' }, [court]),
      live ? h('span', { class: 'badge ao-vivo' }, ['AO VIVO'])
           : h('span', { class: 'view-meta' }, [time])
    ]);
    var teamsEl = h('div', { class: 'view-teams' }, [
      h('div', { class: 'view-team-row' + (winA ? ' winner' : '') }, [
        h('span', {}, [a]),
        hasScore ? h('span', { class: 'view-score' }, [String(setsA)]) : h('span', {})
      ]),
      h('div', { class: 'view-team-row' + (winB ? ' winner' : '') }, [
        h('span', {}, [b]),
        hasScore ? h('span', { class: 'view-score' }, [String(setsB)]) : h('span', {})
      ])
    ]);
    var detail = hasScore ? h('p', { class: 'view-sets-detail' }, [setsDetail]) : null;
    var children = [header, teamsEl];
    if (detail) children.push(detail);
    return h('div', { class: 'view-card' + (live ? ' live' : '') }, children);
  }

  ui.route('/view', function (ctx) {
    var store = ctx.store;

    var container = h('div', { class: 'view-page' }, [h('p', {}, ['Carregando…'])]);

    // auto-refresh 5 min
    var refreshTimer = null;
    function scheduleRefresh() {
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(function () { load(); scheduleRefresh(); }, 300000);
    }

    function renderData(torneio, matches, teams, cats) {
      var activeCat = 'all';
      var activeTab = 'jogos';

      function filteredMatches() {
        if (activeCat === 'all') return matches;
        return matches.filter(function (m) { return m.categoryId === activeCat; });
      }

      function computeStandings() {
        var byCat = {};
        cats.forEach(function (cat) {
          var catMs = matches.filter(function (m) { return m.categoryId === cat.id && isFinished(m); });
          var catBestOf = (cat.defaultMatchFormat && parseInt(cat.defaultMatchFormat.bestOf)) || 1;
          var groups = {};
          catMs.forEach(function (m) {
            var gk = (m.groupId || m.group || '__all__') + '';
            if (!groups[gk]) groups[gk] = {};
            var g = groups[gk];
            var sets = m.sets || [];
            var sA = sets.filter(function (s) { return s.a > s.b; }).length;
            var sB = sets.filter(function (s) { return s.b > s.a; }).length;
            var wA = sA > sB, wB = sB > sA;
            var effSA = sA, effSB = sB;
            if (catBestOf === 3 && sets.length < 3) {
              var unplayed = 3 - sets.length;
              if (wA) effSA += unplayed;
              else if (wB) effSB += unplayed;
            }
            function addTeam(tid, win, sp, sc) {
              if (!tid) return;
              if (!g[tid]) g[tid] = { teamId: tid, j: 0, v: 0, d: 0, sp: 0, sc: 0, pts: 0 };
              var r = g[tid]; r.j++; r.sp += sp; r.sc += sc;
              if (win) { r.v++; r.pts += 2; } else { r.d++; r.pts++; }
            }
            if (m.slotA && m.slotA.teamId) addTeam(m.slotA.teamId, wA, effSA, effSB);
            if (m.slotB && m.slotB.teamId) addTeam(m.slotB.teamId, wB, effSB, effSA);
          });
          var gks = Object.keys(groups);
          byCat[cat.id] = {
            catName: cat.name,
            groups: gks.map(function (gk, i) {
              var rows = Object.keys(groups[gk]).map(function (tid) { return groups[gk][tid]; });
              rows.sort(function (a, b) {
                if (b.pts !== a.pts) return b.pts - a.pts;
                return (b.sp - b.sc) - (a.sp - a.sc);
              });
              return { name: gks.length > 1 ? 'Chave ' + String.fromCharCode(65 + i) : cat.name, rows: rows };
            })
          };
        });
        return byCat;
      }

      function renderStandingsTable(rows) {
        var hdr = h('div', { class: 'vst-row vst-header' }, [
          h('span', { class: 'vst-rank' }, ['#']),
          h('span', { class: 'vst-team' }, ['Equipe']),
          h('span', { class: 'vst-num' }, ['J']),
          h('span', { class: 'vst-num' }, ['V']),
          h('span', { class: 'vst-num' }, ['D']),
          h('span', { class: 'vst-num' }, ['SP']),
          h('span', { class: 'vst-num' }, ['SC']),
          h('span', { class: 'vst-num vst-pts' }, ['Pts'])
        ]);
        var dataRows = rows.map(function (r, i) {
          return h('div', { class: 'vst-row' + (i === 0 ? ' vst-first' : '') }, [
            h('span', { class: 'vst-rank' }, [String(i + 1)]),
            h('span', { class: 'vst-team' }, [teamName(teams, r.teamId)]),
            h('span', { class: 'vst-num' }, [String(r.j)]),
            h('span', { class: 'vst-num' }, [String(r.v)]),
            h('span', { class: 'vst-num' }, [String(r.d)]),
            h('span', { class: 'vst-num' }, [String(r.sp)]),
            h('span', { class: 'vst-num' }, [String(r.sc)]),
            h('span', { class: 'vst-num vst-pts' }, [String(r.pts)])
          ]);
        });
        return h('div', { class: 'vst-table' }, [hdr].concat(dataRows));
      }

      function rebuild() {
        var fm = filteredMatches();
        var live     = fm.filter(isLive);
        var sched    = fm.filter(isScheduled).sort(function (a, b) { return (a.scheduledTime || '').localeCompare(b.scheduledTime || ''); });
        var finished = fm.filter(isFinished);

        var tabBar = h('div', { class: 'view-tabs' }, [
          ['jogos', 'Jogos'], ['classificacao', 'Classificação'], ['resultados', 'Resultados']
        ].map(function (p) {
          return h('button', {
            class: 'view-tab' + (activeTab === p[0] ? ' active' : ''),
            onclick: function () { activeTab = p[0]; rebuild(); }
          }, [p[1]]);
        }));

        var catTabs = [h('button', { class: 'view-cat-tab' + (activeCat === 'all' ? ' active' : ''), onclick: function () { activeCat = 'all'; rebuild(); } }, ['Todos'])];
        cats.forEach(function (c) {
          catTabs.push(h('button', { class: 'view-cat-tab' + (activeCat === c.id ? ' active' : ''), onclick: function () { activeCat = c.id; rebuild(); } }, [c.name]));
        });

        var sections = [];

        function groupByChave(list) {
          var order = [], map = {};
          list.forEach(function (m) {
            var gk = m.groupId ? String(m.groupId) : '__none__';
            if (!map[gk]) { map[gk] = []; order.push(gk); }
            map[gk].push(m);
          });
          return { order: order, map: map };
        }
        function renderGrouped(list, showLive) {
          var g = groupByChave(list);
          var hasGroups = g.order.some(function (k) { return k !== '__none__'; });
          var letterIdx = 0;
          g.order.forEach(function (gk) {
            if (hasGroups && gk !== '__none__') {
              sections.push(h('p', { class: 'view-group-title' }, ['Chave ' + String.fromCharCode(65 + letterIdx)]));
              letterIdx++;
            }
            g.map[gk].forEach(function (m) { sections.push(renderMatchCard(m, teams, showLive)); });
          });
        }

        if (activeTab === 'jogos') {
          if (live.length) {
            sections.push(h('p', { class: 'view-section-title' }, ['Ao vivo']));
            renderGrouped(live, true);
          }
          if (sched.length) {
            sections.push(h('p', { class: 'view-section-title' }, ['Próximos jogos']));
            renderGrouped(sched, false);
          }
          if (!live.length && !sched.length) {
            if (finished.length) {
              sections.push(h('p', { class: 'view-section-title' }, ['Jogos encerrados']));
              renderGrouped(finished, false);
            } else {
              sections.push(h('div', { class: 'view-empty' }, ['Nenhum jogo disponível nesta categoria.']));
            }
          }
        } else if (activeTab === 'classificacao') {
          var standings = computeStandings();
          if (!cats.length) {
            sections.push(h('div', { class: 'view-empty' }, ['Nenhuma categoria encontrada.']));
          } else {
            cats.forEach(function (cat) {
              var catData = standings[cat.id] || { groups: [] };
              if (cats.length > 1) sections.push(h('p', { class: 'view-section-title' }, [cat.name]));
              if (catData.groups.length === 0) {
                sections.push(h('div', { class: 'view-empty' }, ['Sem dados de classificação.']));
              } else {
                catData.groups.forEach(function (g) {
                  if (catData.groups.length > 1) sections.push(h('p', { class: 'view-group-title' }, [g.name]));
                  sections.push(renderStandingsTable(g.rows));
                });
              }
            });
          }
        } else if (activeTab === 'resultados') {
          var finMs = (activeCat === 'all' ? matches : matches.filter(function (m) { return m.categoryId === activeCat; })).filter(isFinished);
          if (finMs.length) {
            finMs.forEach(function (m) { sections.push(renderMatchCard(m, teams, false)); });
          } else {
            sections.push(h('div', { class: 'view-empty' }, ['Nenhum resultado disponível ainda.']));
          }
        }

        var refreshLabel = 'Atualização automática a cada 5 min · ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        var children = [
          h('div', { class: 'view-header' }, [
            h('h1', {}, [torneio.name || 'Torneio']),
            h('p', {}, ['Acompanhe seus jogos em tempo real'])
          ]),
          tabBar
        ];
        if (activeTab !== 'classificacao') children.push(h('div', { class: 'view-cat-tabs' }, catTabs));
        children = children.concat(sections);
        children.push(h('p', { class: 'view-refresh-info' }, [refreshLabel]));

        var newTree = h('div', { class: 'view-page' }, children);
        ui.clear(container);
        container.appendChild(newTree);
      }

      rebuild();
    }

    function loadFromStore() {
      store.list('tournaments').then(function (tournaments) {
        if (!tournaments || !tournaments.length) {
          ui.clear(container);
          container.appendChild(h('div', { class: 'view-empty' }, ['Nenhum torneio encontrado.']));
          return;
        }
        var torneio = tournaments[tournaments.length - 1];
        var tid = torneio.id;
        store.list('categories', { tournamentId: tid }).then(function (cats) {
          var catIds = cats.map(function (c) { return c.id; });
          return Promise.all([
            Promise.all(catIds.map(function (cid) { return store.list('matches', { categoryId: cid }); }))
              .then(function (arrays) { return [].concat.apply([], arrays); }),
            Promise.all(catIds.map(function (cid) { return store.list('teams', { categoryId: cid }); }))
              .then(function (arrays) { return [].concat.apply([], arrays); }),
            cats
          ]);
        }).then(function (results) {
          renderData(torneio, results[0], results[1], results[2]);
        });
      }).catch(function (err) {
        ui.clear(container);
        container.appendChild(h('div', { class: 'view-empty' }, ['Erro ao carregar dados: ' + (err && err.message ? err.message : err)]));
      });
    }

    function load() {
      // Tenta buscar view-data.json publicado (GitHub Pages)
      fetch('./view-data.json?_=' + Date.now()).then(function (r) {
        if (!r.ok) throw new Error('not found');
        return r.json();
      }).then(function (data) {
        if (!data || !data.tournament) throw new Error('invalid');
        renderData(data.tournament, data.matches || [], data.teams || [], data.categories || []);
      }).catch(function () {
        // fallback: IndexedDB (uso local)
        loadFromStore();
      });
    }

    load();
    scheduleRefresh();
    return { title: 'Visão do Atleta', section: 'view', content: container };
  });
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>
