  class Repository {
    async init() { throw nyi('init'); }
    async get() { throw nyi('get'); }
    async getAll() { throw nyi('getAll'); }
    async findBy() { throw nyi('findBy'); }
    async batch() { throw nyi('batch'); }
    async getMeta() { throw nyi('getMeta'); }
    async setMeta() { throw nyi('setMeta'); }
    async exportAll() { throw nyi('exportAll'); }
    async replaceAll() { throw nyi('replaceAll'); }
    async clear() { throw nyi('clear'); }
    async close() { /* opcional */ }

    put(collection, entity) { return this.batch([{ op: 'put', collection: collection, entity: entity }]); }
    putMany(collection, entities) { return this.batch(entities.map(function (e) { return { op: 'put', collection: collection, entity: e }; })); }
    delete(collection, id) { return this.batch([{ op: 'delete', collection: collection, id: id }]); }

    _assertCollection(c) {
      if (typeof c !== 'string' || !S.COLLECTIONS[c]) throw new E.VTError('UNKNOWN_COLLECTION', 'Coleção desconhecida: ' + String(c));
    }

    // Valida o lote inteiro ANTES de tocar em qualquer dado.
    static validateOps(ops) {
      if (!Array.isArray(ops)) throw new E.VTError('INVALID_BATCH', 'batch espera uma lista de operações.');
      ops.forEach(function (o, i) {
        var where = 'Operação ' + i + ': ';
        if (!o || (o.op !== 'put' && o.op !== 'delete')) throw new E.VTError('INVALID_BATCH', where + 'op deve ser "put" ou "delete".');
        if (typeof o.collection !== 'string' || !S.COLLECTIONS[o.collection]) throw new E.VTError('UNKNOWN_COLLECTION', where + 'coleção desconhecida: ' + String(o.collection));

<script>/* src/persistence/indexeddb-repository.js */
/* VT.IndexedDBRepository — persistência local no navegador (offline-first).
 * Uma object store por coleção (keyPath "id") + índices "by_<campo>" para findBy,
 * e uma store "meta" (chave/valor) para schemaVersion e afins.
 * O objeto IndexedDB é injetável (`opts.indexedDB`) para testes. */

  'use strict';
  var VT = root.VT, S = VT.schema, E = VT.errors;

  function req(r) {
    return new Promise(function (resolve, reject) {
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  // Resolve no "complete"; rejeita em "error"/"abort" (transação desfeita).
  function txDone(tx) {
    return new Promise(function (resolve, reject) {
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error || new Error('Falha na transação')); };
      tx.onabort = function () { reject(tx.error || new Error('Transação abortada')); };
    });
  }

  class IndexedDBRepository extends VT.Repository {
    constructor(opts) {

      });

        ops.forEach(function (o) {

        });

        await done.catch(function () { /* esperado: abort */ });
        throw err;

      await done;

      var row = await req(this._db().transaction('meta', 'readonly').objectStore('meta').get(k));
      return row === undefined ? null : row.value;

      var tx = this._db().transaction(names, 'readwrite'), done = txDone(tx);

      }
      await done;

<script>/* src/persistence/exchange.js */
/* VT.exchange — exportação/importação em JSON.
 * Envelope: { format, schemaVersion, scope, tournamentId, exportedAt, data, derived, checksum }
 *  - data: entidades de cada coleção (jogos/resultados = fonte da verdade)
 *  - derived: reservado para snapshot de classificação (etapa do motor); IGNORADO na importação
 *
 * LICENÇA (regra de transporte):
 *  - License (token, ativação, validade, recursos, vínculo ao torneio) é do DISPOSITIVO: nunca exportada
 *    e nunca importada (uma licença dentro do arquivo é ignorada).
 *  - Viaja apenas a identidade portátil Tournament.licenseOrigin {licenseId, customerId}: proveniência,
 *    sem segredo e sem efeito de autorização.
 *  - Ao importar, licenseCheck vira 'pending' (se há origem): o provedor de licença revalida depois.
 *    Isso NUNCA impede a importação nem a operação do torneio.
 *
 * SEGURANÇA DA IMPORTAÇÃO: o documento passa pelas MESMAS regras do Store (estrutura, referências,
 * consistência entre categorias/fases/grupos, vagas e ciclos). A importação é tudo-ou-nada. */
(function (root) {
  'use strict';
  var VT = root.VT, S = VT.schema, U = VT.util, E = VT.errors, I = VT.integrity;
  var FORMAT = 'vt-erp-export';
  var CONFLICT_MODES = ['abort', 'replace', 'copy'];

  function byCreated(a, b) { return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }

  function checksumOf(doc) {
    return U.hash(U.stableStringify({ format: doc.format, schemaVersion: doc.schemaVersion, scope: doc.scope, tournamentId: doc.tournamentId, data: doc.data }));
  }

  async function buildExport(repo, opts) {
    opts = opts || {};
    var all = await repo.exportAll(), data = {};
    if (opts.tournamentId) {
      var t = (all.tournaments || []).filter(function (x) { return x.id === opts.tournamentId; })[0];
      if (!t) throw new E.NotFoundError('Torneio', opts.tournamentId);
      var owned = I.collectOwned(all, 'tournaments', t.id);
      S.EXPORTABLE.forEach(function (c) { data[c] = (all[c] || []).filter(function (e) { return owned.has(I.key(c, e.id)); }); });
    } else {
      S.EXPORTABLE.forEach(function (c) { data[c] = (all[c] || []).slice(); });
    }
    S.EXPORTABLE.forEach(function (c) { data[c].sort(byCreated); });
    // identidade portátil: copia SÓ {licenseId, customerId} da licença local vinculada ao torneio
    data.tournaments = data.tournaments.map(function (t) {
      if (t.licenseOrigin) return t;
      var local = (all.licenses || []).filter(function (l) { return l.tournamentId === t.id && l.licenseId; })
        .sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; })[0];
      return Object.assign({}, t, { licenseOrigin: local ? { licenseId: local.licenseId, customerId: local.customerId } : null });
    });
    var doc = {
      format: FORMAT, schemaVersion: S.SCHEMA_VERSION,
      scope: opts.tournamentId ? 'tournament' : 'all', tournamentId: opts.tournamentId || null,
      exportedAt: VT.clock.now(), data: data, derived: {}
    };
    doc.checksum = checksumOf(doc);
    return doc;
  }

  function serialize(doc) { return JSON.stringify(doc, null, 2); }

  // Estrutura + duplicidade + referências + CONSISTÊNCIA (as mesmas regras do Store) dentro do documento.
  async function validateDocument(data) {
    var issues = [], ids = S.dict();
    S.EXPORTABLE.forEach(function (c) {
      var list = data[c];
      if (list === undefined) return;
      if (!Array.isArray(list)) { issues.push({ severity: 'error', path: c, code: 'NOT_ARRAY', message: 'A coleção "' + c + '" deve ser uma lista.' }); return; }
      list.forEach(function (e, i) {
        var res = VT.validation.validate(c, e);
        res.errors.forEach(function (er) { issues.push(Object.assign({}, er, { path: c + '[' + i + ']' + (er.path ? '.' + er.path : '') })); });
        if (e && typeof e.id === 'string') {
          var k = I.key(c, e.id);
          if (ids[k]) issues.push({ severity: 'error', path: c + '[' + i + '].id', code: 'DUPLICATE', message: 'ID repetido no arquivo: ' + e.id });
          ids[k] = true;
        }
      });
    });
    if (issues.length) return issues;   // referências só fazem sentido com entidades válidas
    S.EXPORTABLE.forEach(function (c) {
      (data[c] || []).forEach(function (e, i) {
        I.refsOf(c, e).forEach(function (r) {
          if (!ids[I.key(r.to, r.id)]) issues.push({ severity: 'error', path: c + '[' + i + ']', code: 'MISSING_REFERENCE', message: 'Referência para ' + r.to + ' inexistente no arquivo: ' + r.id });
        });
      });
    });
    if (issues.length) return issues;
    // consistência: o "banco" consultado é o próprio arquivo
    var index = S.dict();
    S.EXPORTABLE.forEach(function (c) { index[c] = new Map((data[c] || []).map(function (e) { return [e.id, e]; })); });
    var ctx = {
      get: async function (c, id) { return (index[c] && index[c].get(id)) || null; },
      findBy: async function (c, f, v) { return (data[c] || []).filter(function (e) { return e[f] === v; }); }
    };
    for (var c of S.EXPORTABLE) {
      var list = data[c] || [];
      for (var i = 0; i < list.length; i++) {
        (await I.consistencyIssues(c, list[i], ctx)).forEach(function (it) {
          issues.push(Object.assign({}, it, { path: c + '[' + i + ']' + (it.path ? '.' + it.path : '') }));
        });
      }
    }
    return issues;
  }

  // Troca todo ID conhecido por um novo (ids são tokens únicos, então a troca textual é segura).
  function remapIds(data) {
    var map = new Map();
    S.EXPORTABLE.forEach(function (c) { (data[c] || []).forEach(function (e) { map.set(e.id, VT.ids.newIdFor(c)); }); });
    function walk(v) {
      if (typeof v === 'string') return map.has(v) ? map.get(v) : v;
      if (Array.isArray(v)) return v.map(walk);
      if (U.isObject(v)) { var o = {}; Object.keys(v).forEach(function (k) { o[k] = walk(v[k]); }); return o; }
      return v;
    }
    var out = {};
    S.EXPORTABLE.forEach(function (c) { out[c] = (data[c] || []).map(walk); });
    return { data: out, map: map };
  }

  async function importDocument(repo, input, opts) {
    opts = opts || {};
    var mode = opts.onConflict || 'abort';
    var migrator = opts.migrator || VT.migrations.defaultMigrator;
    if (CONFLICT_MODES.indexOf(mode) < 0) throw new E.VTError('INVALID_OPTION', 'onConflict deve ser: ' + CONFLICT_MODES.join(', ') + '.');

    var doc = input;
    if (typeof input === 'string') {
      try { doc = JSON.parse(input); } catch (e) { throw new E.SchemaError('INVALID_JSON', 'O arquivo não é um JSON válido.'); }
    }
    if (!U.isObject(doc) || doc.format !== FORMAT || !U.isObject(doc.data))
      throw new E.SchemaError('INVALID_FORMAT', 'O arquivo não é uma exportação deste sistema.');
    if (doc.checksum !== undefined && doc.checksum !== checksumOf(doc))
      throw new E.IntegrityError('CHECKSUM_MISMATCH', 'O arquivo foi alterado ou está corrompido (checksum não confere).');

    doc = migrator.migrateDocument(doc);
    var issues = await validateDocument(doc.data);
    if (issues.length) throw new E.ValidationError(issues);

    var data = {};
    S.EXPORTABLE.forEach(function (c) { data[c] = U.clone(doc.data[c] || []); });   // ignora licenses/derived/desconhecidos
    // regra de licença: nada de autorização vem do arquivo; só sinaliza revalidação futura
    data.tournaments.forEach(function (t) { t.licenseCheck = t.licenseOrigin ? 'pending' : 'none'; });

    var existing = await repo.exportAll();
    function existsInRepo(c, id) { return (existing[c] || []).some(function (e) { return e.id === id; }); }
    var collisions = [];
    S.EXPORTABLE.forEach(function (c) { data[c].forEach(function (e) { if (existsInRepo(c, e.id)) collisions.push(I.key(c, e.id)); }); });
    var conflictingTournaments = data.tournaments.filter(function (t) { return existsInRepo('tournaments', t.id); }).map(function (t) { return t.id; });

    var ops = [], removed = new Set();
    if (collisions.length) {
      if (mode === 'abort') throw new E.ConflictError('ALREADY_EXISTS', 'Já existe torneio com estes dados neste aparelho. Escolha substituir ou importar como cópia.', { tournamentIds: conflictingTournaments, collisions: collisions.length });
      if (mode === 'copy') {
        var rem = remapIds(data);
        data = rem.data;
        data.tournaments.forEach(function (t) { if (conflictingTournaments.some(function (old) { return rem.map.get(old) === t.id; })) t.name = t.name + ' (cópia)'; });
      } else { // replace: remove a árvore inteira dos torneios conflitantes
        conflictingTournaments.forEach(function (tid) {
          I.collectOwned(existing, 'tournaments', tid).forEach(function (v, k) { removed.add(k); ops.push({ op: 'delete', collection: v.collection, id: v.id }); });
        });
        var stillColliding = collisions.filter(function (k) { return !removed.has(k); });
        if (stillColliding.length) throw new E.ConflictError('ID_COLLISION', 'Há IDs do arquivo em uso por outros dados deste aparelho.', { collisions: stillColliding.length });
      }
    }
    S.EXPORTABLE.forEach(function (c) { data[c].forEach(function (e) { ops.push({ op: 'put', collection: c, entity: e }); }); });
    await repo.batch(ops);

    var counts = {};
    S.EXPORTABLE.forEach(function (c) { counts[c] = data[c].length; });
    return { mode: collisions.length ? mode : 'new', tournamentIds: data.tournaments.map(function (t) { return t.id; }), counts: counts };
  }

  VT.exchange = { FORMAT: FORMAT, checksumOf: checksumOf, buildExport: buildExport, serialize: serialize, importDocument: importDocument };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/store/store.js */
/* VT.Store — orquestra criação/edição/exclusão com validação, integridade e eventos.
 * Conhece apenas o contrato VT.Repository (nunca IndexedDB diretamente).
 * Etapa 1: camada fina sobre o repository (sem cache em memória e sem histórico de alterações). */
(function (root) {
  'use strict';
  var VT = root.VT, S = VT.schema, U = VT.util, E = VT.errors, I = VT.integrity;

  function sortStable(list) {
    return list.sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : a.id < b.id ? -1 : 1; });
  }

  class Store {
    constructor(opts) {
      opts = opts || {};
      if (!opts.repository) throw new E.VTError('NO_REPOSITORY', 'O Store precisa de um repository.');
      this.repo = opts.repository;
      this.migrator = opts.migrator || VT.migrations.defaultMigrator;
      this.migration = null;
      this._subs = [];
    }

    async init() {
      await this.repo.init();
      this.migration = await this.migrator.migrateRepository(this.repo);
      return this;
    }

    // ---- eventos ----
    subscribe(fn) {
      this._subs.push(fn);
      var self = this;
      return function () { self._subs = self._subs.filter(function (f) { return f !== fn; }); };
    }
    _emit(events) {
      events.forEach(function (ev) {
        this._subs.slice().forEach(function (fn) { try { fn(ev); } catch (e) { /* um ouvinte com erro não pode quebrar o Store */ } });
      }, this);
    }

    _col(c) { if (typeof c !== 'string' || !S.COLLECTIONS[c]) throw new E.VTError('UNKNOWN_COLLECTION', 'Coleção desconhecida: ' + String(c)); }

    // ---- leitura ----
    async get(c, id) { this._col(c); return this.repo.get(c, id); }
    async getOrThrow(c, id) { var e = await this.get(c, id); if (!e) throw new E.NotFoundError(c, id); return e; }
    // where: objeto de igualdades. O primeiro campo usa índice quando existir.
    // Ordem: createdAt e depois id. Entidades criadas no mesmo milissegundo empatam em createdAt,
    // então NÃO use esta ordem como ordem de negócio: use campos de domínio (phase.order, match.round/order).
    async list(c, where) {
      this._col(c);
      var keys = where ? Object.keys(where) : [], items;
      items = keys.length ? await this.repo.findBy(c, keys[0], where[keys[0]]) : await this.repo.getAll(c);
      keys.slice(1).forEach(function (k) { items = items.filter(function (e) { return e[k] === where[k]; }); });
      return sortStable(items);
    }

    // ---- regras de integridade (dependem de outras entidades) ----
    _assertValid(c, e) {
      var res = VT.validation.validate(c, e);
      if (!res.ok) throw new E.ValidationError(res.errors);
      return res;
    }
    async _checkReferences(c, e, pending) {
      var missing = [];
      for (var r of I.refsOf(c, e)) {
        if (pending && pending.has(I.key(r.to, r.id))) continue;
        if (!(await this._reader().get(r.to, r.id))) missing.push(r);
      }
      if (missing.length) throw new E.IntegrityError('MISSING_REFERENCE', 'Referência inexistente: ' + missing.map(function (m) { return m.to + '/' + m.id; }).join(', '), { missing: missing });
    }
    // Mesmas regras usadas pelo importador (VT.integrity): um só lugar para consistência, slots e ciclos.
    async _checkConsistency(c, e) {
      var issues = await I.consistencyIssues(c, e, this._reader());
      if (issues.length) throw new E.ValidationError(issues);
    }

    // ---- escrita ----
    // _prepare* validam TUDO (estrutura, referências, consistência) e não gravam; _commit grava em lote
    // (atômico) e emite os eventos. Isso permite operações de várias entidades numa única transação.
    async _prepareCreate(c, input) {
      this._col(c);
      var extra = VT.validation.inputFieldIssues(c, input);   // a fábrica só copia campos do modelo: sem isto, sobras sumiriam em silêncio
      if (extra.length) throw new E.ValidationError(extra);
      var e = VT.models.factories[c](input || {});
      this._assertValid(c, e);
      await this._checkReferences(c, e);
      await this._checkConsistency(c, e);
      return e;
    }

    // patch: objeto (mescla superficialmente) ou função (cópia) => nova entidade.
    async _prepareUpdate(c, id, patch, opts) {
      this._col(c);
      opts = opts || {};
      var cur = await this._reader().get(c, id);
      if (!cur) throw new E.NotFoundError(c, id);
      if (opts.expectedRevision !== undefined && opts.expectedRevision !== cur.revision)
        throw new E.ConflictError('REVISION_CONFLICT', 'Este registro foi alterado por outra operação (revisão ' + cur.revision + ').', { current: cur.revision, expected: opts.expectedRevision });
      var next = typeof patch === 'function' ? patch(U.clone(cur)) : Object.assign({}, cur, patch);
      if (!U.isObject(next)) throw new E.VTError('INVALID_PATCH', 'A alteração deve resultar em um objeto.');
      if (next.id !== cur.id || next.createdAt !== cur.createdAt || I.ownerKeys(c, next) !== I.ownerKeys(c, cur))
        throw new E.IntegrityError('IMMUTABLE_FIELD', 'Não é permitido alterar id, createdAt nem o vínculo com o pai (torneio/categoria/fase).');
      next.updatedAt = VT.clock.now();
      next.revision = cur.revision + 1;
      this._assertValid(c, next);
      await this._checkReferences(c, next);
      await this._checkConsistency(c, next);
      return { cur: cur, next: next };
    }

    async _commit(items) {
      await this.repo.batch(items.map(function (x) {
        return x.type === 'removed' ? { op: 'delete', collection: x.collection, id: x.entity.id } : { op: 'put', collection: x.collection, entity: x.entity };
      }));
      this._emit(items.map(function (x) { return { type: x.type, collection: x.collection, id: x.entity.id, entity: x.type === 'removed' ? null : x.entity, previous: x.previous || (x.type === 'removed' ? x.entity : undefined) }; }));
    }

    // Leitor que enxerga as alterações PENDENTES de uma unidade de trabalho (this._overlay) por cima do repository.
    _reader() {
      var self = this, repo = this.repo;
      return {
        get: async function (c, id) {
          var k = I.key(c, id);
          if (self._overlay && self._overlay.has(k)) return self._overlay.get(k) || null;
          return repo.get(c, id);
        },
        findBy: async function (c, f, v) {
          var base = await repo.findBy(c, f, v);
          if (!self._overlay) return base;
          var out = base.filter(function (e) { return !self._overlay.has(I.key(c, e.id)); });
          self._overlay.forEach(function (e, k) { if (e && k.indexOf(c + ':') === 0 && e[f] === v) out.push(e); });
          return out;
        }
      };
    }

    // UNIDADE DE TRABALHO: várias criações/alterações/remoções, cada uma validada contra o estado resultante das
    // anteriores (mesmas regras do create/update), gravadas JUNTAS e de forma atômica em commit().
    _unit() {
      var self = this, items = [], overlay = new Map();
      async function prep(fn) { self._overlay = overlay; try { return await fn(); } finally { self._overlay = null; } }
      return {
        create: async function (c, input) { var e = await prep(function () { return self._prepareCreate(c, input); }); overlay.set(I.key(c, e.id), e); items.push({ type: 'created', collection: c, entity: e }); return e; },
        update: async function (c, id, patch) { var p = await prep(function () { return self._prepareUpdate(c, id, patch); }); overlay.set(I.key(c, id), p.next); items.push({ type: 'updated', collection: c, entity: p.next, previous: p.cur }); return p.next; },
        remove: async function (c, id) {
          var cur = await prep(function () { return self._reader().get(c, id); });
          if (!cur) throw new E.NotFoundError(c, id);
          overlay.set(I.key(c, id), null); items.push({ type: 'removed', collection: c, entity: cur });
        },
        commit: function () { return self._commit(items); }
      };
    }

    async create(c, input) {
      var e = await this._prepareCreate(c, input);
      await this._commit([{ type: 'created', collection: c, entity: e }]);
      return e;
    }

    async update(c, id, patch, opts) {
      var p = await this._prepareUpdate(c, id, patch, opts);
      await this._commit([{ type: 'updated', collection: c, entity: p.next, previous: p.cur }]);
      return p.next;
    }

    // Várias alterações em UMA transação: se qualquer uma for inválida, nenhuma é gravada.
    // items: [{ collection, id, patch }]
    async updateMany(items) {
      var prepared = [];
      for (var it of items) {
        var p = await this._prepareUpdate(it.collection, it.id, it.patch, it.opts);
        prepared.push({ type: 'updated', collection: it.collection, entity: p.next, previous: p.cur });
      }
      await this._commit(prepared);
      return prepared.map(function (x) { return x.entity; });
    }

    // cascade=false: recusa se houver dependentes. Sempre recusa se algo de FORA ainda referenciar o alvo.
    async remove(c, id, opts) {
      this._col(c);
      var cascade = !!(opts && opts.cascade);
      var root0 = await this.getOrThrow(c, id);
      var all = await this.repo.exportAll();
      var set = I.collectOwned(all, c, id);
      if (set.size > 1 && !cascade)
        throw new E.IntegrityError('HAS_DEPENDENTS', 'Existem ' + (set.size - 1) + ' registro(s) dependentes. Use cascade para excluí-los junto.', { count: set.size - 1 });
      var blockers = I.findBlockers(all, set);
      if (blockers.length) throw new E.IntegrityError('IN_USE', 'O registro está em uso por ' + blockers.length + ' outro(s) e não pode ser excluído.', { blockers: blockers });
      var items = Array.from(set.values());
      // vínculos FRACOS (ex.: licença -> torneio) não impedem a exclusão: são desfeitos na mesma transação
      var now = VT.clock.now(), unbound = I.findWeakReferrers(all, set).map(function (w) {
        var cur = all[w.collection].filter(function (x) { return x.id === w.id; })[0], next = Object.assign({}, cur);
        next[w.field] = null; next.updatedAt = now; next.revision = cur.revision + 1;
        return { collection: w.collection, entity: next, previous: cur };
      });
      var ops = items.map(function (v) { return { op: 'delete', collection: v.collection, id: v.id }; })
        .concat(unbound.map(function (u) { return { op: 'put', collection: u.collection, entity: u.entity }; }));
      await this.repo.batch(ops);
      this._emit(items.map(function (v) { return { type: 'removed', collection: v.collection, id: v.id, entity: v.id === id && v.collection === c ? root0 : null }; })
        .concat(unbound.map(function (u) { return { type: 'updated', collection: u.collection, id: u.entity.id, entity: u.entity, previous: u.previous }; })));
      return { removed: items.length, unbound: unbound.length };
    }

    // Cria o torneio junto com as regras iniciais (dados editáveis), em uma única transação.
    async createTournament(input, opts) {
      var withPresets = !(opts && opts.withPresets === false);
      var t = VT.models.createTournament(input || {});
      this._assertValid('tournaments', t);
      var ops = [{ op: 'put', collection: 'tournaments', entity: t }], scoring = [], tiebreak = [];
      if (withPresets) {
        VT.presets.scoringRules().forEach(function (p) {
          var e = VT.models.createScoringRule(Object.assign({}, p, { tournamentId: t.id }));
          this._assertValid('scoringRules', e); scoring.push(e); ops.push({ op: 'put', collection: 'scoringRules', entity: e });
        }, this);
        VT.presets.tiebreakRules().forEach(function (p) {

<script>/* src/store/domain.js */
/* Operações de DOMÍNIO do Store usadas pela interface (Etapa 2). Toda regra mora aqui ou em Core;
 * a UI só chama estes métodos e exibe `issues`. Tudo passa pelas mesmas validações do Store
 * e as operações de várias entidades são atômicas (uma transação). */
(function (root) {
  'use strict';
  var VT = root.VT, E = VT.errors, U = VT.util, C = VT.catalogs, P = VT.Store.prototype;

  // Contagens para a visão do torneio. (Jogos/realizados/pendentes ficam 0 até o motor de jogos existir.)
  P.tournamentSummary = async function (tournamentId) {
    await this.getOrThrow('tournaments', tournamentId);
    var cats = await this.list('categories', { tournamentId: tournamentId });
    var sum = { categories: cats.length, activeCategories: 0, teams: 0, matches: 0, played: 0, pending: 0, perCategory: {} };
    for (var c of cats) {
      var teams = await this.repo.findBy('teams', 'categoryId', c.id), ms = await this.repo.findBy('matches', 'categoryId', c.id);
      var played = ms.filter(function (m) { return m.status === 'finalizado'; }).length;
      if (c.active) sum.activeCategories++;
      sum.teams += teams.length; sum.matches += ms.length; sum.played += played;
      sum.perCategory[c.id] = { teams: teams.length, matches: ms.length, played: played };
    }
    sum.pending = sum.matches - sum.played;
    return sum;
  };

  // Cria (sem input.id) ou edita (com input.id) uma categoria. Valores de gênero/nível/tipo de equipe
  // chegam como { key } ou { custom }; valores personalizados entram no catálogo na MESMA transação.
  P.saveCategory = async function (input) {
    var t = await this.getOrThrow('tournaments', input.tournamentId);
    var existing = input.id ? await this.getOrThrow('categories', input.id) : null;
    if (existing && existing.tournamentId !== t.id) throw new E.IntegrityError('IMMUTABLE_FIELD', 'A categoria pertence a outro torneio.');

    C.KIND_ORDER.forEach(function (kind) {
      var def = C.KINDS[kind];
      try { var r = C.resolve(catalogs, kind, input[def.field], existing && existing[def.field]); catalogs = r.catalogs; changed = changed || r.changed; resolved[def.field] = C.snapshot(kind, r.item); }
      catch (e) { if (e instanceof E.ValidationError) issues = issues.concat(e.issues); else throw e; resolved[def.field] = { key: '_', label: '_', size: 1 }; }
    });
    var fields = {
      name: typeof input.name === 'string' ? input.name.trim() : input.name,
      gender: resolved.gender, level: resolved.level, teamType: resolved.teamType, modality: input.modality,
      teamsCount: input.teamsCount === undefined ? null : input.teamsCount,
      useAthletes: !!input.useAthletes, active: input.active === undefined ? true : !!input.active
    };
    if (input.defaultMatchFormat !== undefined) fields.defaultMatchFormat = input.defaultMatchFormat;
    if (input.bracketConfig !== undefined) fields.bracketConfig = input.bracketConfig || null;
    if (input.scoringRuleId !== undefined) fields.scoringRuleId = input.scoringRuleId || null;
    if (input.tiebreakRuleId !== undefined) fields.tiebreakRuleId = input.tiebreakRuleId || null;
    if (issues.length) {   // mostra TUDO de uma vez: junta os problemas dos demais campos
      var probe = VT.validation.validate('categories', Object.assign(existing ? U.clone(existing) : VT.models.createCategory({ tournamentId: t.id }), fields));
      probe.errors.forEach(function (i) { if (!/^(gender|level|teamType)(\.|$)/.test(i.path) && !/^(id|createdAt|updatedAt|revision)$/.test(i.path)) issues.push(i); });
      throw new E.ValidationError(issues);
    }
    var items = [], category;
    if (existing) {
      var p = await this._prepareUpdate('categories', existing.id, fields);
      items.push({ type: 'updated', collection: 'categories', entity: p.next, previous: p.cur }); category = p.next;
    } else {
      category = await this._prepareCreate('categories', Object.assign({ tournamentId: t.id }, fields));
      items.push({ type: 'created', collection: 'categories', entity: category });
    }
    if (changed) {
      var tp = await this._prepareUpdate('tournaments', t.id, { catalogs: catalogs });
      items.push({ type: 'updated', collection: 'tournaments', entity: tp.next, previous: tp.cur });
    }
    await this._commit(items);
    return category;
  };

  // Copia SÓ a configuração. Não copia equipes, fases, jogos, resultados nem sorteios.
  P.duplicateCategory = async function (id, opts) {
    var src = await this.getOrThrow('categories', id);
    var name = opts && typeof opts.name === 'string' ? opts.name.trim() : src.name + ' (cópia)';
    return this.create('categories', {
      tournamentId: src.tournamentId, name: name, gender: U.clone(src.gender), level: U.clone(src.level),
      teamType: U.clone(src.teamType), modality: src.modality, useAthletes: src.useAthletes, teamsCount: src.teamsCount,
      scoringRuleId: src.scoringRuleId, tiebreakRuleId: src.tiebreakRuleId, structureMode: src.structureMode,

  P.setCategoryActive = function (id, active) { return this.update('categories', id, { active: !!active }); };

  // ---- catálogos (por torneio) ----
  P.addCatalogItem = async function (tournamentId, kind, input) {
    var t = await this.getOrThrow('tournaments', tournamentId), r = C.add(t.catalogs, kind, input);
    await this.update('tournaments', t.id, { catalogs: r.catalogs });
    return r.item;
  };

  // Renomear propaga o novo nome às categorias que usam o valor. Mudar a quantidade de atletas de um
  // tipo de equipe em uso é recusado (as categorias e equipes existentes ficariam inconsistentes).
  P.updateCatalogItem = async function (tournamentId, kind, key, patch) {
    var t = await this.getOrThrow('tournaments', tournamentId), d = C.KINDS[kind], r = C.update(t.catalogs, kind, key, patch);
    var users = (await this.list('categories', { tournamentId: t.id })).filter(function (c) { return c[d.field] && c[d.field].key === key; });
    if (d.hasSize && r.item.size !== r.previous.size && users.length)
      throw new E.ValidationError([{ severity: 'error', path: 'size', code: 'IN_USE', message: users.length + ' categoria(s) usam este tipo de equipe. Altere-as antes de mudar a quantidade de atletas.' }]);
    var items = [{ collection: 'tournaments', id: t.id, patch: { catalogs: r.catalogs } }];
    users.forEach(function (c) {
      if (c[d.field].label !== r.item.label) { var p = {}; p[d.field] = Object.assign({}, c[d.field], { label: r.item.label }); items.push({ collection: 'categories', id: c.id, patch: p }); }
    });
    await this.updateMany(items);
    return r.item;
  };

  // Excluir só é permitido SEM dependência: se alguma categoria usa o valor, a saída é desativá-lo
  // (updateCatalogItem com { active: false }), que o esconde das listas sem mexer nas categorias.
  P.removeCatalogItem = async function (tournamentId, kind, key) {
    var t = await this.getOrThrow('tournaments', tournamentId), d = C.KINDS[kind], r = C.remove(t.catalogs, kind, key);
    var usedBy = (await this.list('categories', { tournamentId: t.id })).filter(function (c) { return c[d.field] && c[d.field].key === key; }).length;
    if (usedBy) throw new E.ValidationError([{ severity: 'error', path: 'label', code: 'IN_USE', message: ui_plural(usedBy) + ' usa(m) "' + r.removed.label + '". Desative o valor em vez de excluí-lo.' }]);
    await this.update('tournaments', t.id, { catalogs: r.catalogs });

  };

// ---- equipes (Etapa 2: cadastro simples) ----
(function (root) {
  'use strict';
  var VT = root.VT, P = VT.Store.prototype;
  // input: { id?, categoryId, name, athletes: ['Nome', ...] }  — nomes em branco são ignorados.
  // Ao editar, os atletas que permanecem na mesma posição mantêm o id.
  P.saveTeam = async function (input) {
    var names = (Array.isArray(input.athletes) ? input.athletes : []).map(function (s) { return String(typeof s === 'object' ? (s.name || '') : s).trim(); }).filter(Boolean);
    var name = typeof input.name === 'string' ? input.name.trim() : input.name;
    if (!input.id) return this.create('teams', { categoryId: input.categoryId, name: name, athletes: names });
    var cur = await this.getOrThrow('teams', input.id);
    var athletes = names.map(function (n, i) { return { id: (cur.athletes[i] && cur.athletes[i].id) || VT.ids.newId('ath'), name: n }; });
    return this.update('teams', cur.id, { name: name, athletes: athletes });
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/store/distribution.js */
/* Distribuição de equipes em grupos — operações de DOMÍNIO do Store (Etapa 3).
 *
 *   UI → Store (aqui) → engines puras (VT.engines.*) + integridade (VT.integrity) → Repository
 *
 * UM só estado: as posições vivem em Group.teamIds (índice 0 = posição 1; null = vazia). Sorteio automático e
 * distribuição manual escrevem exatamente o mesmo dado, validado pelas MESMAS regras de integridade
 * (equipe da categoria, sem duplicidade na fase, tamanho do grupo...). Toda operação é atômica.
 * Qualquer alteração antes do início da fase cancela a confirmação; depois do início, é recusada. */
(function (root) {
  'use strict';
  var VT = root.VT, E = VT.errors, U = VT.util, D = VT.engines.distribution, R = VT.engines.draw, P = VT.Store.prototype;

  function fail(code, message, path) { return new E.ValidationError([{ severity: 'error', path: path || '', code: code, message: message }]); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  async function groupsPhaseOf(store, categoryId) {
    var phases = (await store.list('phases', { categoryId: categoryId })).filter(function (p) { return p.type === 'groups'; });
    phases.sort(function (a, b) { return a.order - b.order; });
    return phases[0] || null;
  }
  async function load(store, phaseId) {
    var phase = await store.getOrThrow('phases', phaseId);
    if (phase.type !== 'groups') throw fail('NOT_GROUPS_PHASE', 'A distribuição só se aplica a fases de grupos.');
    var groups = D.sortGroups(await store.list('groups', { phaseId: phase.id }));
    var teams = await store.list('teams', { categoryId: phase.categoryId });
    var category = await store.getOrThrow('categories', phase.categoryId);
    return { phase: phase, groups: groups, teams: teams,
      analysis: D.analyze({ config: phase.groupsConfig, groups: groups, teams: teams, confirmedAt: phase.confirmedAt, startedAt: phase.startedAt, noun: D.nounFor(category.teamType.size) }) };
  }
  function assertEditable(phase) {
    if (phase.startedAt) throw fail('PHASE_STARTED', 'A fase já foi iniciada: a distribuição não pode mais ser alterada.');
  }
  function groupOf(s, groupId) {
    var g = s.groups.filter(function (x) { return x.id === groupId; })[0];
    if (!g) throw fail('GROUP_NOT_FOUND', 'Este grupo não pertence à fase.', 'groupId');
    return g;
  }
  function checkPosition(g, position) {
    var n = g.teamIds.length;
    if (!Number.isInteger(position) || position < 1 || position > n) throw fail('INVALID_POSITION', 'Posição inválida: use de 1 a ' + n + '.', 'position');
  }

  // Aplica novas posições a vários grupos de uma vez, em DUAS passagens: primeiro esvazia o que muda, depois
  // preenche. Assim nenhum estado intermediário tem a mesma equipe em dois lugares (trocas e movimentos entre
  // grupos passam pelas mesmas regras de integridade). Cancela a confirmação. `extra(unit)` adiciona gravações.
  async function applyLayout(store, s, finals, extra) {
    var u = store._unit(), current = new Map(s.groups.map(function (g) { return [g.id, g]; }));
    var steps = [];

      var cur = current.get(gid);
      if (same(fin, cur.teamIds)) return;
      steps.push({ gid: gid, fin: fin, inter: cur.teamIds.map(function (t, i) { return t === fin[i] ? t : null; }), cur: cur });
    });
    for (var a of steps) if (!same(a.inter, a.cur.teamIds)) await u.update('groups', a.gid, { teamIds: a.inter });
    for (var b of steps) await u.update('groups', b.gid, { teamIds: b.fin });
    if (s.phase.confirmedAt) await u.update('phases', s.phase.id, { confirmedAt: null });
    if (extra) await extra(u, s.groups.map(function (g) { return { groupName: g.name, teamIds: (finals.get(g.id) || g.teamIds).slice() }; }));
    await u.commit();
  }

  // createdAt estritamente crescente por fase (o histórico mantém a ordem mesmo em operações dentro do mesmo milissegundo)
  async function stamp(store, phaseId) {
    var last = (await store.list('draws', { phaseId: phaseId })).reduce(function (m, d) { return d.createdAt > m ? d.createdAt : m; }, '');
    var now = VT.clock.now();
    return last && now <= last ? new Date(Date.parse(last) + 1).toISOString() : now;
  }
  function where(pl) { return 'Grupo ' + pl.groupName + ' — Posição ' + pl.position; }

  // ---- leitura para a tela ----
  P.distributionState = async function (categoryId) {
    var category = await this.getOrThrow('categories', categoryId), phase = await groupsPhaseOf(this, categoryId);
    var teams = await this.list('teams', { categoryId: categoryId });
    if (!phase) return { category: category, phase: null, groups: [], teams: teams, analysis: D.analyze({ config: null, groups: [], teams: teams, noun: D.nounFor(category.teamType.size) }), history: [] };
    var s = await load(this, phase.id);
    var history = (await this.list('draws', { phaseId: phase.id })).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0; });
    return { category: category, phase: s.phase, groups: s.groups, teams: s.teams, analysis: s.analysis, history: history };
  };

  // ---- configuração dos grupos (cria a fase de grupos se ainda não existir) ----
  // input: { categoryId, groups, teamsPerGroup?, qualifiedPerGroup, names?, reset? }
  // teamsPerGroup em branco => divisão equilibrada automática (grupos de tamanhos diferentes, maiores primeiro).
  P.configureGroups = async function (input) {
    var cat = await this.getOrThrow('categories', input.categoryId), phase = await groupsPhaseOf(this, cat.id);

    var balanced = (N === undefined || N === null || N === '') && Number.isInteger(G) && G >= 1, newSizes = [];

      newSizes = input.sizes.slice();
      balanced = true;
      N = Math.max.apply(null, newSizes);
      var smallestC = Math.min.apply(null, newSizes);
      if (Number.isInteger(Q) && Q > smallestC) throw fail('OUT_OF_RANGE', 'Classificadas por grupo não pode exceder o menor grupo (' + smallestC + ').', 'qualifiedPerGroup');
    } else if (balanced) {                             // "equipes por grupo" em branco: divide de forma equilibrada, maiores grupos primeiro
      var teamCount = (await this.list('teams', { categoryId: cat.id })).length;
      newSizes = D.evenSizes(teamCount, G);
      var smallest = Math.min.apply(null, newSizes);
      if (smallest < 2) throw fail('TOO_FEW_TEAMS', teamCount + ' equipes não bastam para ' + G + ' grupos: cada grupo precisa ter ao menos 2.', 'groups');
      N = Math.max.apply(null, newSizes);
      if (Number.isInteger(Q) && Q > smallest) throw fail('OUT_OF_RANGE', 'Classificadas por grupo não pode exceder o menor grupo (' + smallest + ').', 'qualifiedPerGroup');
    } else if (Number.isInteger(G) && G >= 1 && Number.isInteger(N) && N >= 1) newSizes = new Array(G).fill(N);
    var sizeAt = function (i) { return newSizes[i] !== undefined ? newSizes[i] : N; };
    var parsed = D.parseGroupNames(input.names, G);
    if (parsed.error) throw fail(parsed.error.code, parsed.error.message, 'names');
    var names = parsed.names;
    var s = phase ? await load(this, phase.id) : null;
    if (s) assertEditable(s.phase);
    var structural = !s || JSON.stringify(VT.schema.groupSizes(s.phase.groupsConfig)) !== JSON.stringify(newSizes);
    var placed = s ? s.groups.reduce(function (n, g) { return n + g.teamIds.filter(Boolean).length; }, 0) : 0;
    if (s && structural && placed > 0 && !input.reset)
      throw fail('DISTRIBUTION_NOT_EMPTY', 'Mudar a quantidade de grupos ou de equipes por grupo apaga a distribuição atual.', 'groups');
    var cfg = { groups: G, teamsPerGroup: N, qualifiedPerGroup: Q, format: 'roundRobin', legs: s ? s.phase.groupsConfig.legs : 1 };
    if (balanced) { cfg.sizes = newSizes; cfg.balanced = true; }
    var u = this._unit(), old, ph;
    try {
      if (!s) {
        var all = await this.list('phases', { categoryId: cat.id });
        ph = await u.create('phases', { categoryId: cat.id, order: all.reduce(function (m, p) { return Math.max(m, p.order); }, 0) + 1, name: 'Fase de grupos', type: 'groups',
          matchFormat: U.clone(cat.defaultMatchFormat), scoringRuleId: cat.scoringRuleId, tiebreakRuleId: cat.tiebreakRuleId, groupsConfig: cfg });
        old = [];
      } else { ph = await u.update('phases', s.phase.id, { groupsConfig: cfg, confirmedAt: null }); old = s.groups; }
      for (var i = names.length; i < old.length; i++) {            // grupos que sobraram
        if ((await this.repo.findBy('matches', 'groupId', old[i].id)).length) throw fail('GROUP_IN_USE', 'Há jogos neste grupo.', 'groups');
        await u.remove('groups', old[i].id);
      }
      var keep = Math.min(old.length, names.length);
      for (var k = 0; k < keep; k++) if (old[k].name !== names[k]) {                        // nome temporário evita repetição durante trocas de nome (A↔B)
        var tmp = { name: '~tmp' + k }; if (structural) tmp.teamIds = new Array(sizeAt(k)).fill(null);     // já no tamanho novo (GROUP_SIZE)
        await u.update('groups', old[k].id, tmp);

      for (var m = 0; m < keep; m++) {
        var patch = { name: names[m], order: m + 1 };
        if (structural) patch.teamIds = new Array(sizeAt(m)).fill(null);
        if (old[m].name !== names[m] || old[m].order !== m + 1 || structural) await u.update('groups', old[m].id, patch);
      }
      for (var c = keep; c < names.length; c++) await u.create('groups', { phaseId: ph.id, name: names[c], order: c + 1, teamIds: new Array(sizeAt(c)).fill(null) });
      var ko = await koPhaseOf(this, cat.id);                       // vagas groupPos do mata-mata acompanham nomes/qtd de grupos
      if (ko && ko.entrants.some(function (e) { return e.type === 'groupPos' && e.phaseId === ph.id; }) && Number.isInteger(Q) && Q >= 1)
        await u.update('phases', ko.id, { entrants: slotsFromGroups(ph.id, names, Q) });
    } catch (e) {
      if (e instanceof E.ValidationError) throw new E.ValidationError(e.issues.map(function (x) { return Object.assign({}, x, { path: String(x.path).replace(/^groupsConfig\./, '') }); }));
      throw e;
    }
    await u.commit();
    return load(this, ph.id);
  };

  // ---- operações de posição (manual) ----
  P.assignTeam = async function (phaseId, teamId, groupId, position) {
    var s = await load(this, phaseId); assertEditable(s.phase);
    var g = groupOf(s, groupId); checkPosition(g, position);
    var here = s.analysis.placements[teamId];
    if (here && here.groupId === g.id && here.position !== position) throw fail('DUPLICATE_TEAM', 'Equipe já alocada no Grupo ' + here.groupName + ' — Posição ' + here.position + '.', 'teamId');
    var occupant = g.teamIds[position - 1];
    if (occupant && occupant !== teamId) throw fail('POSITION_OCCUPIED', 'Posição ocupada por "' + teamName(s, occupant) + '". Remova ou troque a equipe.', 'position');
    var next = g.teamIds.slice(); next[position - 1] = teamId;
    await applyLayout(this, s, new Map([[g.id, next]]));
  };

  P.removeTeam = async function (phaseId, teamId) {
    var s = await load(this, phaseId); assertEditable(s.phase);
    var pl = s.analysis.placements[teamId]; if (!pl) throw fail('NOT_ALLOCATED', 'A equipe não está alocada em nenhum grupo.', 'teamId');
    var g = groupOf(s, pl.groupId), next = g.teamIds.slice(); next[pl.position - 1] = null;
    await applyLayout(this, s, new Map([[g.id, next]]));
  };

  P.moveTeam = async function (phaseId, teamId, groupId, position) {
    var s = await load(this, phaseId); assertEditable(s.phase);
    var pl = s.analysis.placements[teamId]; if (!pl) throw fail('NOT_ALLOCATED', 'A equipe não está alocada em nenhum grupo.', 'teamId');
    var to = groupOf(s, groupId); checkPosition(to, position);
    var occ = to.teamIds[position - 1];
    if (occ && occ !== teamId) throw fail('POSITION_OCCUPIED', 'Posição ocupada por "' + teamName(s, occ) + '". Use trocar.', 'position');
    var from = groupOf(s, pl.groupId), finals = new Map(), a = from.teamIds.slice();
    a[pl.position - 1] = null; finals.set(from.id, a);
    var b = (to.id === from.id ? a : to.teamIds.slice()); b[position - 1] = teamId; finals.set(to.id, b);
    var self = this, note = teamName(s, teamId) + ': ' + where(pl) + ' → Grupo ' + to.name + ' — Posição ' + position;
    var at = await stamp(this, s.phase.id);
    await applyLayout(this, s, finals, function (u, out) { return u.create('draws', { categoryId: s.phase.categoryId, phaseId: s.phase.id, method: 'move', note: note, createdAt: at, input: [], output: out }); });
  };

  P.swapTeams = async function (phaseId, teamA, teamB) {
    var s = await load(this, phaseId); assertEditable(s.phase);
    var pa = s.analysis.placements[teamA], pb = s.analysis.placements[teamB];

    var ga = groupOf(s, pa.groupId), gb = groupOf(s, pb.groupId), finals = new Map();

    var b = ga.id === gb.id ? a : gb.teamIds.slice(); finals.set(gb.id, b);
    a[pa.position - 1] = teamB; b[pb.position - 1] = teamA;
    var note = teamName(s, teamA) + ' (' + where(pa) + ') ⇄ ' + teamName(s, teamB) + ' (' + where(pb) + ')';

    await applyLayout(this, s, finals, function (u, out) { return u.create('draws', { categoryId: s.phase.categoryId, phaseId: s.phase.id, method: 'swap', note: note, createdAt: at, input: [], output: out }); });

  P.clearGroup = async function (phaseId, groupId) {

  P.clearDistribution = async function (phaseId) {

  // ---- distribuição automática: SORTEIO (seed) e EM ORDEM ----
  async function autoPlace(store, input, method) {
    var phase = await groupsPhaseOf(store, input.categoryId);
    if (!phase) throw fail('NO_CONFIG', 'Configure os grupos antes de distribuir.');
    var s = await load(store, phase.id); assertEditable(s.phase);
    var bad = s.analysis.issues.filter(function (i) { return i.code === 'GROUP_COUNT_MISMATCH' || i.code === 'INCOMPATIBLE_TEAM_COUNT'; })[0];

  // Distribuição automática em ordem (sem sorteio).
  P.runAutomaticDistribution = function (input) { return autoPlace(this, input, 'automatic'); };

  // ---- confirmação e início ----
  // Só confirma distribuição COMPLETA e válida. Registra no histórico quando o resultado atual não é exatamente o
  // do último sorteio automático (ou seja, houve decisão manual). manualSource é apenas informativo.
  P.confirmDistribution = async function (phaseId, opts) {
    var s = await load(this, phaseId); assertEditable(s.phase);
    var st = s.analysis.status;
    if (st !== 'completa' && st !== 'confirmada')
      throw new E.ValidationError((s.analysis.issues.length ? s.analysis.issues : [{ code: 'NOT_COMPLETE', message: 'A distribuição ainda não está completa.' }]).map(function (i) { return { severity: 'error', path: '', code: i.code, message: i.message }; }));
    var output = s.groups.map(function (g) { return { groupName: g.name, teamIds: g.teamIds.slice() }; });
    var last = (await this.list('draws', { phaseId: s.phase.id })).filter(function (d) { return d.method === 'draw' || d.method === 'automatic'; })
      .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0; })[0];
    var u = this._unit(), at = await stamp(this, s.phase.id);
    if (!last || !same(last.output, output))
      await u.create('draws', { categoryId: s.phase.categoryId, phaseId: s.phase.id, method: 'manual', manualSource: opts && opts.manualSource ? opts.manualSource : null, createdAt: at,
        input: s.teams.map(function (t) { return { teamId: t.id, name: t.name, seed: t.seed || null }; }), output: output });

    await u.commit();

  };

  // Marca a fase como iniciada (trava a distribuição). Só depois de confirmada. (Sem tela nesta etapa.)
  P.markPhaseStarted = async function (phaseId) {
    var s = await load(this, phaseId);
    if (s.analysis.status !== 'confirmada') throw fail('NOT_CONFIRMED', 'Confirme a distribuição antes de iniciar a fase.');
    await this.update('phases', s.phase.id, { startedAt: VT.clock.now() });
  };

  // ---- estrutura de fases da categoria ----
  function slotsFromGroups(phaseId, names, qualified) {      // classificados: 1º de cada grupo, depois 2º de cada grupo...
    var out = []; for (var p = 1; p <= qualified; p++) names.forEach(function (n) { out.push(VT.models.slot.groupPos(phaseId, n, p)); });
    return out;
  }
  async function koPhaseOf(store, categoryId) {
    var l = (await store.list('phases', { categoryId: categoryId })).filter(function (p) { return p.type === 'knockout'; });
    l.sort(function (a, b) { return a.order - b.order; }); return l[0] || null;
  }
  // Estado da estrutura para a tela "Fases e Grupos".
  P.structureState = async function (categoryId) {
    var cat = await this.getOrThrow('categories', categoryId);
    var groupsPhase = await groupsPhaseOf(this, categoryId), ko = await koPhaseOf(this, categoryId);
    var kind = groupsPhase && ko ? 'hybrid' : groupsPhase ? 'groups' : ko ? 'knockout' : null;
    return { category: cat, kind: kind, groupsPhase: groupsPhase, knockoutPhase: ko, teamsCount: (await this.list('teams', { categoryId: categoryId })).length };
  };
  // Remove TODAS as fases da categoria (mata-mata primeiro, pois referencia os grupos).
  P.resetStructure = async function (categoryId) {
    var phases = (await this.list('phases', { categoryId: categoryId })).sort(function (a, b) { return b.order - a.order; });
    for (var ph of phases) {

  // input: { categoryId, kind: 'groups'|'knockout'|'hybrid', groups, teamsPerGroup, qualifiedPerGroup, names?, reset? }
  // Trocar de tipo apaga a estrutura atual (exige reset:true). Mata-mata aqui é só a FASE e suas vagas (SlotRef):
  // não há geração de jogos nem chaveamento nesta etapa.
  P.saveStructure = async function (input) {
    var cur = await this.structureState(input.categoryId), kind = input.kind;
    if (['groups', 'knockout', 'hybrid'].indexOf(kind) < 0) throw fail('INVALID_KIND', 'Escolha: grupos, mata-mata direto ou híbrido.', 'kind');
    if (cur.kind && cur.kind !== kind) {
      if (!input.reset) throw fail('STRUCTURE_CHANGE', 'Trocar o tipo de estrutura apaga as fases atuais e a distribuição.', 'kind');
      await this.resetStructure(input.categoryId); cur = await this.structureState(input.categoryId);
    }
    var cat = cur.category, ko = cur.knockoutPhase;
    if (kind === 'knockout') {
      var teams = (await this.list('teams', { categoryId: cat.id })).sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'pt'); });
      var entrants = teams.map(function (t) { return VT.models.slot.team(t.id); });
      if (ko) await this.update('phases', ko.id, { entrants: entrants });
      else await this.create('phases', { categoryId: cat.id, order: 1, name: 'Mata-mata', type: 'knockout', matchFormat: U.clone(cat.defaultMatchFormat), entrants: entrants });
      return this.structureState(cat.id);
    }
    if (kind === 'hybrid' && !(Number.isInteger(input.qualifiedPerGroup) && input.qualifiedPerGroup >= 1))
      throw fail('INVALID_VALUE', 'No modelo híbrido, ao menos 1 equipe por grupo precisa se classificar.', 'qualifiedPerGroup');
    var res = await this.configureGroups({ categoryId: cat.id, groups: input.groups, teamsPerGroup: input.teamsPerGroup, qualifiedPerGroup: input.qualifiedPerGroup, names: input.names, reset: input.reset });
    var names = res.groups.map(function (g) { return g.name; });
    if (kind === 'hybrid') {
      var entr = slotsFromGroups(res.phase.id, names, input.qualifiedPerGroup);
      if (ko) await this.update('phases', ko.id, { entrants: entr });

        var all = await this.list('phases', { categoryId: cat.id });
        await this.create('phases', { categoryId: cat.id, order: all.reduce(function (m, p) { return Math.max(m, p.order); }, 0) + 1, name: 'Mata-mata', type: 'knockout', matchFormat: U.clone(cat.defaultMatchFormat), entrants: entr });
      }
    } else if (ko) {                          // virou "só grupos": o mata-mata não faz mais sentido
      await this.remove('phases', ko.id, { cascade: true });
    }
    return this.structureState(cat.id);
  };

  // Chamado pela interface após importar um backup: registra no histórico as distribuições que chegaram.
  P.recordImport = async function (tournamentIds) {
    var n = 0;
    for (var tid of tournamentIds) {
      for (var cat of await this.list('categories', { tournamentId: tid })) {
        var ph = await groupsPhaseOf(this, cat.id); if (!ph) continue;
        var s = await load(this, ph.id); if (!s.analysis.filled) continue;
        var at = await stamp(this, ph.id);
        await this.create('draws', { categoryId: cat.id, phaseId: ph.id, method: 'import', note: 'Distribuição importada de backup.', createdAt: at, input: [],

})(typeof globalThis !== 'undefined' ? globalThis : this);
