<script>/* src/store/matches.js */
/* Jogos e Resultados — operações de DOMÍNIO do Store (Etapa 4).
 *
 *   UI → Store (aqui) → engines puras (VT.engines.matchgen, VT.engines.score) → Repository
 *
 * Geração round-robin, agendamento manual, registro de resultado, cancelamento.
 * Toda operação é atômica via unit-of-work do Store. */
(function (root) {
  'use strict';
  var VT = root.VT, E = VT.errors, MG = VT.engines.matchgen, SC = VT.engines.score, ST = VT.engines.standings, P = VT.Store.prototype;

  function fail(code, message, path) { return new E.ValidationError([{ severity: 'error', path: path || '', code: code, message: message }]); }

  function resolveMatchFormat(phase, category, round) {
    if (round != null && phase.matchFormatByRound && phase.matchFormatByRound[round]) {
      return phase.matchFormatByRound[round];
    }
    return phase.matchFormat || category.defaultMatchFormat || { bestOf: 1, pointsToWin: 21 };
  }

  P.generateGroupMatches = async function (categoryId) {
    var cat = await this.getOrThrow('categories', categoryId);
    var phases = (await this.list('phases', { categoryId: categoryId })).filter(function (p) { return p.type === 'groups'; });
    phases.sort(function (a, b) { return a.order - b.order; });
    var phase = phases[0];
    if (!phase) throw fail('NO_GROUPS_PHASE', 'A categoria não tem fase de grupos.');
    if (!phase.confirmedAt) throw fail('NOT_CONFIRMED', 'Confirme a distribuição antes de gerar os jogos.');

    var existing = await this.list('matches', { phaseId: phase.id });
    if (existing.length) throw fail('MATCHES_EXIST', 'Já existem ' + existing.length + ' jogo(s) nesta fase. Exclua-os para gerar novamente.');

    var groups = await this.list('groups', { phaseId: phase.id });
    var legs = (phase.groupsConfig && phase.groupsConfig.legs) || 1;
    var specs = MG.generateRoundRobin({
      categoryId: categoryId, phaseId: phase.id, groups: groups, legs: legs
    });

    var u = this._unit();
    var created = [];
    for (var i = 0; i < specs.length; i++) {
      var m = await u.create('matches', specs[i]);
      created.push(m);
    }
    await u.commit();
    return { phase: phase, matches: created, count: created.length };
  };

  P.deleteGroupMatches = async function (categoryId) {
    var phases = (await this.list('phases', { categoryId: categoryId })).filter(function (p) { return p.type === 'groups'; });
    var phase = phases[0];
    if (!phase) throw fail('NO_GROUPS_PHASE', 'A categoria não tem fase de grupos.');

    var matches = await this.list('matches', { phaseId: phase.id });
    var started = matches.filter(function (m) { return m.status === 'andamento' || m.status === 'finalizado'; });
    if (started.length) throw fail('HAS_RESULTS', started.length + ' jogo(s) já tem resultado ou estão em andamento.');

    var u = this._unit();
    for (var i = 0; i < matches.length; i++) await u.remove('matches', matches[i].id);
    await u.commit();
    return { removed: matches.length };
  };

  P.matchesState = async function (categoryId) {
    var cat = await this.getOrThrow('categories', categoryId);
    var phases = await this.list('phases', { categoryId: categoryId });
    var allMatches = await this.list('matches', { categoryId: categoryId });
    var groups = [];
    for (var i = 0; i < phases.length; i++) {
      var pg = await this.list('groups', { phaseId: phases[i].id });
      groups = groups.concat(pg);
    }

    var byStatus = { aguardando: 0, agendado: 0, andamento: 0, finalizado: 0, cancelado: 0 };
    allMatches.forEach(function (m) { if (byStatus[m.status] !== undefined) byStatus[m.status]++; });

    var byGroup = {};
    allMatches.forEach(function (m) {
      var gid = m.groupId || '_none';
      if (!byGroup[gid]) byGroup[gid] = [];
      byGroup[gid].push(m);
    });

    return {
      category: cat, phases: phases, groups: groups,
      matches: allMatches, total: allMatches.length,
      byStatus: byStatus, byGroup: byGroup
    };
  };

  P.scheduleMatch = async function (matchId, schedule) {
    var m = await this.getOrThrow('matches', matchId);
    var patch = { schedule: { date: schedule.date || null, time: schedule.time || null, court: schedule.court || null } };
    if (m.status === 'aguardando' && (schedule.date || schedule.time)) patch.status = 'agendado';
    return this.update('matches', matchId, patch);
  };

  P.startMatch = async function (matchId) {
    var m = await this.getOrThrow('matches', matchId);
    if (m.status !== 'aguardando' && m.status !== 'agendado')
      throw fail('INVALID_TRANSITION', 'Só jogos aguardando ou agendados podem ser iniciados (atual: ' + m.status + ').');
    return this.update('matches', matchId, { status: 'andamento' });
  };

  function matchWinnerLoser(m) {
    var winnerId = null, loserId = null;
    // Usa os sets como fonte primária (W.O. agora sempre gera sets reais)
    if (m.sets && m.sets.length) {
      var sA = 0, sB = 0;
      m.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; });
      if (sA > 0 || sB > 0) {
        winnerId = sA > sB ? m.slotA.teamId : m.slotB.teamId;
        loserId  = sA > sB ? m.slotB.teamId : m.slotA.teamId;
      }
    }
    // Fallback: W.O. antigo sem sets (retrocompatibilidade) — slotA vence
    if (!winnerId && (m.resultType === 'wo' || m.resultType === 'desistencia')) {
      winnerId = m.slotA.teamId; loserId = m.slotB.teamId;
    }
    return { winnerId: winnerId, loserId: loserId };
  }

  async function resolveDownstreamSlots(store, matchId, categoryId) {
    var m = await store.get('matches', matchId);
    if (!m || m.status !== 'finalizado') return;
    var wl = matchWinnerLoser(m);
    if (!wl.winnerId) return;

    var allMatches = await store.list('matches', { categoryId: categoryId });
    for (var i = 0; i < allMatches.length; i++) {
      var dm = allMatches[i];
      var patch = null;
      if (dm.slotA && dm.slotA.type === 'winnerOf' && dm.slotA.matchId === matchId) {
        patch = patch || {}; patch.slotA = VT.models.slot.team(wl.winnerId);
      }
      if (dm.slotB && dm.slotB.type === 'winnerOf' && dm.slotB.matchId === matchId) {
        patch = patch || {}; patch.slotB = VT.models.slot.team(wl.winnerId);
      }
      if (dm.slotA && dm.slotA.type === 'loserOf' && dm.slotA.matchId === matchId) {
        patch = patch || {}; patch.slotA = VT.models.slot.team(wl.loserId);
      }
      if (dm.slotB && dm.slotB.type === 'loserOf' && dm.slotB.matchId === matchId) {
        patch = patch || {}; patch.slotB = VT.models.slot.team(wl.loserId);
      }
      if (patch) {
        var updated = Object.assign({}, dm, patch);
        var bothResolved = updated.slotA && updated.slotA.type === 'team' && updated.slotB && updated.slotB.type === 'team';
        if (bothResolved && dm.status === 'aguardando') patch.status = 'agendado';
        await store.update('matches', dm.id, patch);
      }
    }
  }

  P.recordResult = async function (matchId, result) {
    var m = await this.getOrThrow('matches', matchId);
    if (m.status === 'cancelado') throw fail('MATCH_CANCELLED', 'Jogo cancelado não pode receber resultado.');
    if (m.status === 'finalizado' && !result.correction)
      throw fail('ALREADY_FINISHED', 'Jogo já finalizado. Use correction:true para corrigir.');

    var resultType = result.resultType || 'normal';
    var patch = { resultType: resultType, resultDetail: result.resultDetail || null, status: 'finalizado' };

    if (resultType === 'normal') {
      var phase = await this.getOrThrow('phases', m.phaseId);
      var cat = await this.getOrThrow('categories', m.categoryId);
      var fmt = resolveMatchFormat(phase, cat, m.round);
      var validation = SC.validateMatch(result.sets, fmt);
      if (!validation.valid)
        throw new E.ValidationError(validation.issues.map(function (is) {
          return { severity: 'error', path: 'sets', code: is.code, message: is.message };
        }));
      patch.sets = result.sets;
    } else {
      if (resultType === 'wo' || resultType === 'desistencia') {
        var phase2 = await this.getOrThrow('phases', m.phaseId);
        var cat2 = await this.getOrThrow('categories', m.categoryId);
        var fmt2 = resolveMatchFormat(phase2, cat2, m.round);
        var pts = (fmt2 && fmt2.pointsToWin) || 21;
        // result.woLoser: 'A' ou 'B' — quem perdeu o W.O. (default: 'B', time A vence)
        var loser = result.woLoser === 'A' ? 'A' : 'B';
        patch.sets = loser === 'B' ? [{ a: pts, b: 0 }] : [{ a: 0, b: pts }];
      } else {
        patch.sets = result.sets || [];
      }
    }

    var updated = await this.update('matches', matchId, patch);
    await resolveDownstreamSlots(this, matchId, m.categoryId);
    if (typeof window !== 'undefined' && window.__erpAutoPublish) window.__erpAutoPublish(this);
    return updated;
  };

  P.cancelMatch = async function (matchId, reason) {
    var m = await this.getOrThrow('matches', matchId);
    if (m.status === 'finalizado') throw fail('ALREADY_FINISHED', 'Jogo finalizado não pode ser cancelado.');
    if (m.status === 'cancelado') throw fail('ALREADY_CANCELLED', 'Jogo já está cancelado.');
    return this.update('matches', matchId, {
      status: 'cancelado',
      resultType: 'wo',
      resultDetail: { reason: typeof reason === 'string' ? reason : null }
    });
  };

  P.reopenMatch = async function (matchId) {
    var m = await this.getOrThrow('matches', matchId);
    if (m.status !== 'finalizado' && m.status !== 'cancelado')
      throw fail('INVALID_TRANSITION', 'Só jogos finalizados ou cancelados podem ser reabertos.');

    var phase = await this.get('phases', m.phaseId);
    var isKO = phase && (phase.type === 'knockout' || phase.type === 'thirdPlace');

    if (isKO && m.status === 'finalizado') {
      var wl = matchWinnerLoser(m);
      if (wl.winnerId) {
        var allCatMatches = await this.list('matches', { categoryId: m.categoryId });
        var allPhases = await this.list('phases', { categoryId: m.categoryId });
        var koPhaseIds = {};
        allPhases.forEach(function (p) { if (p.type === 'knockout' || p.type === 'thirdPlace') koPhaseIds[p.id] = p.type; });

        var toRevert = [];
        for (var i = 0; i < allCatMatches.length; i++) {
          var dm = allCatMatches[i];
          if (dm.id === matchId || !koPhaseIds[dm.phaseId]) continue;
          var rA = null, rB = null;
          if (dm.slotA && dm.slotA.type === 'team' && dm.slotA.teamId === wl.winnerId && koPhaseIds[dm.phaseId] === 'knockout')
            rA = VT.models.slot.winnerOf(matchId);
          if (dm.slotB && dm.slotB.type === 'team' && dm.slotB.teamId === wl.winnerId && koPhaseIds[dm.phaseId] === 'knockout')
            rB = VT.models.slot.winnerOf(matchId);
          if (dm.slotA && dm.slotA.type === 'team' && dm.slotA.teamId === wl.loserId && koPhaseIds[dm.phaseId] === 'thirdPlace')
            rA = VT.models.slot.loserOf(matchId);
          if (dm.slotB && dm.slotB.type === 'team' && dm.slotB.teamId === wl.loserId && koPhaseIds[dm.phaseId] === 'thirdPlace')
            rB = VT.models.slot.loserOf(matchId);
          if (rA || rB) {
            if (dm.status === 'finalizado' || dm.status === 'andamento')
              throw fail('DOWNSTREAM_PLAYED', 'Não é possível reabrir: o jogo #' + dm.order + ' que depende deste já foi disputado. Reabra-o primeiro.');
            toRevert.push({ id: dm.id, slotA: rA, slotB: rB });
          }
        }

        var newStatus = (m.schedule && (m.schedule.date || m.schedule.time)) ? 'agendado' : 'aguardando';
        await this.update('matches', matchId, { status: newStatus, sets: [], resultType: 'normal', resultDetail: null });
        for (var j = 0; j < toRevert.length; j++) {
          var rv = toRevert[j], patch = { status: 'aguardando' };
          if (rv.slotA) patch.slotA = rv.slotA;
          if (rv.slotB) patch.slotB = rv.slotB;
          await this.update('matches', rv.id, patch);
        }
        return this.get('matches', matchId);
      }
    }

    var newStatus2 = (m.schedule && (m.schedule.date || m.schedule.time)) ? 'agendado' : 'aguardando';
    var result2 = await this.update('matches', matchId, {
      status: newStatus2, sets: [], resultType: 'normal', resultDetail: null
    });
    if (typeof window !== 'undefined' && window.__erpAutoPublish) window.__erpAutoPublish(this);
    return result2;
  };

  P.autoSchedule = async function (phaseId, options) {
    var phase = await this.getOrThrow('phases', phaseId);
    var matches = (await this.list('matches', { phaseId: phaseId }))
      .filter(function (m) { return m.status === 'aguardando'; })
      .sort(function (a, b) { return a.round - b.round || a.order - b.order; });

    if (!matches.length) return { scheduled: 0 };

    var opts = options || {};
    var startDate = opts.startDate;
    var startTime = opts.startTime || '08:00';
    var intervalMinutes = opts.intervalMinutes || 30;
    var courts = opts.courts || ['1'];

    if (!startDate) throw fail('REQUIRED', 'startDate é obrigatório para agendamento automático.');

    function parseTime(t) { var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
    function fmtTime(mins) { return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); }

    var u = this._unit();
    var courtIdx = 0, timeMins = parseTime(startTime), date = startDate;
    var scheduled = 0;

    for (var i = 0; i < matches.length; i++) {
      var court = courts[courtIdx % courts.length];
      await u.update('matches', matches[i].id, {
        schedule: { date: date, time: fmtTime(timeMins), court: court },
        status: 'agendado'
      });
      scheduled++;
      courtIdx++;
      if (courtIdx % courts.length === 0) timeMins += intervalMinutes;
    }
    await u.commit();
    return { scheduled: scheduled };
  };

  P.clearSchedule = async function (phaseId) {
    var matches = (await this.list('matches', { phaseId: phaseId }))
      .filter(function (m) { return m.status === 'agendado'; });
    if (!matches.length) return { cleared: 0 };
    var u = this._unit();
    for (var i = 0; i < matches.length; i++) {
      await u.update('matches', matches[i].id, { schedule: { date: null, time: null, court: null }, status: 'aguardando' });
    }
    await u.commit();
    return { cleared: matches.length };
  };

  P.groupStandings = async function (categoryId) {
    var cat = await this.getOrThrow('categories', categoryId);
    var phases = (await this.list('phases', { categoryId: categoryId })).filter(function (p) { return p.type === 'groups'; });
    var phase = phases[0];
    if (!phase) return { groups: [], standings: [] };
    var groups = await this.list('groups', { phaseId: phase.id });
    var matches = await this.list('matches', { phaseId: phase.id });
    var teamsArr = await this.list('teams', { categoryId: categoryId });
    var teamsById = {};
    teamsArr.forEach(function (t) { teamsById[t.id] = t; });
    var tbrId = (phase.tiebreakRuleId || cat.tiebreakRuleId);
    var criteria = null;
    if (tbrId) { var tbr = await this.get('tiebreakRules', tbrId); if (tbr) criteria = tbr.criteria; }
    var bestOf = (cat.defaultMatchFormat && parseInt(cat.defaultMatchFormat.bestOf)) || 1;
    var standings = ST.groupStandings(groups, matches, teamsById, criteria, { bestOf: bestOf });
    var totalMatches = matches.length;
    var finishedMatches = matches.filter(function (m) { return m.status === 'finalizado'; }).length;
    return { phase: phase, groups: groups, standings: standings, totalMatches: totalMatches, finishedMatches: finishedMatches, complete: totalMatches > 0 && finishedMatches === totalMatches };
  };

  function isPow2(n) { return n > 1 && (n & (n - 1)) === 0; }
  function nextPow2(n) { var p = 2; while (p < n) p <<= 1; return p; }

  // Retorna os times NÃO classificados de gsData, ordenados por ranking transversal (melhor perdedor primeiro)
  function crossGroupLosers(gsData, qualifiedPerGroup) {
    var losers = [];
    gsData.standings.forEach(function (s) {
      s.rows.forEach(function (r) {
        if (r.rank > qualifiedPerGroup) {
          losers.push({ teamId: r.teamId, groupName: s.group.name, rank: r.rank, wins: r.wins, diff: r.diff, pointsFor: r.pointsFor });
        }
      });
    });
    losers.sort(function (a, b) {
      if (b.wins !== a.wins) return b.wins - a.wins;
      if (b.diff !== a.diff) return b.diff - a.diff;
      return b.pointsFor - a.pointsFor;
    });
    return losers;
  }

  // Ranking transversal de times (classific. + WC) por estatísticas de grupo
  function crossRankAll(teams, gsData) {
    var statsMap = {};
    gsData.standings.forEach(function (s) {
      s.rows.forEach(function (r) { statsMap[r.teamId] = r; });
    });
    return teams.slice().sort(function (a, b) {
      var sa = statsMap[a.teamId] || {}, sb = statsMap[b.teamId] || {};
      if ((sb.wins||0) !== (sa.wins||0)) return (sb.wins||0) - (sa.wins||0);
      if ((sb.diff||0) !== (sa.diff||0)) return (sb.diff||0) - (sa.diff||0);
      return (sb.pointsFor||0) - (sa.pointsFor||0);
    });
  }

  function knockoutTemplates(groupNames) {
    var s = groupNames.slice().sort();
    var n = s.length;
    if (n === 2) return [{ key: 'auto', label: s[0] + '×' + s[1], pairings: [[0, 1]] }];
    if (n === 4) return [
      { key: '1x2_3x4', label: s[0]+'×'+s[1]+' / '+s[2]+'×'+s[3], pairings: [[0,1],[2,3]] },
      { key: '1x3_2x4', label: s[0]+'×'+s[2]+' / '+s[1]+'×'+s[3], pairings: [[0,2],[1,3]] },
      { key: '1x4_2x3', label: s[0]+'×'+s[3]+' / '+s[1]+'×'+s[2], pairings: [[0,3],[1,2]] }
    ];
    var pairs = [];
    for (var i = 0; i < Math.floor(n / 2); i++) pairs.push([i, n - 1 - i]);
    return [{ key: 'auto', label: 'Padrão', pairings: pairs }];
  }

  P.getKnockoutTemplates = async function (categoryId) {
    var gsData = await this.groupStandings(categoryId);
    if (!gsData.standings.length) return [];
    var groupNames = gsData.standings.map(function (s) { return s.group.name; });
    return knockoutTemplates(groupNames);
  };

  P.swapBracketSlots = async function (matchId1, side1, matchId2, side2) {
    var m1 = await this.getOrThrow('matches', matchId1);
    var m2 = await this.getOrThrow('matches', matchId2);
    if (m1.status === 'finalizado' || m2.status === 'finalizado') throw fail('MATCH_FINISHED', 'Partida já finalizada, não é possível trocar slots.');
    var s1 = side1 === 'slotA' ? m1.slotA : m1.slotB;
    var s2 = side2 === 'slotA' ? m2.slotA : m2.slotB;
    var upd1 = {}; upd1[side1] = s2;
    var upd2 = {}; upd2[side2] = s1;
    var u = this._unit();
    await u.update('matches', matchId1, upd1);
    await u.update('matches', matchId2, upd2);
    await u.commit();
  };

  P.generateKnockout = async function (categoryId, templateKey, opts) {
    opts = opts || {};
    var bracketMode = opts.bracketMode || 'seedRanking'; // 'seedRanking' | 'virtualGroup' | 'bestLoser'
    var cat = await this.getOrThrow('categories', categoryId);
    var gsData = await this.groupStandings(categoryId);
    if (!gsData.phase) throw fail('NO_GROUPS_PHASE', 'A categoria não tem fase de grupos.');
    if (!gsData.complete) throw fail('GROUPS_INCOMPLETE', 'A fase de grupos ainda não foi concluída.');

    var groupsPhase = gsData.phase;
    var qualifiedPerGroup = (groupsPhase.groupsConfig && groupsPhase.groupsConfig.qualifiedPerGroup) || 2;
    var standings = gsData.standings;

    var teamByGR = {};
    standings.forEach(function (s) {
      s.rows.forEach(function (r) { teamByGR[s.group.name + '_' + r.rank] = r.teamId; });
    });

    var groupNames = standings.map(function (s) { return s.group.name; }).sort();
    var templates = knockoutTemplates(groupNames);
    var tpl = templates[0];
    if (templateKey) {
      var found = templates.filter(function (t) { return t.key === templateKey; })[0];
      if (found) tpl = found;
    }

    var qualified = [];
    standings.forEach(function (s) {
      for (var i = 0; i < Math.min(qualifiedPerGroup, s.rows.length); i++) {
        qualified.push({ teamId: s.rows[i].teamId, groupName: s.group.name, rank: s.rows[i].rank });
      }
    });
    if (qualified.length < 2) throw fail('NOT_ENOUGH_TEAMS', 'Menos de 2 equipes classificadas.');

    var existingKO = (await this.list('phases', { categoryId: categoryId })).filter(function (p) {
      return p.type === 'knockout' || p.type === 'thirdPlace' || p.type === 'wildcard' || p.type === 'bestLoserSemi';
    });
    if (existingKO.length) {
      var hasMatches = false;
      for (var ei = 0; ei < existingKO.length; ei++) {
        var em = await this.list('matches', { phaseId: existingKO[ei].id });
        if (em.length) { hasMatches = true; break; }
      }
      if (hasMatches) throw fail('KNOCKOUT_EXISTS', 'Já existem fases eliminatórias. Exclua-as para gerar novamente.');
      await this.deleteKnockout(categoryId);
    }

    var u = this._unit();
    var slot = VT.models.slot;

    // ── MODO BESTLOSER ─────────────────────────────────────────────────────────
    // Gera apenas as quartas (todos os classificados em pares) e espera o usuário
    // apurar o melhor perdedor para completar as semifinais.
    if (!isPow2(qualified.length) && bracketMode === 'bestLoser') {
      var allRanked = crossRankAll(qualified, gsData);
      var qfCount = Math.floor(allRanked.length / 2);
      // Seeding: 1º vs Nº, 2º vs (N-1)º, ...
      var qfPairs = [];
      for (var qi = 0; qi < qfCount; qi++) {
        qfPairs.push({ a: allRanked[qi].teamId, b: allRanked[allRanked.length - 1 - qi].teamId });
      }
      // Se N ímpar, o 1º seed recebe bye automático (não entra nas quartas)
      var byeTeamId = (allRanked.length % 2 !== 0) ? allRanked[0].teamId : null;

      var koPhaseC = await u.create('phases', {
        categoryId: categoryId, order: groupsPhase.order + 1, name: 'Eliminatórias',
        type: 'knockout', matchFormat: null, bracketFormat: 'bestLoser',
        wildcardTeamIds: byeTeamId ? [byeTeamId] : []
      });
      var qfMatches = [];
      for (var qi2 = 0; qi2 < qfPairs.length; qi2++) {
        var qm = await u.create('matches', {
          categoryId: categoryId, phaseId: koPhaseC.id,
          round: 1, order: qi2 + 1,
          slotA: slot.team(qfPairs[qi2].a), slotB: slot.team(qfPairs[qi2].b),
          status: 'agendado'
        });
        qfMatches.push(qm);
      }
      await u.commit();
      return { knockoutPhase: koPhaseC, thirdPlacePhase: null, matches: qfMatches, thirdPlaceMatch: null, qualified: qualified, bracketMode: 'bestLoser' };
    }

    // ── MODOS SEEDRANKING / VIRTUALGROUP ──────────────────────────────────────
    var firstRoundPairs = [];

    if (!isPow2(qualified.length)) {
      // Calcula quantos WC são necessários
      var needWC = nextPow2(qualified.length) - qualified.length;
      var losers = crossGroupLosers(gsData, qualifiedPerGroup);
      var wcTeams = losers.slice(0, needWC).map(function (l) {
        return { teamId: l.teamId, groupName: l.groupName, rank: l.rank, isWC: true };
      });

      if (bracketMode === 'virtualGroup') {
        // Adiciona WC como grupo virtual "WC" e usa template cross-grupo
        var wcGroupName = 'WC';
        var expandedNames = groupNames.concat([wcGroupName]);
        wcTeams.forEach(function (wc, i) { teamByGR[wcGroupName + '_' + (i + 1)] = wc.teamId; });
        var extTemplates = knockoutTemplates(expandedNames);
        var extTpl = extTemplates[0];
        extTpl.pairings.forEach(function (pair) {
          firstRoundPairs.push({ a: teamByGR[expandedNames[pair[0]] + '_1'], b: teamByGR[expandedNames[pair[1]] + '_2'] });
          firstRoundPairs.push({ a: teamByGR[expandedNames[pair[1]] + '_1'], b: teamByGR[expandedNames[pair[0]] + '_2'] });
        });
      } else {
        // seedRanking: ranking global, seeding 1º vs Nº
        var allTeams = qualified.concat(wcTeams);
        var ranked = crossRankAll(allTeams, gsData);
        var N = ranked.length;
        for (var ri = 0; ri < Math.floor(N / 2); ri++) {
          firstRoundPairs.push({ a: ranked[ri].teamId, b: ranked[N - 1 - ri].teamId });
        }
      }
      // Salva os IDs dos WC para exibição
      var wcIds = wcTeams.map(function (w) { return w.teamId; });
      var koPhaseWC = await u.create('phases', {
        categoryId: categoryId, order: groupsPhase.order + 1, name: 'Eliminatórias',
        type: 'knockout', matchFormat: null, bracketFormat: bracketMode,
        wildcardTeamIds: wcIds
      });
      var allMatchesWC = [];
      var prevRoundWC = [];
      for (var mi0 = 0; mi0 < firstRoundPairs.length; mi0++) {
        var fp0 = firstRoundPairs[mi0];
        var m0 = await u.create('matches', {
          categoryId: categoryId, phaseId: koPhaseWC.id,
          round: 1, order: mi0 + 1,
          slotA: slot.team(fp0.a), slotB: slot.team(fp0.b),
          status: 'agendado'
        });
        prevRoundWC.push(m0);
        allMatchesWC.push(m0);
      }
      var roundWC = 2, thirdPhaseWC = null, thirdMatchWC = null;
      while (prevRoundWC.length >= 2) {
        var nNextWC = Math.floor(prevRoundWC.length / 2);
        var nextRoundWC = [];
        for (var ni0 = 0; ni0 < nNextWC; ni0++) {
          var nmWC = await u.create('matches', {
            categoryId: categoryId, phaseId: koPhaseWC.id,
            round: roundWC, order: ni0 + 1,
            slotA: slot.winnerOf(prevRoundWC[ni0].id),
            slotB: slot.winnerOf(prevRoundWC[prevRoundWC.length - 1 - ni0].id),
            status: 'aguardando'
          });
          nextRoundWC.push(nmWC);
          allMatchesWC.push(nmWC);
        }
        if (prevRoundWC.length === 2) {
          thirdPhaseWC = await u.create('phases', {
            categoryId: categoryId, order: koPhaseWC.order + 1,
            name: 'Disputa de 3º lugar', type: 'thirdPlace', matchFormat: null
          });
          thirdMatchWC = await u.create('matches', {
            categoryId: categoryId, phaseId: thirdPhaseWC.id,
            round: 1, order: 1,
            slotA: slot.loserOf(prevRoundWC[0].id),
            slotB: slot.loserOf(prevRoundWC[1].id),
            status: 'aguardando'
          });
        }
        prevRoundWC = nextRoundWC;
        roundWC++;
      }
      await u.commit();
      return { knockoutPhase: koPhaseWC, thirdPlacePhase: thirdPhaseWC, matches: allMatchesWC, thirdPlaceMatch: thirdMatchWC, qualified: qualified, bracketMode: bracketMode };
    }

    // ── BRACKET NORMAL (potência de 2) ────────────────────────────────────────
    if (groupNames.length === 1) {
      var gn = groupNames[0];
      var totalQ = qualified.length;
      for (var qi = 0; qi < Math.floor(totalQ / 2); qi++) {
        firstRoundPairs.push({ a: teamByGR[gn + '_' + (qi + 1)], b: teamByGR[gn + '_' + (totalQ - qi)] });
      }
    } else {
      tpl.pairings.forEach(function (pair) {
        firstRoundPairs.push({ a: teamByGR[groupNames[pair[0]] + '_1'], b: teamByGR[groupNames[pair[1]] + '_2'] });
        firstRoundPairs.push({ a: teamByGR[groupNames[pair[1]] + '_1'], b: teamByGR[groupNames[pair[0]] + '_2'] });
      });
    }
    if (firstRoundPairs.length === 0) throw fail('NOT_ENOUGH_PAIRS', 'Nenhum confronto pôde ser gerado com os classificados disponíveis.');

    var koPhase = await u.create('phases', {
      categoryId: categoryId, order: groupsPhase.order + 1, name: 'Eliminatórias',
      type: 'knockout', matchFormat: null
    });

    var allMatches = [];
    var prevRound = [];
    for (var mi = 0; mi < firstRoundPairs.length; mi++) {
      var fp = firstRoundPairs[mi];
      var match = await u.create('matches', {
        categoryId: categoryId, phaseId: koPhase.id,
        round: 1, order: mi + 1,
        slotA: slot.team(fp.a), slotB: slot.team(fp.b),
        status: 'agendado'
      });
      prevRound.push(match);
      allMatches.push(match);
    }

    var round = 2;
    var thirdPhase = null, thirdMatch = null;
    while (prevRound.length >= 2) {
      var nNext = Math.floor(prevRound.length / 2);
      var nextRound = [];
      for (var ni = 0; ni < nNext; ni++) {
        var idxA = ni, idxB = prevRound.length - 1 - ni;
        var nm = await u.create('matches', {
          categoryId: categoryId, phaseId: koPhase.id,
          round: round, order: ni + 1,
          slotA: slot.winnerOf(prevRound[idxA].id),
          slotB: slot.winnerOf(prevRound[idxB].id),
          status: 'aguardando'
        });
        nextRound.push(nm);
        allMatches.push(nm);
      }

      if (prevRound.length === 2) {
        thirdPhase = await u.create('phases', {
          categoryId: categoryId, order: koPhase.order + 1,
          name: 'Disputa de 3º lugar', type: 'thirdPlace', matchFormat: null
        });
        thirdMatch = await u.create('matches', {
          categoryId: categoryId, phaseId: thirdPhase.id,
          round: 1, order: 1,
          slotA: slot.loserOf(prevRound[0].id),
          slotB: slot.loserOf(prevRound[1].id),
          status: 'aguardando'
        });
      }

      prevRound = nextRound;
      round++;
    }

    await u.commit();
    return { knockoutPhase: koPhase, thirdPlacePhase: thirdPhase, matches: allMatches, thirdPlaceMatch: thirdMatch, qualified: qualified, template: tpl };
  };

  // Apura o(s) melhor(es) perdedor(es) das quartas para completar as semifinais (modo bestLoser)
  P.completeBestLoserSemi = async function (categoryId) {
    var gsData = await this.groupStandings(categoryId);
    var qualifiedPerGroup = (gsData.phase && gsData.phase.groupsConfig && gsData.phase.groupsConfig.qualifiedPerGroup) || 2;
    var allPhases = await this.list('phases', { categoryId: categoryId });
    var koPhase = allPhases.filter(function (p) { return p.type === 'knockout' && p.bracketFormat === 'bestLoser'; })[0];
    if (!koPhase) throw fail('NO_BESTLOSER_PHASE', 'Nenhuma fase eliminatória no modo melhor perdedor encontrada.');

    var qfMatches = await this.list('matches', { phaseId: koPhase.id });
    var r1Matches = qfMatches.filter(function (m) { return m.round === 1; });
    var allDone = r1Matches.every(function (m) { return m.status === 'finalizado'; });
    if (!allDone) throw fail('QF_INCOMPLETE', 'Todas as quartas de final precisam estar finalizadas.');

    // Coleta vencedores e perdedores usando sets como fonte primária
    var winners = [], losers = [];
    r1Matches.forEach(function (m) {
      var sA = 0, sB = 0, pA = 0, pB = 0;
      (m.sets || []).forEach(function (s) {
        if (s.a > s.b) sA++; else if (s.b > s.a) sB++;
        pA += s.a; pB += s.b;
      });
      var wid = (sA > 0 || sB > 0) ? (sA > sB ? m.slotA.teamId : m.slotB.teamId) : (m.slotA && m.slotA.teamId);
      var lid = (sA > 0 || sB > 0) ? (sA > sB ? m.slotB.teamId : m.slotA.teamId) : (m.slotB && m.slotB.teamId);
      var loserPts = (sA > sB) ? pB : pA;
      var winnerPts2 = (sA > sB) ? pA : pB;
      if (wid) winners.push({ teamId: wid });
      if (lid) losers.push({ teamId: lid, qfPts: loserPts, qfDiff: loserPts - winnerPts2 });
    });

    // Adiciona time com bye, se houver
    var byeTeamIds = koPhase.wildcardTeamIds || [];
    byeTeamIds.forEach(function (tid) { winners.push({ teamId: tid, isBye: true }); });

    // Classifica perdedores apenas pelo desempenho nas quartas (sem olhar para grupos)
    losers.sort(function (a, b) {
      if ((b.qfPts||0) !== (a.qfPts||0)) return (b.qfPts||0) - (a.qfPts||0);
      return (b.qfDiff||0) - (a.qfDiff||0);
    });

    // Para semis: precisa de 4 times (2 matches)
    var semiSize = 4;
    var wcNeeded = semiSize - winners.length;
    if (wcNeeded < 0) wcNeeded = 0;
    var wcLosers = losers.slice(0, wcNeeded);
    var semiTeams = winners.concat(wcLosers);

    // Ranking global dos semifinalistas
    semiTeams.sort(function (a, b) {
      var sa = statsMap[a.teamId] || {}, sb = statsMap[b.teamId] || {};
      if ((sb.wins||0) !== (sa.wins||0)) return (sb.wins||0) - (sa.wins||0);
      if ((sb.diff||0) !== (sa.diff||0)) return (sb.diff||0) - (sa.diff||0);
      return (sb.pointsFor||0) - (sa.pointsFor||0);
    });

    var u = this._unit();
    var slot = VT.models.slot;
    var semiMatches = [];

    // Seeding: 1º vs 4º, 2º vs 3º
    for (var si = 0; si < Math.floor(semiTeams.length / 2); si++) {
      var sm = await u.create('matches', {
        categoryId: categoryId, phaseId: koPhase.id,
        round: 2, order: si + 1,
        slotA: slot.team(semiTeams[si].teamId),
        slotB: slot.team(semiTeams[semiTeams.length - 1 - si].teamId),
        status: 'agendado'
      });
      semiMatches.push(sm);
    }

    // Final
    var finalMatch = await u.create('matches', {
      categoryId: categoryId, phaseId: koPhase.id,
      round: 3, order: 1,
      slotA: slot.winnerOf(semiMatches[0].id),
      slotB: slot.winnerOf(semiMatches[1].id),
      status: 'aguardando'
    });

    var thirdPhase = await u.create('phases', {
      categoryId: categoryId, order: koPhase.order + 1,
      name: 'Disputa de 3º lugar', type: 'thirdPlace', matchFormat: null
    });
    await u.create('matches', {
      categoryId: categoryId, phaseId: thirdPhase.id,
      round: 1, order: 1,
      slotA: slot.loserOf(semiMatches[0].id),
      slotB: slot.loserOf(semiMatches[1].id),
      status: 'aguardando'
    });

    await u.commit();
    return { semiMatches: semiMatches, finalMatch: finalMatch, bestLoserIds: wcLosers.map(function (l) { return l.teamId; }) };
  };

  P.deleteKnockout = async function (categoryId) {
    var allPhases = await this.list('phases', { categoryId: categoryId });
    var koPhases = allPhases.filter(function (p) {
      return p.type === 'knockout' || p.type === 'thirdPlace' || p.type === 'wildcard' || p.type === 'bestLoserSemi';
    });
    if (!koPhases.length) return { deleted: 0 };
    var u = this._unit();
    var deleted = 0;
    for (var i = 0; i < koPhases.length; i++) {
      var matches = await this.list('matches', { phaseId: koPhases[i].id });
      for (var j = 0; j < matches.length; j++) { await u.remove('matches', matches[j].id); deleted++; }
      await u.remove('phases', koPhases[i].id);
    }
    await u.commit();
    return { deleted: deleted };
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);


</script>
<script>/* src/store/simulation.js */
/* Simulação de torneio — Etapa 11.
 * Cria 3 categorias com 9 duplas cada (3 chaves de 3, top 2 = 6 classificados = não pow2).
 * Testa os 3 modos de repescagem: seedRanking, virtualGroup, bestLoser.
 * Também cria categoria padrão 4×4 (pow2) para validar fluxo normal. */
(function (root) {
  'use strict';
  var VT = root.VT, P = VT.Store.prototype;

  var TEAM_NAMES_9 = ['Tubarões','Águias','Trovões','Fênix','Panteras','Dragões','Lobos','Falcões','Titãs'];
  var TEAM_NAMES_16 = [
    'Tubarões','Águias','Trovões','Fênix','Panteras','Dragões','Lobos','Falcões',
    'Titãs','Leões','Cometas','Raios','Vulcões','Cobras','Tempestade','Estrelas'
  ];

  function mf(pts) { return { bestOf: 1, pointsToWin: pts, tiebreakPoints: null, minDiff: null, maxPoints: null }; }

  function randomScore(target) {
    var lo = Math.floor(target * 0.3) + Math.floor(Math.random() * Math.floor(target * 0.4));
    if (lo >= target - 1) lo = target - 2;
    if (lo < 0) lo = 0;

  async function simCategory(store, tournamentId, catDef) {
    var cat = await store.create('categories', {

      gender: catDef.gender || 'Feminino', level: catDef.level || 'Iniciante',
      modality: 'areia', teamType: { key: 'dupla', label: 'Dupla', size: 2 },
      useAthletes: false, teamsCount: catDef.teams.length

    for (var ti = 0; ti < catDef.teams.length; ti++) {
      teams.push(await store.create('teams', { categoryId: cat.id, name: catDef.teams[ti] }));

    var teamsPerGroup = catDef.groupsConfig.teamsPerGroup;

  async function playKoPhase(store, koResult) {
    var koPhaseId = koResult.knockoutPhase.id;

    if (koResult.bracketMode === 'bestLoser') {
      var qfM = await store.list('matches', { phaseId: koPhaseId });
      qfM.sort(function (a, b) { return a.order - b.order; });
      for (var qi = 0; qi < qfM.length; qi++) {
        if (qfM[qi].status !== 'finalizado') await store.recordResult(qfM[qi].id, { sets: [randomScore(18)] });

    var koPhase = allPhases.filter(function (p) { return p.id === koPhaseId; })[0];
    var km = await store.list('matches', { phaseId: koPhaseId });
    km.sort(function (a, b) { return a.round - b.round || a.order - b.order; });
    var maxRound = km.reduce(function (mx, m) { return Math.max(mx, m.round); }, 0);
    for (var ki = 0; ki < km.length; ki++) {
      var m = km[ki];

    var thirdPhase = allPhases2.filter(function (p) { return p.type === 'thirdPlace'; })[0];
    if (thirdPhase) {
      var tpm = await store.list('matches', { phaseId: thirdPhase.id });
      for (var ti = 0; ti < tpm.length; ti++) {
        if (tpm[ti].status !== 'finalizado') await store.recordResult(tpm[ti].id, { sets: [randomScore(21)] });
      }
    }
  }

  P.simulateTournament = async function (opts) {
    opts = opts || {};
    var store = this;

    var res = await store.createTournament({
      name: opts.name || 'Torneio Repescagem (Etapa 11)',
      startDate: opts.startDate || '2026-11-15',
      endDate: opts.endDate || '2026-11-16',
      venue: opts.venue || 'Arena Simulação',
      modality: 'areia'
    });
    var tournament = res.tournament;
    var catResults = [];

    // ── CATEGORIAS COM REPESCAGEM (9 duplas, 3 chaves, 2 classificados = 6 → não pow2) ──
    var wcCats = [
      { name: 'Feminino A — Ranking Geral', gender: 'Feminino', level: 'A', bracketMode: 'seedRanking',
        teams: TEAM_NAMES_9.map(function (n) { return n + ' FA'; }),
        groupsConfig: { groups: 3, teamsPerGroup: 3, qualifiedPerGroup: 2, format: 'roundRobin', legs: 1 } },
      { name: 'Feminino B — Grupo Virtual', gender: 'Feminino', level: 'B', bracketMode: 'virtualGroup',
        teams: TEAM_NAMES_9.map(function (n) { return n + ' FB'; }),
        groupsConfig: { groups: 3, teamsPerGroup: 3, qualifiedPerGroup: 2, format: 'roundRobin', legs: 1 } },
      { name: 'Feminino C — Melhor Perdedor', gender: 'Feminino', level: 'C', bracketMode: 'bestLoser',
        teams: TEAM_NAMES_9.map(function (n) { return n + ' FC'; }),
        groupsConfig: { groups: 3, teamsPerGroup: 3, qualifiedPerGroup: 2, format: 'roundRobin', legs: 1 } }
    ];

    for (var wi = 0; wi < wcCats.length; wi++) {
      var catDef = wcCats[wi];
      var simResult = await simCategory(store, tournament.id, catDef);
      var koResult = await store.generateKnockout(simResult.cat.id, null, { bracketMode: catDef.bracketMode });
      await playKoPhase(store, koResult);
      catResults.push({ category: simResult.cat, teams: simResult.teams, bracketMode: catDef.bracketMode });
    }

    // ── CATEGORIA PADRÃO (16 duplas, 4 chaves, pow2 normal) ──
    var stdDef = {
      name: 'Masculino Padrão', gender: 'Masculino', level: 'Padrão',
      teams: TEAM_NAMES_16.map(function (n) { return n + ' MP'; }),
      groupsConfig: { groups: 4, teamsPerGroup: 4, qualifiedPerGroup: 2, format: 'roundRobin', legs: 1 }
    };
    var stdSim = await simCategory(store, tournament.id, stdDef);
    var stdKo = await store.generateKnockout(stdSim.cat.id);
    await playKoPhase(store, stdKo);
    catResults.push({ category: stdSim.cat, teams: stdSim.teams, bracketMode: 'normal' });

    return { tournament: tournament, categories: catResults };
  };

<script>/* src/licensing/license-provider.js */
/* VT.licensing — ponto de extensão do licenciamento. ISOLADO: não conhece Store, Repository nem
 * persistência, e nada fora desta pasta o chama na Etapa 1 (o Store funciona sem ele).
 *
 * Quatro coisas que NÃO se misturam (ver também VT.exchange):
 *   1. dados do torneio            Tournament/Category/... (viajam no export)
 *   2. identidade do cliente       License.licenseId / customerId (emitidas pelo servidor)
 *   3. ativação do dispositivo     License.token / activatedAt / lastValidatedAt / tournamentId (locais; NUNCA viajam)
 *   4. proveniência portátil       Tournament.licenseOrigin {licenseId, customerId} (viaja; sem segredo, sem autoridade)
 * Ao importar um torneio, Tournament.licenseCheck = 'pending': o provedor revalida quando puder.
 *
 * POLÍTICA (resolveOperation): o licenciamento NUNCA bloqueia um torneio em andamento, e qualquer falha
 * do provedor (inclusive rede) é tratada como "permitido" (offline-first). */
(function (root) {
  'use strict';
  var VT = root.VT, E = VT.errors;

  function nyi(name) { return new E.VTError('NOT_IMPLEMENTED', 'LicenseProvider.' + name + ' não implementado.'); }

  class LicenseProvider {
    async getStatus() { throw nyi('getStatus'); }                 // -> { status, source, licenseId, expiresAt, features }
    async hasFeature() { throw nyi('hasFeature'); }               // (nome) -> boolean
    async canCreateTournament() { throw nyi('canCreateTournament'); }   // -> { allowed, reason }
    async canOperate() { throw nyi('canOperate'); }               // (torneio) -> { allowed, mode: 'full'|'readonly', reason }
    async activate() { throw nyi('activate'); }                   // (chave) -> status
    async validate() { throw nyi('validate'); }                   // revalida a licença do dispositivo
    async revalidate() { throw nyi('revalidate'); }               // (torneio importado) -> { checked, ... }
  }

  // Padrão de hoje: tudo liberado, sem servidor.
  class OfflineTrialProvider extends LicenseProvider {
    async getStatus() { return { status: 'trial', source: 'offline', licenseId: null, expiresAt: null, features: ['*'] }; }
    async hasFeature() { return true; }
    async canCreateTournament() { return { allowed: true, reason: 'offline-trial' }; }
    async canOperate() { return { allowed: true, mode: 'full', reason: 'offline-trial' }; }
    async activate() { throw new E.VTError('LICENSE_UNAVAILABLE', 'A ativação exige o provedor remoto (ainda não disponível).'); }
    async validate() { return { checked: false, reason: 'offline' }; }
    async revalidate() { return { checked: false, reason: 'offline' }; }   // continua pendente; nunca bloqueia
  }

  // Esqueleto do futuro provedor (API de licença). Sem rede nesta etapa.
  class RemoteProvider extends LicenseProvider {
    constructor(opts) { super(); this.endpoint = (opts && opts.endpoint) || null; }
  }

  function needsRevalidation(tournament) { return !!tournament && tournament.licenseCheck === 'pending'; }

  // Única porta pela qual a aplicação deve perguntar "posso operar?". Aplica a política acima.
  async function resolveOperation(provider, tournament) {
    var decision;
    try { decision = await provider.canOperate(tournament); }
    catch (e) { return { allowed: true, mode: 'full', reason: 'provider-unavailable', forced: true }; }
    if (!decision || typeof decision.allowed !== 'boolean') return { allowed: true, mode: 'full', reason: 'invalid-decision', forced: true };
    if (!decision.allowed && tournament && tournament.status === 'andamento')
      return { allowed: true, mode: 'full', reason: 'running-tournament', forced: true };
    return decision;
  }

  VT.licensing = {
    LicenseProvider: LicenseProvider, OfflineTrialProvider: OfflineTrialProvider, RemoteProvider: RemoteProvider,
    needsRevalidation: needsRevalidation, resolveOperation: resolveOperation
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

    { id: 'teams',      label: 'Equipes',       path: '/teams',      ready: true },
    { id: 'draw',       label: 'Sorteio e Grupos', path: '/draw',    ready: true },
    { id: 'matches',    label: 'Jogos',         path: '/matches',    ready: true },
    { id: 'bracket',    label: 'Chaves',        path: '/bracket',    ready: true },
    { id: 'standings',  label: 'Classificação', path: '/standings',  ready: true },
    { id: 'results',    label: 'Resultados',    path: '/results',    ready: true },
    { id: 'settings',   label: 'Configurações', path: '/settings',   ready: true }

  // ---- roteador ----
  ui.routes = [];
  function compile(pattern) {

    return { pattern: pattern, names: names, re: new RegExp('^' + re + '/?$') };

  ui.route = function (pattern, view) {            // registrar de novo o mesmo padrão substitui a view

  };
  function match(path) {
    for (var i = 0; i < ui.routes.length; i++) {

    this.rootEl.appendChild(h('div', { class: 'app' },
      h('aside', { class: 'sidebar' },
        h('a', { class: 'brand', href: '#/dashboard' }, h('span', { class: 'brand-mark' }, '🏐'), h('span', null, h('strong', null, 'SalPoint'), h('small', null, 'Gestão de torneios'))),
        this.nav,
        h('div', { class: 'side-foot' }, h('span', { class: 'dot' }), 'Funciona sem internet', h('br'), 'Dados salvos neste aparelho')),
      h('div', { class: 'main' }, h('header', { class: 'topbar' }, this.crumbs, this.actions), this.tbar, this.view)));
    this.rootEl.appendChild(this.bottomNav);

  App.prototype.start = async function () {

  App.prototype.navigate = function (path) {

  App.prototype.run = async function (fn) {           // marca trabalho em andamento (usado por envios de formulário)
    this.pending++;

    for (var i = 0; i < 200; i++) {
      await new Promise(function (r) { root.setTimeout(r, 0); });

  App.prototype.currentOrLatestTournament = async function () {

  App.prototype.render = async function () {
    var self = this, token = ++this.token;

      var m = match(path);
      var qp = {};
      if (hashParts[1]) hashParts[1].split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) qp[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); });

      if (token !== this.token) return;

    ];
    var primaryActive = false;
    PRIMARY_BN.forEach(function (item) {
      var active = r.section === item.id || r.tab === item.id;
      if (active) primaryActive = true;
      self.bottomNav.appendChild(h('a', { class: 'bn-item' + (active ? ' active' : ''), href: '#' + item.href, 'aria-current': active ? 'page' : null },

    var sheetLinks = [];

        { id: 'teams',       label: 'Equipes',            glyph: '👥', href: '/t/' + tid + '/teams' },
        { id: 'draw',        label: 'Sorteio e Grupos',   glyph: '🎲', href: '/t/' + tid + '/draw' },
        { id: 'results',     label: 'Resultados',         glyph: '📋', href: '/t/' + tid + '/results' },
        { id: 'settings',    label: 'Configurações',      glyph: '⚙',  href: '/t/' + tid + '/settings' }
      ];
      if (t && t.status === 'andamento') sheetLinks.push({ id: 'tv', label: 'Modo TV / Telão', glyph: '📺', href: '/t/' + tid + '/tv' });
      sheetLinks.push(null);
    }
    sheetLinks.push({ id: 'tournaments', label: 'Todos os torneios', glyph: '🏆', href: '/tournaments' });
    if (isAdmin) sheetLinks.push({ id: 'acesso', label: 'Acesso público', glyph: '🔑', href: '/acesso' });
    var bsOverlay = this.bottomOverlay, bsSheet = this.bottomSheet;
    sheetLinks.forEach(function (item) {
      if (!item) { bsSheet.appendChild(h('div', { class: 'bs-sep' })); return; }
      var active = r.tab === item.id || r.section === item.id;
      var a = h('a', { class: 'bs-item' + (active ? ' active' : ''), href: '#' + item.href, 'aria-current': active ? 'page' : null },
        h('span', { class: 'bs-glyph', 'aria-hidden': 'true' }, item.glyph), item.label);
      a.onclick = function () { bsSheet.hidden = true; bsOverlay.hidden = true; };

    });
    var maisActive = !primaryActive && !!tid;
    var maisBtn = h('button', { class: 'bn-item' + (maisActive ? ' active' : ''), type: 'button', 'aria-expanded': 'false', 'aria-label': 'Mais opções' },
      h('span', { class: 'bn-icon', 'aria-hidden': 'true' }, '☰'),

    maisBtn.onclick = function () {

    this.bottomNav.appendChild(maisBtn);
    // migalhas + ações
    ui.clear(this.crumbs);
    (r.crumbs || []).forEach(function (c, i, all) {
      if (i) self.crumbs.appendChild(h('span', { class: 'sep' }, '›'));
      self.crumbs.appendChild(c.href && i < all.length - 1 ? h('a', { href: '#' + c.href }, c.label) : h('span', { class: 'here' }, c.label));
    });
    ui.clear(this.actions); (r.actions || []).forEach(function (a) { self.actions.appendChild(a); });
    // barra do torneio (abas)
    ui.clear(this.tbar);
    this.tbar.hidden = !t;
    if (t) {
      var tbarTitle = h('div', { class: 'tbar-title' }, h('strong', null, t.name), ui.badge(ui.label(ui.labels.tournamentStatus, t.status), t.status === 'andamento' ? 'success' : t.status === 'encerrado' ? 'muted' : 'info'));
      if (t.status === 'andamento') tbarTitle.appendChild(h('a', { class: 'btn sm btn-telao', href: '#' + ui.tpath(t, '/tv'), title: 'Modo TV/Telão' }, '📺 Telão'));
      this.tbar.appendChild(tbarTitle);
      this.tbar.appendChild(h('nav', { class: 'tabs', 'aria-label': 'Seções do torneio' }, ui.TOURNAMENT_NAV.map(function (n) {
        return h('a', { class: 'tab' + (r.tab === n.id ? ' active' : '') + (n.ready ? '' : ' soon'), href: '#/t/' + t.id + n.path, title: n.ready ? null : 'Disponível em uma próxima etapa', 'aria-current': r.tab === n.id ? 'page' : null },
          n.label);
      })));
    }
    // conteúdo
    ui.clear(this.view); this.view.appendChild(r.content);
    if (this.keepScroll) this.keepScroll = false; else { try { root.scrollTo(0, 0); } catch (e) { /* ambientes sem scroll */ } }
  };

  App.prototype.showError = function (e) {
    var notFound = e && e.code === 'NOT_FOUND';
    if (!notFound) console.error(e);

  // Inicialização: a UI só recebe o Store pronto.

  ['categories', 'teams', 'settings'].forEach(function (id) {

<script>/* src/ui/backup.js */
/* Backup na interface: exportar tudo para um arquivo JSON e importar um arquivo existente.
 * Usa SOMENTE o mecanismo que já existe no Store/exchange (exportAll, exportToJson, importDocument):
 * a validação do arquivo (formato, versão, checksum, estrutura, referências, consistência) acontece
 * dentro do importador, ANTES de gravar qualquer coisa. Aqui só há apresentação. */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;

  function download(name, text) {
    var doc = root.document, blob = new root.Blob([text], { type: 'application/json' }), url = root.URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name, hidden: true });
    doc.body.appendChild(a); a.click(); a.remove();
    root.setTimeout(function () { root.URL.revokeObjectURL(url); }, 1500);
  }
  function readText(file) {
    return new Promise(function (resolve, reject) {
      var r = new root.FileReader();
      r.onload = function () { resolve(String(r.result)); }; r.onerror = function () { reject(r.error || new Error('Não foi possível ler o arquivo.')); };
      r.readAsText(file);
    });
  }

  function errorDialog(err) {
    var items = (err && err.issues || []).slice(0, 5).map(function (i) { return h('li', null, (i.path ? i.path + ': ' : '') + i.message); });
    var modal = ui.openModal({ title: 'Não foi possível importar', body: h('div', null,
      h('p', null, err && err.message ? err.message : String(err)),
      items.length ? h('ul', { class: 'issues' }, items) : null,
      h('p', { class: 'muted' }, 'Nenhum dado foi alterado.'),
      h('div', { class: 'form-actions' }, h('button', { type: 'button', class: 'btn primary', dataset: { action: 'close' }, onClick: function () { modal.close(true); } }, 'Entendi'))) });
    return modal.closed;
  }

  // O arquivo contém torneio(s) que já existem neste aparelho: o usuário decide.
  function conflictDialog() {
    var modal = ui.openModal({ title: 'Esses torneios já existem aqui', body: h('div', null,
      h('p', null, 'O arquivo contém torneio(s) que já estão neste aparelho. O que você quer fazer?'),
      h('p', { class: 'muted' }, 'Substituir restaura os dados do arquivo (alterações feitas depois do backup serão perdidas). Importar como cópia mantém o que existe e cria novos torneios.'),
      h('div', { class: 'form-actions' },
        h('button', { type: 'button', class: 'btn danger', dataset: { action: 'replace' }, onClick: function () { modal.close('replace'); } }, 'Substituir'),
        h('button', { type: 'button', class: 'btn primary', dataset: { action: 'copy' }, onClick: function () { modal.close('copy'); } }, 'Importar como cópia'),
        h('button', { type: 'button', class: 'btn', onClick: function () { modal.close(null); } }, 'Cancelar'))) });
    return modal.closed;
  }

  async function exportBackup(ctx) {
    var n = (await ctx.store.list('tournaments')).length;
    if (!n) { ui.toast('Não há torneios para exportar.', 'error'); return; }
    var json = await ctx.run(async function () { return ctx.store.exportToJson(await ctx.store.exportAll()); });
    download('erp-volei-backup-' + VT.clock.now().slice(0, 10) + '.json', json);
    ui.toast('Backup exportado (' + ui.plural(n, 'torneio', 'torneios') + ').');
  }

  async function importBackup(ctx, file) {
    var text;
    try { text = await readText(file); } catch (e) { return errorDialog(e); }
    var res;
    try {
      res = await ctx.run(function () { return ctx.store.importDocument(text); });
    } catch (err) {
      if (!(err && err.code === 'ALREADY_EXISTS')) return errorDialog(err);
      var mode = await conflictDialog();
      if (!mode) return;
      try { res = await ctx.run(function () { return ctx.store.importDocument(text, { onConflict: mode }); }); }
      catch (err2) { return errorDialog(err2); }
    }
    try { await ctx.store.recordImport(res.tournamentIds); } catch (e) { /* o histórico é informativo: nunca bloqueia a importação */ }
    ui.toast('Backup importado (' + ui.plural(res.tournamentIds.length, 'torneio', 'torneios') + ').');
    await ctx.refresh();          // recarrega a tela com os dados importados
  }

  ui.backupControls = function (ctx) {
    var input = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, dataset: { testid: 'backup-file' }, onChange: function () {
      var f = input.files && input.files[0]; if (!f) return;
      importBackup(ctx, f).then(function () { input.value = ''; });
    } });
    return h('div', { class: 'head-actions', dataset: { testid: 'backup' } },
      h('button', { type: 'button', class: 'btn', dataset: { action: 'export-backup' }, onClick: function () { exportBackup(ctx); } }, '⭳ Exportar backup'),
      h('button', { type: 'button', class: 'btn', dataset: { action: 'import-backup' }, onClick: function () { input.click(); } }, '⭱ Importar backup'),
      input);
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/ui/views-tournaments.js */
/* Telas: Dashboard, Torneios, formulário de torneio e visão geral do torneio. */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h;

  function statusBadge(t) { return ui.badge(ui.label(ui.labels.tournamentStatus, t.status), t.status === 'andamento' ? 'success' : t.status === 'encerrado' ? 'muted' : 'info'); }
  function modalityBadge(t) { return ui.badge(ui.label(ui.labels.modality, t.modality), 'accent'); }
  function newest(a, b) { return a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0; }
  var BTN_NEW = function () { return h('a', { class: 'btn primary', href: '#/tournaments/new' }, '+ Novo torneio'); };
  function btnSimulate(ctx) {
    return h('button', { class: 'btn', dataset: { testid: 'simulate-btn' }, onClick: async function () {
      var ok = await ui.confirmDialog({ title: 'Simular torneio', confirmLabel: 'Simular',
        message: 'Criar um torneio simulado com 9 categorias (3 níveis × 3 gêneros), 16 equipes cada, fase de grupos e fase eliminatória completa?' });
      if (!ok) return;
      ui.toast('Gerando simulação...', 'info');
      try {
        var res = await ctx.store.simulateTournament();
        ui.toast('Torneio simulado criado com ' + res.categories.length + ' categorias!', 'success');
        location.hash = '#' + ui.tpath(res.tournament);
      } catch (err) { ui.toast(err.message || String(err), 'error'); }
    } }, 'Simular torneio');
  }

  // ---------- Dashboard ----------
  ui.route('/', function (ctx) { return { redirect: '/dashboard' }; });
  ui.route('/dashboard', async function (ctx) {
    var list = (await ctx.store.list('tournaments')).sort(newest);
    var sums = await Promise.all(list.map(function (t) { return ctx.store.tournamentSummary(t.id); }));
    var content = list.length
      ? h('div', { class: 'cards', dataset: { testid: 'tournament-cards' } }, list.map(function (t, i) {
        return h('article', { class: 'card t-card', dataset: { tournament: t.id } },
          h('div', { class: 'row between' }, h('h3', null, h('a', { href: '#' + ui.tpath(t) }, t.name)), statusBadge(t)),
          h('dl', { class: 'meta' },
            h('div', null, h('dt', null, 'Data'), h('dd', null, ui.fmtRange(t.startDate, t.endDate))),
            h('div', null, h('dt', null, 'Local'), h('dd', null, t.venue || 'Não informado')),
            h('div', null, h('dt', null, 'Modalidade'), h('dd', null, modalityBadge(t))),
            h('div', null, h('dt', null, 'Categorias'), h('dd', null, String(sums[i].categories)))),
          h('div', { class: 'row gap' }, h('a', { class: 'btn primary', href: '#' + ui.tpath(t) }, 'Abrir'),
            h('a', { class: 'btn', href: '#/tournaments/' + t.id + '/edit' }, 'Editar')));

    var container = h('div', { class: 'wz-wrap' });

        h('div', null, h('dt', null, 'Nome'), h('dd', null, d.name)),

<script>/* src/ui/views-matches.js */
/* Tela "Jogos": geração de jogos round-robin, lista de jogos, agendamento, resultado, cancelamento.
 * Só apresentação: toda regra mora no Store/engines. */
(function (root) {
  'use strict';
  var VT = root.VT, ui = VT.ui, h = ui.h, SC = VT.engines.score, MG = VT.engines.matchgen, WA = ui.wa;

  var STATUS_LABEL = { aguardando: 'Aguardando', agendado: 'Agendado', andamento: 'Em andamento', finalizado: 'Finalizado', cancelado: 'Cancelado' };
  var STATUS_TONE = { aguardando: 'muted', agendado: 'info', andamento: 'accent', finalizado: 'success', cancelado: 'muted' };

  function msg(err) { return err && err.issues && err.issues[0] ? err.issues[0].message : (err && err.message) || 'Operação não permitida.'; }
  async function act(ctx, fn, ok) {
    try { await ctx.run(fn); if (ok) ui.toast(ok); } catch (err) { ui.toast(msg(err), 'error'); }
    await ctx.refresh();
  }

  var SLOT_ROUND_NAMES = { 2: 'Final', 4: 'Semi', 8: 'Quartas', 16: 'Oitavas' };

  function slotMatchLabel(refM, matchesById) {
    if (!refM || !matchesById) return null;
    var count = 0;
    var keys = Object.keys(matchesById);
    for (var i = 0; i < keys.length; i++) {
      var rm = matchesById[keys[i]];
      if (rm.round === refM.round && rm.phaseId === refM.phaseId) count++;
    }
    var rName = SLOT_ROUND_NAMES[count * 2] || ('R' + refM.round);
    return rName + (count > 1 ? ' ' + refM.order : '');
  }

  function teamName(teams, slot, matchesById) {
    if (!slot) return '—';
    if (slot.type === 'team') { var t = teams[slot.teamId]; return t ? t.name : '(equipe removida)'; }
    if (slot.type === 'winnerOf' || slot.type === 'loserOf') {
      var refM = matchesById && matchesById[slot.matchId];
      if (refM && refM.status === 'finalizado' && refM.slotA && refM.slotA.type === 'team' && refM.slotB && refM.slotB.type === 'team') {
        var sA = 0, sB = 0;
        if (refM.resultType === 'wo' || refM.resultType === 'desistencia') { sA = 1; }
        else if (refM.sets && refM.sets.length) { refM.sets.forEach(function (s) { if (s.a > s.b) sA++; else if (s.b > s.a) sB++; }); }
        var isW = slot.type === 'winnerOf';
        var tid = isW ? (sA > sB ? refM.slotA.teamId : refM.slotB.teamId) : (sA > sB ? refM.slotB.teamId : refM.slotA.teamId);
        var rt = teams[tid];
        if (rt) return rt.name;
      }
      var prefix = slot.type === 'winnerOf' ? 'Venc. ' : 'Perd. ';
      var label = slotMatchLabel(refM, matchesById);
      return label ? prefix + label : prefix + slot.matchId.slice(-4);
    }

  }

    if (!sets || !sets.length) return '—';

    else if (m.status === 'cancelado') { pillClass += 'pill-orange'; pillLabel = 'Cancelado'; }

    var primaryBtn = null;
    if (m.status === 'aguardando' || m.status === 'agendado') {
      primaryBtn = h('button', { class: 'match-primary-btn accent', onClick: function () { act(ctx, function () { return ctx.store.startMatch(m.id); }, 'Jogo iniciado'); } }, 'Iniciar');
    } else if (m.status === 'andamento') {
      primaryBtn = h('button', { class: 'match-primary-btn accent', onClick: function () { resultDialog(m, teams, ctx, matchesById); } }, 'Resultado');

      var sA = 0, sB = 0;

        ui.confirmDialog({ title: 'Cancelar jogo?', message: 'O jogo #' + m.order + ' será marcado como cancelado (WO).', danger: true, confirmLabel: 'Cancelar jogo' })
          .then(function (ok) { if (ok) act(ctx, function () { return ctx.store.cancelMatch(m.id); }, 'Jogo cancelado'); });

    } else if (m.status === 'andamento') {

        ui.confirmDialog({ title: 'Cancelar jogo?', message: 'O jogo #' + m.order + ' será marcado como cancelado (WO).', danger: true, confirmLabel: 'Cancelar jogo' })
          .then(function (ok) { if (ok) act(ctx, function () { return ctx.store.cancelMatch(m.id); }, 'Jogo cancelado'); });
      } }, 'Cancelar'));
    }
    if (tournament && category) {

      if (m.status === 'finalizado' && m.sets && m.sets.length) secBtns.push(WA.shareResultBtn(tournament, category, '#' + m.order, nameA, nameB, m.sets));
